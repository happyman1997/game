mastery_desc:
  diplomacy: "The shadow of a master diplomat: gets along with everyone and frightens no one. Dread fades twice as fast; cruelty weighs on them."
  martial: "The shadow of a master general: eager for battle and the front rank. The army fights harder, but they fall more often; peace bores them."
  stewardship: "The shadow of a master steward: counts every coin. The court likes them less, and generosity comes hard."
  intrigue: "The shadow of a master schemer: sees a plot in every whisper. Better protected than anyone, but factions rob them of sleep."
  learning: "The shadow of a master scholar: lost in books, forgetting worldly matters. Stewardship and martial suffer."
  prowess: "The shadow of a mighty warrior: always looking for a fight. Admired by some, feared by the court; peace bores them."
