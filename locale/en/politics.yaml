ui:
  politics: Court Politics
  dread: Dread
  dread_tip: "The fear a ruler inspires. It grows with executions, imprisonment without cause, revoked titles and crushed revolts, and fades over time. Timid subjects grow more loyal and stay out of factions; the brave and the wrathful hate a tyrant."
  powerful_vassals: Powerful vassals
  powerful_tip: "The vassals with the largest holdings expect a council seat: seated, they are content; passed over, they resent it and join factions more readily."
  in_council: on the council
  not_in_council: not on the council
  obligation: Obligations
  obligation_tip: "Privileges: half the taxes and levies, and a grateful vassal. Heavy duties: half as much again, a resentful vassal more likely to join the Liberty Party."
  privileges_tip: The vassal will pay half the taxes and send half the troops — and will be more loyal for it.
  heavy_duties_needs_right: "Requires a strong crown (at least High Authority), a strong hook on the vassal, or a lawful reason"
  heavy_duties_tip: The vassal will pay half as much again and bear a grudge. Your dread grows.
  discord_needs_intrigue: Requires intrigue of 8 or a spymaster at work
  discord_tip: "The chance depends on your intrigue and your spymaster's against the vassal's. If caught, they will not forgive it."
  great_council_tip: "Your vassals gather, and you choose what to ask for: an oath (vassals back claimants less), money, reconciliation (faction discontent falls) or — in wartime — troops."
  no_powerful: No powerful vassals — the realm is too small.
alert:
  powerful_snubbed: "Powerful vassals not on the council: {list}"
