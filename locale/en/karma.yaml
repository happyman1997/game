# Light and Ash feature: engine and UI strings.
tr:
  karma_tier: "Soul: {cond}"
fx:
  add_karma_light: A step toward the Light
  add_karma_ash: Ash on the soul
  cleanse_ash: Ash falls from the soul
  create_relics: The righteous one's relics are laid in a reliquary
msg:
  karma_tier_up: "Your soul grows lighter: “{tier}”."
  karma_tier_down: "Ash settles on your soul: “{tier}”."
stress_src:
  karma: Pangs of conscience
ui:
  karma_tier_mod: "Soul: {tier}"
  ctab:
    soul: Light and Ash
  soul: Light and Ash
  soul_tip: "The soul is weighed on the scales of the Sun Emperor. Every deed falls into the pan of Light or of Ash — not by words, but by deeds. People judge by the face — by piety, and piety can be bought. The soul is the truth: it does not change what others think of you, yet it decides omens, pangs of conscience, the afterlife and the Paths of Ash and Light."
  soul_light: Light
  soul_ash: Ash
  soul_value_light: "Light: {n}"
  soul_value_ash: "Ash: {n}"
  soul_value_none: The scales are balanced
  soul_hidden: "Another's soul is darkness: only its tier can be seen."
  soul_book: Last on the Scales
  soul_book_empty: Nothing lies on the scales yet.
  soul_cleanse_hint: "Ash does not fade on its own: confession and a pilgrimage to the Ashlands remove it. Light is gathered by mercy, just judgment, alms and pilgrimage."
  need_stress_or_ash: Requires at least 30 stress or ash on the soul
  need_piety_300: Requires 300 piety
  cast_out_holy_war: "Neighbours of your faith may wage holy war upon you, and a Living Saint may lead the Crusade of Light"
  relics_of: "Relics of {who}"
  soul_seals: Seals of Ash
  soul_seals_tip: "Three seals stand between the soul and the Prince of Ash. Every sin of an ashen soul may break the next one. Before the third seal the Ashlands can still release you; after it — only death or the prayer of a Living Saint."
  soul_vow: Vow to the Sun
  soul_vow_tip: "A Living Saint sees souls and hidden seals, works great miracles, prays for others' souls and leads the Crusade of Light. A grave sin — and the Light departs."
  seal_broken: broken
  seal_whole: intact
