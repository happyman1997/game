mastery_desc:
  diplomacy: "Тень мастерства дипломата: со всеми ладит — и никого не пугает. Страх перед ним тает вдвое быстрее, жестокость ему тяжела."
  martial: "Тень мастерства полководца: рвётся в бой и в первые ряды. Армия злее, но сам он чаще гибнет; без войны ему тоскливо."
  stewardship: "Тень мастерства управителя: считает каждую монету. Двор относится к нему хуже, а щедрость даётся с трудом."
  intrigue: "Тень мастерства интригана: видит заговор в каждом шёпоте. Защищён лучше всех, но фракции не дают ему спать."
  learning: "Тень мастерства учёного: витает в книгах, забывая о мирском. Управление и военное дело страдают."
  prowess: "Тень мастерства силача: ищет повода помериться силой. Женщины и мужчины засматриваются, двор побаивается; без войны скучает."
