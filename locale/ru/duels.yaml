# Схватка (engine/features/duels.gd)
duel:
  title:
    duel: Поединок
    mortal: Бой насмерть
    friendly: Учебный бой
    foe: Схватка
  intro:
    duel: "Круг очерчен, свидетели ждут. Бой идёт, пока кто-то не упадёт или не сдастся."
    mortal: "Пощады не будет: из круга выйдет один."
    friendly: "До первой крови: кто первым растеряет половину сил — проиграл."
    foe: "Отступать некуда."
  you: вы
  stance:
    attack: натиск
    guard: защита
    feint: хитрость
  stance_t:
    attack: Натиск
    guard: Защита
    feint: Хитрость
  stance_tip:
    attack: "Прямой тяжёлый удар. Сминает хитрость, но защита его ловит."
    guard: "Встретить удар и ответить. Ловит натиск, но хитрость её обходит."
    feint: "Ложный замах и удар в открывшееся место. Обходит защиту, но натиск её сминает."
  power: "Сила: {n}"
  tell:
    attack:
      "1": "{who} перехватывает рукоять обеими руками, плечи напряжены."
      "2": "{who} подаётся вперёд, будто готов сорваться с места."
      "3": "{who} смотрит прямо на вас и тяжело дышит сквозь зубы."
    guard:
      "1": "{who} приседает и прикрывается, глаза следят за вашим клинком."
      "2": "{who} отступает на полшага и ждёт."
      "3": "{who} держит оружие у груди, не торопясь нападать."
    feint:
      "1": "Глаза {who} бегают — то на ваши ноги, то на щит."
      "2": "{who} кружит, перекладывая вес с ноги на ногу."
      "3": "{who} едва заметно улыбается и опускает острие."
  tell_acc: "Насколько верно вы его читаете: ≈{n}%"
  tell_none: "Противник ничем себя не выдаёт."
  vigor: "Стойкость {v} из {m}"
  round: "Обмен {n} из {m}"
  your_move: "Ваш ход"
  yield: Сдаться
  yield_tip: "Бой кончится сейчас, но сдаться — позор: престиж, а храброму и гордому — мука. Что с вами будет, решит победитель."
  mercy_title: "Противник в вашей власти. Как поступить?"
  mercy_title_yield: "Противник сдаётся. Как поступить?"
  mercy:
    spare: Пощадить
    wound: Ранить
    kill: Убить
  mercy_tip:
    spare: "Слава великодушного и капля Света; побеждённый запомнит милость."
    wound: "Пусть носит рану в память о бое (павший может остаться увечным)."
    kill: "Страх и конец распре, но родня убитого не простит. Убить сдавшегося — Пепел."
  result:
    win: Победа
    lose: Поражение
  how:
    fall: "{l} — на земле."
    yield: "{l} — сдаётся."
    points: "Бой остановлен: силы на исходе, верх — за {w}."
    first_blood: "Первая кровь: верх — за {w}."
  fate:
    spare: "Исход: пощада."
    wound: "Исход: рана."
    kill: "Исход: смерть."
    none: ""
  fatal: "Удар оказался смертельным."
  close: Закрыть
  log_title: Ход боя
  odds: "Шанс ≈{n}% — при равной игре"
  log:
    beat_attack: "{a} — {sa}, {b} — {sb}. Натиск сминает уловку: {l} −{d}."
    beat_guard: "{a} — {sa}, {b} — {sb}. Защита ловит натиск и отвечает: {l} −{d}."
    beat_feint: "{a} — {sa}, {b} — {sb}. Хитрость обходит защиту: {l} −{d}."
    clash: "{a} — {sa}, {b} — {sb}. Сшиблись: {a} −{da}, {b} −{db}."
    circle: "{a} — {sa}, {b} — {sb}. Кружат, переводя дух."
    outwit: "{a} — {sa}, {b} — {sb}. Оба хитрят, ловчее — {w}: {l} −{d}."
    soft: "(удар смягчён)"
    crit: "Страшный удар!"
