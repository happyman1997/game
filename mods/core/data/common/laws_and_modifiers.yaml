# Законы наследования. algorithm — имя алгоритма из реестра движка:
# partition (разделение), primogeniture (первородство), seniority (старшинство).
# Моды могут добавить свои алгоритмы на JS.
succession_laws:
  partition:
    algorithm: partition
    gender: male_preference
    change_cost: { prestige: 200 }
  primogeniture:
    algorithm: primogeniture
    gender: male_preference
    change_cost: { prestige: 500 }
    can_change:
      tier: ">= duchy"
      custom_tooltip:
        text: ui.need_learning_8
        trigger: { learning: 8 }
  tanistry:
    algorithm: seniority
    gender: male_only
    change_cost: { prestige: 200 }
  equal_primogeniture:
    algorithm: primogeniture
    gender: equal
    change_cost: { prestige: 800 }
    can_change:
      tier: ">= kingdom"

# Модификаторы мнения: value — величина, decay — убывание в месяц,
# years/months — срок действия, stacking — можно ли получить несколько раз.
opinion_modifiers:
  generic: { value: 10 }
  gift: { value: 20, decay: 1 }
  grateful: { value: 15, years: 5 }
  feast_guest: { value: 10, years: 3 }
  granted_title: { value: 30, decay: 0.5 }
  revoked_title: { value: -50, decay: 0.3 }
  tyranny: { value: -15, years: 5, stacking: true }
  insulted: { value: -20, decay: 0.5 }
  refused_proposal: { value: -10, years: 2 }
  married_into_family: { value: 15, years: 10 }
  attempted_murder: { value: -60, decay: 0.3 }
  murdered_relative: { value: -80, decay: 0.2 }
  friend: { value: 60 }
  rival: { value: -60 }
  lover: { value: 50 }
  rejected_advances: { value: -15, years: 3 }
  swayed: { value: 25, years: 10 }
  vassalized: { value: 10, years: 10 }
  released: { value: 40, years: 15 }
  alms_given: { value: 5, years: 3 }
  pious_respect: { value: 10, years: 5 }
  humiliated: { value: -25, decay: 0.5 }
  supported: { value: 20, years: 5 }

