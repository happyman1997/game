# Местность (механика biomes, engine/features/biomes.gd; земля по клеткам —
# engine/world/land.gd и ядро native/src/land.rs). Карта нарезана на клетки,
# у каждой клетки — своё состояние земли, и его меняют люди, природа и война.
# Графство — смесь местностей: доход и набор (modifiers), рост
# (development_growth), оборона, скорость войск, полки и районы считаются по
# долям клеток. group — к какой местности состояние относится для полков,
# районов и условий (дремучий лес — тоже лес); господствующая местность
# графства (условие terrain) — самая большая группа. capital_modifiers — тому,
# чья столица здесь (тоже по долям).
# start — с чего начинается графство с такой местностью на карте: доли по
# порядку от селения к краям (поля у селения, лес по краям). Без start —
# графство целиком такое.
# drift — что делает природа: каждая клетка раз в год переходит в другое
# состояние с шансом 1/years (root — провинция, trigger проверяется для неё);
# near — от каких местностей это идёт (у клеток рядом с ними шанс выше: лес
# наступает от опушки). Клетки под работами природа не трогает.
# Работы (land_works) начинает владелец графства в окне провинции. Работа
# идёт участками: участок — share клеток графства (по умолчанию четверть),
# months месяцев и cost золота на участок; участок растёт от клеток grow_from
# (по умолчанию — от местности, в которую он превратится). Кончился участок
# — on_complete (его изнанка), и работа идёт дальше на следующий участок,
# пока есть подходящая земля и золото или пока её не остановят.

defines:
  land:
    cell_size: 7.5              # радиус клетки в пикселях карты
    patch_share: 0.25           # участок работы — такая доля клеток графства
    history_size: 12            # сколько записей в летописи земли
    speed_per_stewardship: 0.02 # каждое очко управления ускоряет работы на 2%
    min_speed_mult: 0.4         # быстрее, чем за 40% срока, не выйдет
    ai_frequency_months: 12     # как часто ИИ думает о своей земле
    ai_reserve_gold: 50         # ИИ берётся за работу, если после оплаты останется столько
    ai_counties_per_work: 4     # одна работа на столько графств домена
    ai_continue_mult: 2.5       # ИИ ведёт работу дальше с шансом ai_will_do × это, %

terrain:
  # ---------------------------------------------------------------- леса
  # Дремучий лес: глушь, звери, разбойники — мало дохода, много укрытия
  old_forest:
    group: forest
    pattern: old_forest
    color: "#2f5a33"
    defense: 0.3
    movement: 1.5
    height: 0.24
    development_growth: -0.04
    modifiers: { tax_mult: -0.2, levy_mult: -0.15 }
  forest:
    color: "#4f7a43"
    pattern: forest
    start: { plains: 0.15, forest: 0.65, old_forest: 0.2 }
    defense: 0.2
    movement: 1.3
    height: 0.2
    development_growth: -0.01
    modifiers: { tax_mult: -0.1 }
    drift:
      # глухой малолюдный лес дичает в дремучий
      - { to: old_forest, years: 60, near: old_forest, trigger: { development: "<= 5" } }
  # Гарь: выгоревший лес; не распашешь — лет через десять отрастёт
  burnt_forest:
    group: forest
    pattern: ash
    color: "#5b5a40"
    defense: 0.1
    movement: 1.2
    height: 0.14
    development_growth: -0.03
    modifiers: { tax_mult: -0.2, levy_mult: -0.1 }
    drift:
      - { to: forest, years: 10, near: forest, cause: regrowth }
  # Вырубка: пни и подлесок; не распашешь — зарастёт
  clearing:
    group: plains
    pattern: stumps
    color: "#a3a46a"
    defense: 0.05
    movement: 1.1
    height: 0.12
    development_growth: 0.02
    modifiers: { tax_mult: -0.05 }
    drift:
      - { to: forest, years: 12, near: forest, cause: regrowth }

  # ---------------------------------------------------------------- поля
  plains:
    color: "#c2c07e"
    pattern: grass
    start: { farmlands: 0.15, plains: 0.6, forest: 0.25 }
    height: 0.1
    drift:
      # без хозяина поле дичает
      - { to: heath, years: 8, trigger: { has_holder: no } }
  # Тучная пашня: хлеб и люди; со временем устаёт
  farmlands:
    color: "#a9b56a"
    pattern: fields
    start: { farmlands: 0.7, plains: 0.15, forest: 0.15 }
    height: 0.05
    development_growth: 0.06
    modifiers: { tax_mult: 0.1, levy_mult: 0.05 }
    drift:
      - { to: worn_fields, years: 60, cause: exhaustion }
      - { to: heath, years: 8, trigger: { has_holder: no } }
  # Истощённая пашня: родит скудно; под паром отдохнёт
  worn_fields:
    group: farmlands
    pattern: fields
    color: "#bdb27c"
    height: 0.06
    development_growth: -0.02
    modifiers: { tax_mult: -0.1 }
    drift:
      - { to: plains, years: 20, cause: rest }
  # Луг на месте осушенной топи: сено, кони, жирная земля
  meadow:
    group: plains
    pattern: grass
    color: "#8fb06a"
    height: 0.04
    defense: 0.05
    development_growth: 0.02
    modifiers: { tax_mult: 0.05, levy_mult: 0.1 }
    drift:
      # без присмотра канавы заплывают
      - { to: wetlands, years: 40, near: wetlands, trigger: { has_holder: no } }
  # Пустошь: вереск и камень
  heath:
    group: plains
    pattern: heath
    color: "#a89a6e"
    defense: 0.05
    movement: 1.1
    height: 0.12
    development_growth: -0.04
    modifiers: { tax_mult: -0.2, levy_mult: -0.15 }
    drift:
      - { to: forest, years: 30, near: forest, trigger: { development: "<= 4" }, cause: regrowth }
  # Пожарище: выжженные поля и деревни; лет через пять затянется
  burnt:
    group: plains
    pattern: ash
    color: "#6a5c4c"
    height: 0.1
    development_growth: -0.05
    modifiers: { tax_mult: -0.3, levy_mult: -0.25 }
    drift:
      - { to: plains, years: 5, cause: regrowth }

  # ---------------------------------------------------------------- вода и камень
  wetlands:
    color: "#6f8f7a"
    pattern: marsh
    start: { plains: 0.15, wetlands: 0.65, forest: 0.2 }
    defense: 0.25
    movement: 1.6
    height: 0.02
    development_growth: -0.02
    modifiers: { tax_mult: -0.1 }
    # болотная лихорадка
    capital_modifiers: { health: -0.3 }
  hills:
    color: "#9a8a5a"
    pattern: rough
    start: { plains: 0.15, hills: 0.7, forest: 0.15 }
    defense: 0.3
    movement: 1.4
    height: 0.45
  mountains:
    color: "#8a8178"
    pattern: rough
    start: { hills: 0.2, mountains: 0.8 }
    defense: 0.5
    movement: 1.8
    height: 0.85
    development_growth: -0.05

land_works:
  # Проредить дремучий лес: строевой лес на продажу, глушь отступает
  thin_old_forest:
    icon: "🌲"
    from: [old_forest]
    to: forest
    grow_from: [forest]
    months: 8
    cost: { gold: 15 }
    on_complete:
      - scope:actor: { add_gold: 12 }
    ai_will_do:
      value: 6
      add: { value: ai_greed, multiply: 2 }

  # Свести лес под пашню: брёвна и уголь на продажу, но лесной народ
  # (охотники, углежоги, бортники) ропщет, а у соседей ниже — разливы.
  # Рубят от опушки — от полей вглубь леса.
  clear_forest:
    icon: "🪓"
    from: [forest]
    to: clearing
    grow_from: [plains, farmlands]
    months: 10
    cost: { gold: 20 }
    during: { tax_mult: -0.05 }
    on_complete:
      - scope:actor: { add_gold: 15 }
      - add_county_opinion: forest_felled
      - every_neighbor:
          limit:
            has_holder: yes
            terrain: [farmlands, plains, wetlands]
            NOT: { has_province_modifier: flooding }
          random:
            chance: 12
            add_province_modifier: { id: flooding, years: 4 }
            save_scope_as: flooded
            holder:
              if:
                limit: { NOT: { is_same_as: scope:actor } }
                add_opinion: { target: scope:actor, modifier: flooded_my_land }
                trigger_event: land.0004
    ai_will_do:
      value: 4
      add:
        - { value: ai_greed, multiply: 3 }
        - { value: "scope:province.development", multiply: 0.4 }
      if:
        - limit: { has_trait: compassionate }
          multiply: 0.5
        # лес почти сведён — хватит
        - limit: { scope:province: { has_terrain: { terrain: forest, below: 0.25 } } }
          multiply: 0.3

  # Распахать вырубку, пустошь или пожарище — станут полем
  plough:
    icon: "⚒"
    from: [clearing, heath, burnt, burnt_forest]
    to: plains
    grow_from: [plains, farmlands]
    months: 5
    cost: { gold: 10 }
    ai_will_do:
      value: 12
      if:
        # вырубку и гарь — непременно, иначе зарастут
        - limit: { scope:province: { has_terrain: [clearing, burnt_forest] } }
          add: 30

  # Унавозить и распахать поле — станет тучной пашней (нужны руки)
  improve_fields:
    icon: "🌾"
    from: [plains]
    to: farmlands
    months: 10
    cost: { gold: 25 }
    potential: { development: ">= 6" }
    ai_will_do:
      value: 8
      add:
        - { value: stewardship, multiply: 0.8 }
        - { value: ai_greed, multiply: 2 }

  # Оставить истощённую пашню под паром: пока отдыхает, родит меньше
  fallow:
    icon: "🌱"
    from: [worn_fields]
    to: farmlands
    months: 8
    during: { tax_mult: -0.3 }
    ai_will_do:
      value: 30
      add: { value: stewardship, multiply: 1 }

  # Осушить топь: долго и дорого — но лихорадка уходит, а луг жирный
  drain_marsh:
    icon: "🌊"
    from: [wetlands]
    to: meadow
    grow_from: [meadow, plains, farmlands]
    months: 18
    cost: { gold: 45 }
    on_complete:
      - add_county_opinion: marsh_drained
    ai_will_do:
      value: 3
      add: { value: stewardship, multiply: 0.4 }

  # Распахать луг
  plough_meadow:
    icon: "⚒"
    from: [meadow]
    to: farmlands
    months: 6
    cost: { gold: 15 }
    ai_will_do:
      value: 4
      add: { value: ai_greed, multiply: 1 }

  # Насадить лес: внукам на брёвна и дичь
  plant_forest:
    icon: "🌳"
    from: [clearing, heath, burnt, burnt_forest, worn_fields]
    to: forest
    months: 18
    cost: { gold: 10 }
    on_complete:
      - add_county_opinion: forest_planted
    ai_will_do:
      value: 1
      if:
        - limit: { has_trait: [compassionate, patient] }
          add: 4
        - limit: { scope:province: { has_terrain: [heath, burnt] } }
          add: 3

opinion_modifiers:
  # мнение графств (add_county_opinion)
  forest_felled: { value: -15, years: 10 }
  forest_planted: { value: 10, years: 10 }
  marsh_drained: { value: 10, years: 5 }
  forest_spared: { value: 10, years: 5 }
  # мнение персонажей
  flooded_my_land: { value: -20, years: 10 }

modifiers:
  flooding: { icon: "🌊", modifiers: { tax_mult: -0.25, development_growth: -0.05 } }
  forest_outlaws: { icon: "🏹", modifiers: { tax_mult: -0.15, levy_mult: -0.1 } }
