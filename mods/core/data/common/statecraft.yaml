# Дела правителя, открытые всем: торговый договор, посредничество в чужой
# войне, поиск прав в архивах. Исход зависит от того, кто берётся: от
# мнения соседа, навыков, а перки стезей (stezi.yaml) делают их лучше.

modifiers:
  trade_pact: { icon: "⚖", modifiers: { tax_mult: 0.1, monthly_income: 0.5 }, good: true }

opinion_modifiers:
  trade_partner: { value: 15, years: 5 }
  mediated_peace: { value: 20, years: 10 }

interactions:
  # торговый договор с соседом — выгода обоим; хороший управитель убедительнее
  trade_pact:
    icon: "⚖"
    category: diplomacy
    is_shown:
      scope:actor: { is_ruler: yes }
      scope:recipient: { is_ruler: yes }
    is_valid:
      scope:actor: { NOT: { has_modifier: trade_pact } }
      scope:recipient: { NOT: { has_modifier: trade_pact } }
    ai_accept:
      value: 0
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.5 } }
        - { desc: ai.actor_stewardship, value: { value: "scope:actor.stewardship", subtract: 8, multiply: 2 } }
        - { desc: ai.different_faith, limit: { NOT: { same_faith_as: scope:actor } }, value: -20 }
        - { desc: ai.at_war, limit: { is_at_war_with: scope:actor }, value: -100 }
    on_accept:
      - add_modifier: { id: trade_pact, years: 5 }
      - scope:recipient:
          add_modifier: { id: trade_pact, years: 5 }
          add_opinion: { target: scope:actor, modifier: trade_partner }
    cooldown: { years: 5 }
    ai_targets: [neighboring_ruler]
    ai_frequency_months: 12
    ai_will_do:
      value: 5
      add: { value: stewardship, max: 20 }

  # посредничество: правитель мирит чужую войну — обоим сторонам мир, ему —
  # слава; слушают того, кого уважают и кто умеет говорить
  mediate_peace:
    icon: "🕊"
    category: diplomacy
    is_shown:
      scope:actor: { is_ruler: yes }
      scope:recipient: { is_ruler: yes, is_at_war: yes }
    is_valid:
      scope:actor: { NOT: { is_at_war_with: scope:recipient } }
    ai_accept:
      value: -10
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.6 } }
        - { desc: ai.actor_diplomacy, value: { value: "scope:actor.diplomacy", subtract: 8, multiply: 2 } }
        - { desc: ai.war_weary, value: 15 }
        - { desc: ai.ambitious, limit: { has_trait: [ambitious, wrathful] }, value: -20 }
    on_accept:
      - scope:recipient:
          make_white_peace: yes
          add_opinion: { target: scope:actor, modifier: mediated_peace }
      - add_prestige: 100
    cooldown: { years: 3 }
    ai_targets: [neighboring_ruler, vassal]
    ai_frequency_months: 12
    ai_will_do:
      value: 0
      add: { value: diplomacy, subtract: 6, max: 20 }

decisions:
  # в старых грамотах может найтись право на соседнюю землю — найдёт
  # учёный (Архивариус — почти наверняка)
  search_archives:
    category: personal
    icon: "📜"
    is_shown: { is_ruler: yes }
    cost: { gold: 50 }
    cooldown: { years: 4 }
    effect:
      - random_neighboring_county:
          limit: { NOT: { scope:actor: { has_claim_on: prev } } }
          save_scope_as: claim_target
      - if:
          limit: { exists: scope:claim_target }
          random:
            chance: { value: learning, multiply: 4, add: 10, if: { limit: { has_perk: archivist }, add: 40 }, max: 95 }
            add_claim: scope:claim_target
            send_message: { text: msg.archives_claim, kind: good }
    ai_check_months: 24
    ai_will_do:
      value: 0
      add: { value: learning, subtract: 8, multiply: 3, max: 30 }
