# Инвентарь и реликвии (механика artifacts, engine/features/artifacts.gd).
# Вещи — снаряжение правителя и убранство его двора: модификаторы дают
# только надетые. Вещи ветшают (чинят за золото), их заказывают у мастеров,
# дарят, берут трофеями в битвах и переплавляют; по смерти всё переходит
# основному наследнику. Отнятое оставляет притязание.
defines:
  artifacts:
    decay_per_year: 4          # прочность надетой вещи за год
    storage_decay_mult: 0.5    # в хранилище ветшают медленнее
    battle_wear: 2             # износ оружия и доспехов полководца за битву
    loot_chance: 0.12          # победитель снимает вещь с побеждённого полководца
    trophy_chance: 0.06        # …или подбирает чужое оружие на поле
    repair_mult: 0.6           # ремонт: ценность × износ × это
    melt_mult: 0.3             # переплавка: доля ценности
    storage_max: 10            # ИИ переплавляет лишнее
    claim_opinion: -10         # «держит мою вещь» (за каждую, до двух)
    ai_commission_chance: 0.04
    ai_commission_reserve: 60   # ИИ заказывает, если золота ≥ цена × 2 + это
    ai_repair_below: 0.35
    ai_repair_reserve: 20       # …и чинит, если золота ≥ ремонт + это
    commission_skill: stewardship
    commission_skill_base: 8
    commission_skill_step: 0.04
    # стартовые вещи правителей по рангу: slot или types, rarity,
    # upgrade — шанс на редкость выше, chance — шанс вообще получить
    start:
      county:
        - { slot: weapon, rarity: common, chance: 0.5 }
        - { slot: trinket, rarity: common, chance: 0.3 }
      duchy:
        - { slot: weapon, rarity: common, upgrade: 0.5 }
        - { slot: regalia, types: [circlet, scepter], rarity: common, chance: 0.6 }
        - { slot: armor, rarity: common, chance: 0.5 }
        - { slot: trinket, rarity: common, upgrade: 0.3, chance: 0.6 }
        - { slot: wall, rarity: common, chance: 0.5 }
      kingdom:
        - { slot: regalia, types: [crown], rarity: masterwork, upgrade: 0.4 }
        - { slot: weapon, rarity: masterwork, upgrade: 0.2 }
        - { slot: armor, rarity: common, upgrade: 0.5 }
        - { slot: helmet, rarity: common, upgrade: 0.5 }
        - { slot: throne, rarity: masterwork, upgrade: 0.3 }
        - { slot: wall, rarity: common, upgrade: 0.5 }
        - { slot: pedestal, rarity: common, upgrade: 0.5 }
        - { slot: trinket, rarity: masterwork, chance: 0.7 }
      empire:
        - { slot: regalia, types: [crown], rarity: famed, upgrade: 0.3 }
        - { slot: weapon, rarity: masterwork, upgrade: 0.5 }
        - { slot: armor, rarity: masterwork }
        - { slot: helmet, rarity: masterwork }
        - { slot: throne, rarity: famed }
        - { slot: wall, rarity: masterwork }
        - { slot: pedestal, rarity: masterwork }
        - { slot: trinket, rarity: masterwork }

opinion_modifiers:
  artifact_gift: { value: 15, years: 10 }
  returned_artifact: { value: 15, years: 10 }
  refused_artifact: { value: -20, years: 10 }

# ---------------------------------------------------------------- слоты
artifact_slots:
  helmet:   { group: personal, order: 1, icon: helm }
  regalia:  { group: personal, order: 2, icon: crown }
  armor:    { group: personal, order: 3, icon: armor }
  weapon:   { group: personal, order: 4, icon: sword }
  trinket:  { group: personal, order: 5, icon: ring, count: 3 }
  throne:   { group: court, order: 10, icon: throne }
  wall:     { group: court, order: 11, icon: tapestry, count: 2 }
  pedestal: { group: court, order: 12, icon: goblet, count: 2 }

# ---------------------------------------------------------------- редкость
artifact_rarities:
  common:      { order: 1, mult: 1.0, bonuses: 0, durability: 50,  value: 30,  gift_opinion: 10, color: "#c9c3b4" }
  masterwork:  { order: 2, mult: 1.5, bonuses: 1, durability: 70,  value: 80,  gift_opinion: 20, color: "#7fb4e6" }
  famed:       { order: 3, mult: 2.2, bonuses: 1, durability: 90,  value: 200, gift_opinion: 35, color: "#c58bf0" }
  illustrious: { order: 4, mult: 3.0, bonuses: 2, durability: 110, value: 500, gift_opinion: 50, color: "#f0b44a" }

# ---------------------------------------------------------------- заказ мастеру
commission_tiers:
  modest: { order: 1, cost: 40,  months: 4,  chances: { common: 75, masterwork: 23, famed: 2 } }
  fine:   { order: 2, cost: 120, months: 8,  chances: { common: 20, masterwork: 60, famed: 18, illustrious: 2 } }
  lavish: { order: 3, cost: 350, months: 12, chances: { masterwork: 35, famed: 50, illustrious: 15 } }

