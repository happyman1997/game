# ---------------------------------------------------------------- взаимодействия
interactions:
  # подарить вещь из своего инвентаря
  gift_artifact:
    requires_feature: artifacts
    icon: "🎁"
    category: diplomacy
    is_shown:
      scope:actor: { num_artifacts: "> 0" }
      scope:recipient: { is_adult: yes }
    target:
      provider: own_artifacts
      title: ui.inv_choose_artifact
    auto_accept: yes
    on_accept:
      - transfer_artifact: { artifact: scope:target, to: scope:recipient, how: gift }
      - scope:recipient:
          add_opinion: { target: scope:actor, modifier: artifact_gift, value: "scope:target.artifact_gift_opinion" }
    # ИИ дарит лишнюю вещь сюзерену или супругу, которые к нему прохладны
    ai_targets: [liege, spouse]
    ai_frequency_months: 12
    ai_will_do:
      value: 0
      if:
        - limit:
            num_spare_artifacts: ">= 1"
            scope:target: { artifact_is_equipped: no }
            scope:recipient: { opinion: { target: scope:actor, value: "< 20" } }
          add: 30
        - limit: { has_trait: [generous, gregarious] }
          add: 10
        - limit: { has_trait: greedy }
          add: -20
      subtract: { value: "scope:target.artifact_value", divide: 25 }

  # потребовать назад вещь, на которую есть притязание
  demand_artifact:
    requires_feature: artifacts
    icon: "✊"
    category: hostile
    is_shown:
      scope:actor: { has_artifact_claim: scope:recipient }
    target:
      provider: claimed_artifacts
      title: ui.inv_choose_claimed
    cooldown: { years: 3 }
    ai_accept:
      value: -30
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.5 } }
        - { desc: ai.relative_power, value: { value: "scope:actor.levies", divide: { value: levies, min: 100 }, multiply: 10, max: 30 } }
        - limit: { scope:recipient: { is_vassal_of: scope:actor } }
          desc: ai.current_liege
          value: 25
    on_accept:
      - transfer_artifact: { artifact: scope:target, to: scope:actor, how: returned }
      - scope:actor: { add_opinion: { target: scope:recipient, modifier: returned_artifact } }
    on_decline:
      - scope:actor: { add_opinion: { target: scope:recipient, modifier: refused_artifact } }
    ai_targets: [artifact_claim_holders]
    ai_frequency_months: 12
    ai_will_do: 40
