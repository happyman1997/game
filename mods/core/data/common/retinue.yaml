# Дружина: имена отрядов и наёмные роты.
#
# regiment_names — части имён отрядов: part: adj (определение) или noun
# (кто они); у noun — categories: для каких видов войск (нет — для всех).
# Имя отряда — определение + существительное: «Вересковые луки». Тексты —
# localization: regiment_name.<id>.
#
# mercenary_companies — наёмные роты мира (по одной на запись):
#   icon        — значок
#   regiments   — состав: { вид войск: сколько отрядов }
#   xp          — опыт отрядов на старте (ранги — defines.regiments.ranks)
#   captain     — навыки капитана: { martial, prowess } (± разброс)
#   culture     — культура капитана (нет — культура графства, откуда рота)
# Цена найма и плата в месяц — defines.mercenaries (от цены и жалованья отрядов).
regiment_names:
  black: { part: adj }
  grey: { part: adj }
  iron: { part: adj }
  heather: { part: adj }
  rusty: { part: adj }
  stone: { part: adj }
  ashen: { part: adj }
  free: { part: adj }
  northern: { part: adj }
  crimson: { part: adj }
  silent: { part: adj }
  old: { part: adj }
  wild: { part: adj }
  thorn: { part: adj }
  wolf: { part: adj }
  grim: { part: adj }
  shields: { part: noun, categories: [infantry, special] }
  blades: { part: noun, categories: [infantry, special] }
  axes: { part: noun, categories: [infantry, special] }
  spears: { part: noun, categories: [infantry] }
  boars: { part: noun, categories: [infantry, special] }
  arrows: { part: noun, categories: [ranged] }
  bows: { part: noun, categories: [ranged] }
  falcons: { part: noun, categories: [ranged, cavalry] }
  hornets: { part: noun, categories: [ranged] }
  riders: { part: noun, categories: [cavalry] }
  hooves: { part: noun, categories: [cavalry] }
  whirlwinds: { part: noun, categories: [cavalry] }
  hounds: { part: noun, categories: [cavalry, infantry] }
  ravens: { part: noun }
  sworn: { part: noun, categories: [special] }
  bannermen: { part: noun, categories: [special, infantry] }

mercenary_companies:
  grey_lances:
