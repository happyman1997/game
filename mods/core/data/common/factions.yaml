# Фракции вассалов. Скоупы: root — вассал (can_join, ai_join) или лидер
# фракции (on_demands_accepted); scope:liege — сюзерен, scope:faction —
# фракция, scope:faction_leader, scope:claimant (для фракции претендента).
# ai_accept_demands считается в скоупе сюзерена (root = scope:liege).
factions:
  independence_faction:
    icon: "🏳"
    cb: independence_revolt
    can_join:
      is_vassal: yes
      is_imprisoned: no
      # сюзерен держит вассала сильным крюком — тот не посмеет
      NOT: { scope:liege: { has_strong_hook_on: root } }
    ai_join:
      value: -10
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:liege)", multiply: -0.8 } }
        - { desc: ai.different_culture, limit: { NOT: { same_culture_as: scope:liege } }, value: 20 }
        - { desc: ai.different_faith, limit: { NOT: { same_faith_as: scope:liege } }, value: 30 }
        - { desc: ai.ambitious, limit: { has_trait: ambitious }, value: 15 }
        - { desc: ai.content, limit: { has_trait: content }, value: -20 }
        - { desc: ai.family, limit: { is_close_family_of: scope:liege }, value: -30 }
        - { desc: ai.rank, value: { value: tier, multiply: 6 } }
        - { desc: ai.councillor, limit: { is_councillor: yes }, value: -15 }
        # политика двора (условия службы уже сказались на мнении): страх, вражда с лидером
        - { desc: ai.dread, value: { value: fear_of_liege, multiply: -0.6 } }
        - { desc: ai.rival_leader, limit: { exists: scope:faction_leader, has_opinion_modifier: { target: scope:faction_leader, modifier: rival } }, value: -60 }
    ai_accept_demands:
      value: -60
      add: { value: scope:faction.faction_power, multiply: 0.35 }
    on_demands_accepted:
      - scope:faction:
          every_faction_member:
            become_independent: yes
            add_prestige: 50
      - scope:liege: { add_prestige: -150 }

  claimant_faction:
    icon: "👑"
    cb: claimant_revolt
    claimant: yes
    can_join:
      is_vassal: yes
      is_imprisoned: no
      NOT: { scope:liege: { has_strong_hook_on: root } }
    ai_join:
      value: -20
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:liege)", multiply: -0.7 } }
        - { desc: ai.claimant_opinion, value: { value: "opinion(scope:claimant)", multiply: 0.4 } }
        - { desc: ai.is_claimant, limit: { is_same_as: scope:claimant }, value: 80 }
        - { desc: ai.claimant_family, limit: { is_close_family_of: scope:claimant }, value: 20 }
        - { desc: ai.ambitious, limit: { has_trait: ambitious }, value: 10 }
        - { desc: ai.councillor, limit: { is_councillor: yes }, value: -15 }
        - { desc: ai.swore_fealty, limit: { has_opinion_modifier: { target: scope:liege, modifier: swore_fealty } }, value: -30 }
        - { desc: ai.dread, value: { value: fear_of_liege, multiply: -0.6 } }
        - { desc: ai.rival_leader, limit: { exists: scope:faction_leader, has_opinion_modifier: { target: scope:faction_leader, modifier: rival } }, value: -60 }
    ai_accept_demands:
      value: -90
      add: { value: scope:faction.faction_power, multiply: 0.35 }
    on_demands_accepted:
      - scope:claimant:
          seize_primary_title: scope:liege
          add_prestige: 100
      - scope:liege: { add_prestige: -300 }

casus_belli:
  independence_revolt:
    requires_feature: factions
    icon: "🏳"
    targets: faction
    manual: yes
    on_victory:
      - scope:war:
          every_war_attacker:
            limit: { is_vassal_of: scope:defender }
            become_independent: yes
            add_prestige: 100
      - scope:defender: { add_prestige: -200 }
    on_defeat:
      - scope:war:
          every_war_attacker:
            add_prestige: -100
            scope:defender: { add_opinion: { target: prev, modifier: rebel } }
      - scope:defender:
          add_prestige: 150
          add_dread: 15
          imprison: { target: scope:attacker, reason: rebellion }
    truce_years: 5
    war_name: cb.independence_revolt.war_name

  claimant_revolt:
    requires_feature: factions
    icon: "👑"
    targets: faction
    manual: yes
    on_victory:
      - scope:claimant:
          seize_primary_title: scope:defender
          add_prestige: 200
      - scope:defender: { add_prestige: -300 }
    on_defeat:
      - scope:war:
          every_war_attacker:
            add_prestige: -100
            scope:defender: { add_opinion: { target: prev, modifier: rebel } }
      - scope:defender:
          add_prestige: 150
          add_dread: 15
          imprison: { target: scope:attacker, reason: rebellion }
      - if:
          limit: { exists: scope:claimant }
          scope:claimant:
            remove_claim: scope:target
    truce_years: 5
    war_name: cb.claimant_revolt.war_name

events:
  # Ультиматум фракции правителю-игроку.
  faction.0001:
    requires_feature: factions
    theme: war
    icon: "📯"
    triggered_only: true
    options:
      - effect: { scope:faction: { faction_enforce_demands: yes } }
        ai_chance: 10
      - effect: { scope:faction: { faction_start_war: yes } }
        ai_chance: 90

# Крюк против заговора: сюзерен требует от вассала выйти из фракции.
# Без крюка согласится лишь тот, кто любит или боится сюзерена.
interactions:
  demand_leave_faction:
    requires_feature: factions
    icon: "✋"
    category: realm
    is_shown:
      scope:recipient:
        is_vassal_of: scope:actor
        is_in_faction: yes
    ai_accept:
      value: -40
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.6 } }
        - { desc: ai.dread, value: { value: fear_of_liege, multiply: 0.5 } }
        - { desc: ai.faction_leader, limit: { is_faction_leader: yes }, value: -30 }
    on_accept:
      - scope:recipient:
          leave_faction: yes
          set_flag: { name: faction_cooldown, years: 3 }
          add_opinion: { target: scope:actor, modifier: forced_out_of_faction }
    on_decline:
      - scope:actor:
          add_prestige: -20
    ai_targets: [vassal]
    ai_frequency_months: 6
    ai_potential: { any_faction_against: yes }
    ai_will_do:
      value: 0
      if:
        - limit: { scope:recipient: { is_in_faction: yes } }
          add: 35
        - limit: { scope:recipient: { is_faction_leader: yes } }
          add: 15

opinion_modifiers:
  forced_out_of_faction: { value: -15, years: 5 }
