# Фракции вассалов. Скоупы: root — вассал (can_join, ai_join) или лидер
# фракции (on_demands_accepted); scope:liege — сюзерен, scope:faction —
# фракция, scope:faction_leader, scope:claimant (для фракции претендента).
# ai_accept_demands считается в скоупе сюзерена (root = scope:liege).
factions:
  independence_faction:
    icon: "🏳"
    cb: independence_revolt
    can_join:
      is_vassal: yes
      is_imprisoned: no
    ai_join:
      value: -10
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:liege)", multiply: -0.8 } }
        - { desc: ai.different_culture, limit: { NOT: { same_culture_as: scope:liege } }, value: 20 }
        - { desc: ai.different_faith, limit: { NOT: { same_faith_as: scope:liege } }, value: 30 }
        - { desc: ai.ambitious, limit: { has_trait: ambitious }, value: 15 }
        - { desc: ai.content, limit: { has_trait: content }, value: -20 }
        - { desc: ai.family, limit: { is_close_family_of: scope:liege }, value: -30 }
        - { desc: ai.rank, value: { value: tier, multiply: 6 } }
        - { desc: ai.councillor, limit: { is_councillor: yes }, value: -15 }
    ai_accept_demands:
      value: -60
      add: { value: scope:faction.faction_power, multiply: 0.35 }
    on_demands_accepted:
      - scope:faction:
          every_faction_member:
            become_independent: yes
            add_prestige: 50
      - scope:liege: { add_prestige: -150 }

  claimant_faction:
    icon: "👑"
    cb: claimant_revolt
    claimant: yes
    can_join:
      is_vassal: yes
      is_imprisoned: no
    ai_join:
      value: -20
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:liege)", multiply: -0.7 } }
        - { desc: ai.claimant_opinion, value: { value: "opinion(scope:claimant)", multiply: 0.4 } }
        - { desc: ai.is_claimant, limit: { is_same_as: scope:claimant }, value: 80 }
        - { desc: ai.claimant_family, limit: { is_close_family_of: scope:claimant }, value: 20 }
        - { desc: ai.ambitious, limit: { has_trait: ambitious }, value: 10 }
        - { desc: ai.councillor, limit: { is_councillor: yes }, value: -15 }
    ai_accept_demands:
      value: -90
      add: { value: scope:faction.faction_power, multiply: 0.35 }
    on_demands_accepted:
      - scope:claimant:
          seize_primary_title: scope:liege
          add_prestige: 100
      - scope:liege: { add_prestige: -300 }

casus_belli:
  independence_revolt:
    requires_feature: factions
    icon: "🏳"
    targets: faction
    manual: yes
    on_victory:
      - scope:war:
          every_war_attacker:
            limit: { is_vassal_of: scope:defender }
            become_independent: yes
            add_prestige: 100
      - scope:defender: { add_prestige: -200 }
    on_defeat:
      - scope:war:
          every_war_attacker:
            add_prestige: -100
            scope:defender: { add_opinion: { target: prev, modifier: rebel } }
      - scope:defender:
          add_prestige: 150
          imprison: { target: scope:attacker, reason: rebellion }
    truce_years: 5
    war_name: cb.independence_revolt.war_name

  claimant_revolt:
    requires_feature: factions
    icon: "👑"
    targets: faction
    manual: yes
    on_victory:
      - scope:claimant:
          seize_primary_title: scope:defender
          add_prestige: 200
      - scope:defender: { add_prestige: -300 }
    on_defeat:
      - scope:war:
          every_war_attacker:
            add_prestige: -100
            scope:defender: { add_opinion: { target: prev, modifier: rebel } }
      - scope:defender:
          add_prestige: 150
          imprison: { target: scope:attacker, reason: rebellion }
      - if:
          limit: { exists: scope:claimant }
          scope:claimant:
            remove_claim: scope:target
    truce_years: 5
    war_name: cb.claimant_revolt.war_name

events:
  # Ультиматум фракции правителю-игроку.
  faction.0001:
    requires_feature: factions
    theme: war
    icon: "📯"
    triggered_only: true
    options:
      - effect: { scope:faction: { faction_enforce_demands: yes } }
        ai_chance: 10
      - effect: { scope:faction: { faction_start_war: yes } }
        ai_chance: 90
