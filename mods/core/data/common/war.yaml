# Поводы к войне. targets — поставщик целей (claim, de_jure, independence,
# holy_war или зарегистрированный модом). Скоупы в эффектах:
# scope:attacker, scope:defender, scope:target (титул), scope:war.
casus_belli:
  claim:
    icon: "📜"
    targets: claim
    cost:
      prestige: { value: 50, add: { value: "scope:target.title_tier", multiply: 40 } }
    on_victory:
      - scope:attacker:
          gain_title: scope:target
          annex_war_targets: yes
          add_prestige: 200
      - scope:defender: { add_prestige: -100 }
    on_white_peace:
      - scope:attacker: { add_prestige: -50 }
    on_defeat:
      - scope:attacker:
          add_prestige: -150
          pay_gold: { target: scope:defender, value: { value: "scope:attacker.gold", multiply: 0.3, min: 0 } }
    ai_will_do: 70
    truce_years: 5
    war_name: cb.claim.war_name

  de_jure:
    icon: "🗺"
    targets: de_jure
    is_valid:
      scope:attacker: { tier: ">= duchy" }
    cost:
      prestige: 100
    on_victory:
      - scope:attacker:
          annex_war_targets: yes
          add_prestige: 150
    on_white_peace:
      - scope:attacker: { add_prestige: -50 }
    on_defeat:
      - scope:attacker:
          add_prestige: -100
          pay_gold: { target: scope:defender, value: { value: "scope:attacker.gold", multiply: 0.25, min: 0 } }
    ai_will_do: 40
    war_name: cb.de_jure.war_name

  independence:
    icon: "⛓"
    targets: independence
    is_valid:
      scope:attacker: { is_independent: no }
    cost:
      prestige: 50
    on_victory:
      - scope:attacker:
          become_independent: yes
          add_prestige: 200
    on_white_peace:
      - scope:attacker: { add_prestige: -50 }
    on_defeat:
      - scope:attacker:
          add_prestige: -200
          pay_gold: { target: scope:defender, value: { value: "scope:attacker.gold", multiply: 0.5, min: 0 } }
          add_opinion: { target: scope:defender, modifier: humiliated }
    ai_will_do:
      value: 0
      if:
        - limit: { scope:attacker: { opinion: { target: scope:defender, value: "< -30" } } }
          add: 50
    war_name: cb.independence.war_name

  # Набеговые завоевания соседних графств — для кельтских и норманно-скандинавских мелких королей.
  county_conquest:
    icon: "🪓"
    targets: adjacent_county
    is_valid:
      scope:attacker:
        is_independent: yes
        culture: [irish, welsh, scottish, norse]
    cost:
      prestige: 120
    on_victory:
      - scope:attacker:
          annex_war_targets: yes
          add_prestige: 80
    on_white_peace:
      - scope:attacker: { add_prestige: -40 }
    on_defeat:
      - scope:attacker: { add_prestige: -80 }
    ai_will_do:
      value: 25
      add: { value: ai_aggression, multiply: 8 }
    truce_years: 3
    war_name: cb.county_conquest.war_name

  holy_war:
    icon: "✝"
    targets: holy_war
    cost:
      piety: 150
    on_victory:
      - scope:attacker:
          annex_war_targets: yes
          add_piety: 200
          add_prestige: 100
    on_white_peace:
      - scope:attacker: { add_piety: -50 }
    on_defeat:
      - scope:attacker: { add_piety: -150, add_prestige: -100 }
    ai_will_do:
      value: 50
      add: { value: ai_zeal, multiply: 15 }
    war_name: cb.holy_war.war_name
