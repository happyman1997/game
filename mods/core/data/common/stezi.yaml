# Стези (деревья перков, lifestyles.yaml): правила, которые живут в данных,
# и действия, которые открывает вершина стези. Файл грузится после
# decisions/interactions/prison/schemes/skill_paths и дописывает к их
# записям ($append), остальное — свои записи. Правила-характеристики
# (страх от пленников, цена наследий, обозы…) читает движок — они в
# modifiers перков.

ui_categories:
  decisions:
    stezi: { order: 5.5, icon: star }

modifiers:
  grand_muster: { icon: "🥁", good: true, modifiers: { levy_mult: 0.25, commander_advantage: 5, regiment_power: 0.1 } }
  lombard_debt: { icon: "🏦", modifiers: { monthly_income: -2.5 } }
  holy_call: { icon: "✝", good: true, modifiers: { levy_mult: 0.25, monthly_piety: 0.5, knight_effectiveness: 0.1 } }
  # «Великая стройка» в столице — навсегда
  great_cathedral: { icon: "⛪", good: true, modifiers: { development_growth: 0.1, county_opinion: 15 } }
  great_keep: { icon: "🏯", good: true, modifiers: { levy_mult: 0.5, county_opinion: 5 } }
  great_market: { icon: "⚖", good: true, modifiers: { tax_mult: 0.3, development_growth: 0.1 } }

opinion_modifiers:
  # мнение графств (add_county_opinion)
  royal_visit: { value: 15, years: 5 }
  new_building_joy: { value: 10, years: 5 }
  miracle_witnessed: { value: 15, years: 10 }
  # мнение персонажей
  royal_progress_host: { value: 10, years: 5 }
  kin_gathering: { value: 15, years: 5 }
  mustered: { value: 10, years: 3 }
  intimidated: { value: -10, years: 5 }
  public_execution_horror: { value: -15, years: 5 }
  honored_champion: { value: 20, years: 10 }
  bribed: { value: 40, years: 5 }
  bribe_insult: { value: -20, years: 5 }
  bought_secret: { value: 15, years: 5 }
  compelled: { value: -15, years: 5 }
  heart_pact: { value: 20, years: 10 }
  relic_veneration: { value: 5, years: 2 }
  answered_holy_call: { value: 15, years: 5 }

# ---------------------------------------------------------------- правила стезей в чужих записях

decisions:
  # Государь «Придворный церемониал»: пир вдвое дешевле и прибавляет славы
  hold_feast:
    cost:
      gold: { value: feast_cost, if: { limit: { has_perk: court_etiquette }, multiply: 0.5 } }
    effect:
      $append:
        - if:
            limit: { has_perk: court_etiquette }
            add_prestige: 50

  # Святой «Молитвенник»: паломничество смывает весь стресс и может принести мощи
  go_on_pilgrimage:
    effect:
      $append:
        - if:
            limit: { has_perk: devout_prayer }
            add_stress: -100
            random:
              chance: 35
              create_artifact: { type: reliquary, rarity: [masterwork, famed], how: found }
              send_message: { text: msg.pilgrim_relic, kind: good }

  # ---------------------------------------------------------------- вершины стезей

  # Государь: объехать свои земли — графства и вассалы помнят визит
  royal_progress:
    category: stezi
    icon: "👑"
    is_shown: { is_ruler: yes, has_perk: august_majesty }
    is_valid:
      is_adult: yes
      is_at_war: no
      is_imprisoned: no
    cost: { gold: { value: 50, add: { value: tier, multiply: 25 } } }
    cooldown: { years: 5 }
    effect:
      - every_domain_province:
          add_county_opinion: royal_visit
      - every_vassal:
          add_opinion: { target: root, modifier: royal_progress_host }
      - add_prestige: 100
      - add_stress: -10
    ai_check_months: 12
    ai_will_do: { value: 30, add: { value: ai_sociability, multiply: 5 } }

  # Династ: созвать родню — правители рода несут дары, род гремит
  gather_kin:
    category: stezi
    icon: "🏰"
    is_shown: { is_adult: yes, has_perk: head_of_house }
    is_valid:
      is_at_war: no
      is_imprisoned: no
      custom_tooltip:
        text: ui.need_ruling_kin
        trigger: { any_dynasty_member: { is_ruler: yes, NOT: { is_same_as: root } } }
    cost: { prestige: 150 }
    cooldown: { years: 5 }
    effect:
      - every_dynasty_member:
          limit: { is_ruler: yes, is_adult: yes, NOT: { is_same_as: root } }
          pay_gold: { target: root, value: { value: gold, multiply: 0.15, min: 0, max: 60 } }
          add_opinion: { target: root, modifier: kin_gathering }
      - add_dynasty_prestige: 100
    ai_check_months: 12
    ai_will_do: 30

  # Полководец: военный смотр — ополчение, отряды и рыцари на подъёме
  grand_muster:
    category: stezi
    icon: "🥁"
    is_shown: { is_ruler: yes, has_perk: master_strategist }
    is_valid:
      is_adult: yes
      is_imprisoned: no
    cost: { prestige: 150, gold: 50 }
    cooldown: { years: 5 }
    effect:
      - add_modifier: { id: grand_muster, years: 2 }
      - every_knight:
          add_opinion: { target: root, modifier: mustered }
    ai_check_months: 6
    ai_will_do: { value: 0, if: { limit: { is_at_war: yes }, add: 60 } }

  # Тиран: показательная казнь — страх на всю державу
  public_execution:
    category: stezi
    icon: "🪓"
    is_shown: { is_ruler: yes, has_perk: iron_fist }
    is_valid:
      is_imprisoned: no
      custom_tooltip:
        text: ui.need_prisoner
        trigger: { any_prisoner: { NOT: { is_close_family_of: root } } }
    cooldown: { years: 3 }
    effect:
      - random_prisoner:
          limit: { NOT: { is_close_family_of: root } }
          weight: { value: 1, if: { limit: { is_ruler: yes }, add: 3 } }
          save_scope_as: condemned
      - scope:condemned:
          every_close_family:
            limit: { NOT: { is_same_as: root } }
            add_opinion: { target: root, modifier: executed_relative }
      # казнь на площади поднимает страх на ступень, а столица её не забудет
      - raise_dread_tier: 1
      - capital: { add_county_opinion: executions_witnessed }
      - add_karma: { value: -10, deed: public_execution }
      - if:
          limit: { has_trait: ash_gold }
          add_gold: 75
      - add_deed: executions
      - every_vassal:
          limit: { fear_stance: defiant }
          add_opinion: { target: root, modifier: public_execution_horror }
      - scope:condemned:
          death: { reason: execution, killer: root }
    ai_check_months: 12
    ai_will_do:
      value: 0
      if:
        - limit: { dread: "< 40" }
          add: 30
        - limit: { has_trait: [compassionate, forgiving] }
          multiply: 0

  # Рыцарь: поход за славой — сам на ристалище или лучший из рыцарей
  glory_quest:
    category: stezi
    icon: "🏇"
    is_shown: { is_adult: yes, has_perk: paragon_of_chivalry }
    is_valid:
      is_at_war: no
      is_imprisoned: no
      NOT: { has_trait: wounded }
    cost: { gold: 50 }
    cooldown: { years: 4 }
    effect:
      - trigger_event: stezi.0001
    ai_check_months: 12
    ai_will_do: { value: 20, if: { limit: { has_trait: [brave, arrogant] }, add: 20 } }

  # Зодчий: великая стройка в столице — раз в жизни
  great_work:
    category: stezi
    icon: "🏗"
    is_shown: { is_ruler: yes, has_perk: royal_architect }
    is_valid:
      is_at_war: no
      custom_tooltip:
        text: ui.great_work_once
        trigger: { NOT: { has_flag: great_work_done } }
    cost: { gold: 400 }
    effect:
      - set_flag: great_work_done
      - trigger_event: stezi.0002
    ai_check_months: 12
    ai_will_do: { value: 0, if: { limit: { gold: ">= 650" }, add: 40 } }

  # Казначей: ломбардский заём — золото сейчас, проценты потом
  take_loan:
    category: stezi
    icon: "🏦"
    is_shown: { is_ruler: yes, has_perk: lombard_loan }
    is_valid:
      custom_tooltip:
        text: ui.loan_unpaid
        trigger: { NOT: { has_modifier: lombard_debt } }
    effect:
      - add_gold: 300
      - add_modifier: { id: lombard_debt, years: 12 }
    ai_check_months: 6
    ai_will_do: { value: 0, if: { limit: { is_at_war: yes, gold: "< 60" }, add: 50 } }

  # Учёный: великий труд — книга, которую будут переписывать веками
  magnum_opus:
    category: stezi
    icon: "📜"
    is_shown: { is_adult: yes, has_perk: renowned_scholar }
    is_valid: { is_imprisoned: no }
    cost: { gold: 100 }
    cooldown: { years: 10 }
    effect:
      - if:
          limit: { learning: ">= 20" }
          create_artifact: { type: [codex, book], rarity: illustrious, how: commissioned }
          else:
            create_artifact: { type: [codex, book], rarity: famed, how: commissioned }
      - add_prestige: 100
      - add_dynasty_prestige: 75
      - add_lifestyle_xp: 300
    ai_check_months: 12
    ai_will_do: 30

  # Святой: чудо — исцеление, ликование графств
  miracle:
    category: stezi
    icon: "✨"
    is_shown: { is_adult: yes, has_perk: doctor_of_theology }
    is_valid: { is_imprisoned: no }
    cost: { piety: 300 }
    cooldown: { years: 5 }
    effect:
      - remove_trait: wounded
      - remove_trait: ill
      - remove_trait: pneumonic
      - every_close_family:
          - remove_trait: wounded
          - remove_trait: ill
          - remove_trait: pneumonic
      - every_domain_province:
          add_county_opinion: miracle_witnessed
      - add_prestige: 100
      - add_stress: -30
      # Живой святой: чудо сильнее — исцеляет и вассалов, а душа светлеет
      - if:
          limit: { has_trait: living_saint }
          every_vassal:
            - remove_trait: wounded
            - remove_trait: ill
            - remove_trait: pneumonic
            - add_opinion: { target: root, modifier: miracle_witnessed }
          add_karma: { value: 5, deed: miracle }
          add_prestige: 100
    ai_check_months: 6
    ai_will_do:
      value: 5
      if:
        - limit: { has_trait: [wounded, ill, pneumonic] }
          add: 60

  # Святой: воззвание к священной войне
  holy_call:
    category: stezi
    icon: "✝"
    is_shown: { is_ruler: yes, has_perk: doctor_of_theology }
    is_valid:
      custom_tooltip:
        text: ui.need_war_vs_infidel
        trigger: { any_war_enemy: { OR: { NOT: { same_faith_as: root }, is_heretic: yes } } }
    cost: { piety: 200 }
    cooldown: { years: 5 }
    effect:
      - add_modifier: { id: holy_call, years: 3 }
      - every_vassal:
          limit: { same_faith_as: root }
          add_opinion: { target: root, modifier: answered_holy_call }
    ai_check_months: 6
    ai_will_do: 50

interactions:
  # Государь «Государственный муж»: соседи склоняются перед славой
  offer_vassalization:
    ai_accept:
      add:
        $append:
          - { desc: ai.statesman, limit: { scope:actor: { has_perk: statesman } }, value: { value: "scope:actor.prestige_level", multiply: 10 } }

  # Тиран «Кровавый суд»: казнь внушает вдвое больше страха
  execute_prisoner:
    on_accept:
      $append:
        - if:
            limit: { has_perk: bloody_justice }
            add_dread: 15

  # Рыцарь «Рыцарский обет»: отказ от вашего вызова — позор вдвойне
  challenge_to_duel:
    on_decline:
      $append:
        - if:
            limit: { has_perk: knightly_vow }
            scope:recipient: { add_prestige: -40 }

  # ---------------------------------------------------------------- вершины стезей

  # Тиран: запугать вассала — дань страхом, отказ — законный повод к темнице
  intimidate:
    icon: "⛓"
    category: hostile
    is_shown:
      scope:actor: { has_perk: iron_fist }
      scope:recipient: { is_vassal_of: scope:actor }
    is_valid:
      scope:recipient: { gold: 20, is_imprisoned: no }
      # дерзких не запугать — только покорных и сломленных
      custom_tooltip:
        text: ui.not_defiant
        trigger: { scope:recipient: { NOT: { fear_stance: defiant } } }
    hookable: no
    cooldown: { years: 3 }
    ai_accept:
      value: -10
      add:
        - { desc: ai.dread, value: { value: fear_of_liege, multiply: 1.0 } }
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.2 } }
        - { desc: ai.boldness, value: { value: ai_boldness, multiply: -10 } }
    on_accept:
      - scope:recipient:
          pay_gold: { target: scope:actor, value: { value: gold, multiply: 0.3, min: 0, max: 150 } }
          add_opinion: { target: scope:actor, modifier: intimidated }
      - add_dread: 3
      - add_karma: { value: -3, deed: intimidation }
    on_decline:
      - scope:recipient:
          mark_criminal: { target: scope:actor, years: 5 }
    decline_text: msg.intimidate_refused
    ai_targets: [vassal]
    ai_frequency_months: 12
    ai_will_do:
      value: 0
      if:
        - limit: { scope:recipient: { fear_of_liege: ">= 20", gold: ">= 60" } }
          add: 20
        - limit: { gold: "< 100" }
          add: 10

  # Казначей: подкуп — верность за золото (честные оскорбятся)
  bribe:
    icon: "💰"
    category: intrigue
    is_shown:
      scope:actor: { has_perk: great_administrator }
      scope:recipient: { is_adult: yes }
    cost: { gold: { value: 40, add: { value: "scope:recipient.tier", multiply: 30 } } }
    auto_accept: yes
    hookable: no
    cooldown: { years: 5 }
    on_accept:
      - scope:recipient:
          if:
            limit: { has_trait: [honest, just] }
            add_opinion: { target: scope:actor, modifier: bribe_insult }
            else:
              add_opinion: { target: scope:actor, modifier: bribed }
              if:
                limit: { is_vassal_of: scope:actor, is_in_faction: yes }
                leave_faction: yes
                set_flag: { name: faction_cooldown, years: 3 }
    ai_targets: [vassal]
    ai_frequency_months: 12
    ai_will_do:
      value: 0
      if:
        - limit:
            gold: ">= 200"
            scope:recipient: { is_in_faction: yes, NOT: { has_trait: [honest, just] } }
          add: 40
        - limit:
            gold: ">= 300"
            scope:recipient: { is_powerful_vassal: yes, NOT: { has_trait: [honest, just] }, opinion: { target: scope:actor, value: "< 0" } }
          add: 20

  # Паук: продать тайну — сосед узнаёт чужой секрет, вам — серебро
  sell_secret:
    icon: "📜"
    category: intrigue
    is_shown:
      scope:actor: { has_perk: secret_trade }
      scope:recipient: { is_ruler: yes }
    is_valid:
      custom_tooltip:
        text: ui.need_secret_to_sell
        trigger:
          scope:actor:
            any_known_secret_owner:
              NOR:
                - is_same_as: scope:recipient
                - is_same_as: scope:actor
    hookable: no
    cooldown: { years: 3 }
    ai_accept:
      value: 15
      add:
        - { desc: ai.opinion, value: { value: "opinion(scope:actor)", multiply: 0.5 } }
        - { desc: ai.greed, value: { value: ai_greed, multiply: -5 } }
        - { desc: ai.at_war, limit: { is_at_war_with: scope:actor }, value: -100 }
    on_accept:
      - scope:actor:
          random_known_secret_owner:
            limit:
              NOR:
                - is_same_as: scope:recipient
                - is_same_as: scope:actor
            weight: { value: 1, if: { limit: { OR: [ { is_vassal_of: scope:recipient }, { is_at_war_with: scope:recipient } ] }, add: 5 } }
            save_scope_as: sold_secret_owner
      - scope:recipient:
          learn_secret: { owner: scope:sold_secret_owner }
          pay_gold: { target: scope:actor, value: { value: gold, multiply: 0.15, min: 0, max: 100 } }
          add_opinion: { target: scope:actor, modifier: bought_secret }
    ai_targets: [neighboring_ruler]
    ai_frequency_months: 24
    ai_will_do: { value: 0, if: { limit: { num_known_secrets: ">= 2" }, add: 20 } }

  # Паук: заставить служить — крюк в обмен на службу (золото, союз или совет)
  compel_service:
    icon: "🕸"
    category: intrigue
    is_shown:
      scope:actor: { has_perk: master_schemer }
      scope:recipient: { is_adult: yes }
    is_valid:
      scope:actor: { has_hook_on: scope:recipient }
    auto_accept: yes
    hookable: no
    on_accept:
      - remove_hook: scope:recipient
      - trigger_event: stezi.0003
    ai_targets: [vassal, neighboring_ruler]
    ai_frequency_months: 12
    ai_will_do: { value: 0, if: { limit: { has_hook_on: scope:recipient }, add: 25 } }

  # Соблазнитель: сердечный союз — любовник-правитель вступает в союз или мирится
  heart_pact:
    icon: "💞"
    category: diplomacy
    is_shown:
      scope:actor: { has_perk: irresistible, is_ruler: yes }
      scope:recipient: { is_ruler: yes }
    is_valid:
      custom_tooltip:
        text: ui.need_lover
        trigger: { scope:recipient: { has_opinion_modifier: { target: scope:actor, modifier: lover } } }
    auto_accept: yes
    hookable: no
    cooldown: { years: 10 }
    on_accept:
      - if:
          limit: { is_at_war_with: scope:recipient }
          scope:recipient: { make_white_peace: yes }
          else:
            add_alliance: scope:recipient
      - scope:recipient: { add_opinion: { target: scope:actor, modifier: heart_pact } }
    ai_targets: [neighboring_ruler]
    ai_frequency_months: 24
    ai_will_do: 30

schemes:
  # Соблазнитель «Обаяние»: соблазнять легче и быстрее; «Постельные тайны» —
  # секреты любовника и его сюзерена; «Сердцеед» — любовник на крючке
  seduce:
    progress:
      multiply: { value: 1, if: { limit: { scope:owner: { has_perk: alluring } }, add: 0.5 } }
    success_chance:
      add:
        $append:
          - { desc: ai.perk_alluring, limit: { scope:owner: { has_perk: alluring } }, value: 15 }
    on_success:
      $append:
        - scope:owner:
            if:
              limit: { has_perk: pillow_talk }
              learn_secret: { owner: scope:target }
              if:
                limit: { exists: scope:target.liege }
                learn_secret: { owner: scope:target.liege }
        - scope:owner:
            if:
              limit: { has_perk: heartbreaker }
              add_hook: { target: scope:target }

on_actions:
  # Династ «Плодовитый род»: каждый ребёнок — слава роду (root — новорождённый)
  on_birth:
    effect:
      $append:
        - scope:father:
            if:
              limit: { has_perk: fecund_line }
              add_dynasty_prestige: 25
        - scope:mother:
            if:
              limit: { has_perk: fecund_line }
              add_dynasty_prestige: 25

  on_battle_won:
    effect:
      $append:
        # Полководец «Взять живьём»: в плен попадает рыцарь врага (выкуп!)
        - if:
            limit: { has_perk: take_alive }
            random:
              chance: 35
              scope:enemy:
                random_knight:
                  limit: { is_ruler: no, is_imprisoned: no }
                  save_scope_as: captive_knight
              if:
                limit: { exists: scope:captive_knight }
                imprison: scope:captive_knight
                send_message: { text: msg.knight_captured, kind: good }
        # Рыцарь «Трофеи»: щит с поля боя
        - if:
            limit: { has_perk: trophy_taker }
            random:
              chance: 20
              create_artifact: { type: trophy_shield, rarity: [common, masterwork], how: trophy }

  # Рыцарь «Трофеи»: победив в поединке, забрать оружие побеждённого
  # (root — победившая сторона, scope:loser)
  on_duel_won:
    effect:
      - if:
          limit: { has_perk: trophy_taker }
          scope:loser:
            random_artifact:
              limit: { artifact_type: [sword, axe, spear, mace], artifact_is_equipped: yes }
              save_scope_as: duel_trophy
          if:
            limit: { exists: scope:duel_trophy }
            transfer_artifact: { artifact: scope:duel_trophy, how: looted }
            send_message: { text: msg.duel_trophy, kind: good }

  # Зодчий «Мастер-строитель»: новая постройка радует графство
  on_building_completed:
    effect:
      - if:
          limit: { has_perk: master_builder }
          scope:province: { add_county_opinion: new_building_joy }

  on_yearly_pulse:
    effect:
      $append:
        # Паук «Уши повсюду»: каждый год — тайна кого-то из своих
        - if:
            limit: { has_perk: subtle_hand }
            discover_secret: yes
        # Святой «Хранитель мощей»: мощи при дворе — благочестие и почитание
        - if:
            limit:
              has_perk: relic_keeper
              any_artifact: { artifact_type: reliquary, artifact_is_equipped: yes }
            add_piety: 60
            every_vassal:
              limit: { same_faith_as: root }
              add_opinion: { target: root, modifier: relic_veneration }

events:
  # Поход за славой (root — рыцарь стези)
  stezi.0001:
    theme: war
    icon: "🏇"
    triggered_only: true
    options:
      # самому выйти на ристалище
      - skill: { skill: prowess, check: 14 }
        success:
          - create_artifact: { slot: weapon, rarity: [famed, famed, illustrious], how: trophy }
          - add_prestige: 150
          - add_deed: duels_won
        failure:
          - add_trait: wounded
          - add_prestige: -30
        ai_chance: { value: 20, add: { value: prowess, multiply: 2 } }
      # выставить лучшего из рыцарей
      - trigger: { num_knights: ">= 1" }
        effect:
          - create_artifact: { slot: armor, rarity: [masterwork, famed], how: trophy }
          - add_prestige: 60
          - random_knight:
              add_prestige: 50
              add_opinion: { target: root, modifier: honored_champion }
        ai_chance: 30
      # вернуться с песнями, но без добычи
      - effect: { add_prestige: 30, add_stress: -15 }
        ai_chance: 10

  # Великая стройка: что воздвигнуть в столице
  stezi.0002:
    theme: development
    icon: "🏗"
    triggered_only: true
    options:
      - effect:
          - capital: { add_province_modifier: great_cathedral }
          - add_piety: 300
          - add_dynasty_prestige: 150
        ai_chance: { value: 20, add: { value: ai_zeal, multiply: 10 } }
      - effect:
          - capital: { add_province_modifier: great_keep }
          - add_prestige: 200
          - add_dynasty_prestige: 150
        ai_chance: { value: 20, add: { value: ai_aggression, multiply: 10 } }
      - effect:
          - capital: { add_province_modifier: great_market }
          - add_gold: 100
          - add_dynasty_prestige: 150
        ai_chance: { value: 20, add: { value: ai_greed, multiply: 10 } }

  # Заставить служить (root — паук, scope:recipient — тот, кто на крючке)
  stezi.0003:
    theme: intrigue
    icon: "🕸"
    triggered_only: true
    options:
      # золото
      - effect:
          scope:recipient:
            pay_gold: { target: root, value: { value: gold, multiply: 0.3, min: 0, max: 200 } }
            add_opinion: { target: root, modifier: compelled }
        ai_chance: 30
      # союз — с независимым правителем
      - trigger:
          scope:recipient: { is_ruler: yes, is_independent: yes }
          NOT: { is_allied_with: scope:recipient }
        effect:
          add_alliance: scope:recipient
          scope:recipient: { add_opinion: { target: root, modifier: compelled } }
        ai_chance: 40
      # служба в совете — вассалу; во фракции он больше не ходок
      - trigger:
          scope:recipient: { is_vassal_of: root }
        effect:
          scope:recipient:
            leave_faction: yes
            set_flag: { name: faction_cooldown, years: 10 }
            add_opinion: { target: root, modifier: compelled }
          seat_in_council: scope:recipient
        ai_chance: 40
