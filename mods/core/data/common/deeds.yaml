# Деяния (механика deeds): летопись того, что персонаж совершил за жизнь.
# Из неё растут прозвища и цели испытаний архетипов (archetypes.yaml).
# Источник — signal (встроенный), decisions, interactions (принятые, у
# действующего лица), schemes (удачные интриги), events (события персонажа);
# ai_hint — что помогает ИИ добиться деяния-сигнала. Название — deed.<id>,
# цель испытания — deed_goal.<id> (прогресс «2/3» дописывается сам).
deeds:
  battles_won:     { icon: "⚔", order: 1, signal: battle_won }
  battles_lost:    { icon: "🏳", order: 2, signal: battle_lost }
  sieges_won:      { icon: "🏰", order: 3, signal: siege_won }
  wars_won:        { icon: "👑", order: 4, signal: war_won }
  duels_won:       { icon: "🤺", order: 5, signal: duel_won, ai_hint: { interactions: [challenge_to_duel] } }
  buildings:       { icon: "🏗", order: 6, signal: building }
  conversions:     { icon: "✝", order: 7, signal: conversion }
  schemes:         { icon: "🗡", order: 8, signal: scheme_success }
  whispers:        { icon: "🐍", order: 9, interactions: [sow_discord, spread_rumor] }
  secrets_exposed: { icon: "🔍", order: 10, signal: secret_exposed }
  blackmails:      { icon: "🤐", order: 11, interactions: [blackmail] }
  executions:      { icon: "🪓", order: 12, interactions: [execute_prisoner] }
  captives:        { icon: "⛓", order: 13, interactions: [imprison] }
  gifts:           { icon: "🎁", order: 14, interactions: [send_gift, trade_pact] }
  pacts:           { icon: "🤝", order: 15, interactions: [propose_alliance, offer_vassalization] }
  feasts:          { icon: "🍗", order: 16, decisions: [hold_feast, convene_great_council] }
  charity:         { icon: "🪙", order: 17, decisions: [give_alms] }
  devotions:       { icon: "🙏", order: 18, decisions: [go_on_pilgrimage, confession, send_missionaries] }
  hunts:           { icon: "🏹", order: 19, decisions: [go_hunting] }
  judgments:       { icon: "⚖", order: 20, events: [court.0004, politics.0002, politics.0004, family.0002, feast.0002] }
  revolts:         { icon: "📯", order: 21, signal: revolt_led }
  laws:            { icon: "📜", order: 22, signal: law_changed }

# Прозвища (только имя, без эффектов): nick.<id>, женское — nick.<id>_f.
# Новое прозвище заменяет прежнее, только если priority выше; прозвища из
# истории не заменяются.
nicknames:
  victorious:   { deed: battles_won, count: 5, priority: 3 }
  invincible:   { deed: battles_won, count: 12, priority: 6 }
  unlucky:      { deed: battles_lost, count: 8, priority: 1 }
  wallbreaker:  { deed: sieges_won, count: 6, priority: 3 }
  conqueror:    { deed: wars_won, count: 3, priority: 5 }
  fearless:     { deed: duels_won, count: 3, priority: 4 }
  builder:      { deed: buildings, count: 6, priority: 2 }
  great_builder: { deed: buildings, count: 14, priority: 4 }
  enlightener:  { deed: conversions, count: 4, priority: 3 }
  cunning:      { deed: schemes, count: 4, priority: 2 }
  two_tongued:  { deed: whispers, count: 4, priority: 2 }
  all_seeing:   { deed: secrets_exposed, count: 3, priority: 3 }
  spider:       { deed: blackmails, count: 4, priority: 3 }
  cruel:        { deed: executions, count: 3, priority: 4 }
  bloody:       { deed: executions, count: 7, priority: 6 }
  jailer:       { deed: captives, count: 6, priority: 2 }
  generous:     { deed: gifts, count: 6, priority: 2 }
  gatherer:     { deed: pacts, count: 4, priority: 3 }
  hospitable:   { deed: feasts, count: 5, priority: 2 }
  merciful:     { deed: charity, count: 4, priority: 2 }
  pious:        { deed: devotions, count: 4, priority: 3 }
  huntsman:     { deed: hunts, count: 6, priority: 1 }
  wise_judge:   { deed: judgments, count: 5, priority: 3 }
  rebel:        { deed: revolts, count: 1, priority: 2 }
  lawgiver:     { deed: laws, count: 2, priority: 3 }
