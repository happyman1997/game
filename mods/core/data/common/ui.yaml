# Оформление событий по темам (цвет рамки и значок по умолчанию).
event_themes:
  default: { icon: "📜", color: "#8a6d3b" }
  health: { icon: "🤒", color: "#4f7a5a" }
  stress: { icon: "😣", color: "#7a4f6a" }
  court: { icon: "🏰", color: "#8a6d3b" }
  realm: { icon: "👑", color: "#9a7a2a" }
  family: { icon: "👪", color: "#a05a5a" }
  faith: { icon: "✝", color: "#c8b88a" }
  war: { icon: "⚔", color: "#8a3a3a" }
  intrigue: { icon: "🗡", color: "#5a3a7a" }
  feast: { icon: "🍖", color: "#a0702a" }
  hunt: { icon: "🦌", color: "#4a6a3a" }
  death: { icon: "🕯", color: "#444455" }

# Режимы карты, описанные данными: значение считается в скоупе провинции,
# цвет — интерполяция по gradient между min и max.
map_modes:
  development:
    icon: "📈"
    order: 50
    value: development
    min: 0
    max: 20
    gradient: ["#5a3b2a", "#c8a050", "#f0e6a0"]
  wealth:
    icon: "💰"
    order: 60
    value: tax
    min: 0
    max: 6
    gradient: ["#3a2a2a", "#8a7a2a", "#f0d050"]

# Категории в списках (как в CK3): взаимодействия в окне персонажа, решения,
# поводы к войне, постройки, отряды. Запись попадает в группу по своему полю
# category (includes — другие категории, которые показываются в этой группе);
# без категории — в «Прочее» (решения с major: yes — в «Важнейшие»).
# Название группы — ключ локализации ui_category.<вид>.<id>.
ui_categories:
  interactions:
    diplomacy: { order: 1, icon: handshake }
    family: { order: 2, icon: ring }
    realm: { order: 3, icon: crown }
    personal: { order: 4, icon: heart, includes: [friendly] }
    intrigue: { order: 5, icon: eye, includes: [political] }
    hostile: { order: 6, icon: dagger }
    prison: { order: 7, icon: chain }
    other: { order: 99, icon: scroll }
  decisions:
    major: { order: 1, icon: crown }
    realm: { order: 2, icon: castle }
    ashes: { order: 3, icon: fire }
    personal: { order: 4, icon: person }
    faith: { order: 5, icon: cross }
    paths: { order: 6, icon: star }
    other: { order: 99, icon: scroll }
  casus_belli:
    claims: { order: 1, icon: scroll }
    conquest: { order: 2, icon: swords }
    faith: { order: 3, icon: cross }
    crown: { order: 4, icon: crown }
    freedom: { order: 5, icon: banner }
    other: { order: 99, icon: swords }
  buildings:
    special: { order: 1, icon: star }
    fortification: { order: 2, icon: tower }
    military: { order: 3, icon: swords }
    economy: { order: 4, icon: gold }
    faith: { order: 5, icon: cross }
    other: { order: 99, icon: castle }
  regiment_types:
    infantry: { order: 1, icon: spear }
    ranged: { order: 2, icon: banner }
    cavalry: { order: 3, icon: tournament }
    special: { order: 4, icon: star }
    other: { order: 99, icon: swords }
  schemes:
    personal: { order: 1, icon: heart }
    political: { order: 2, icon: scroll }
    hostile: { order: 3, icon: dagger }
    other: { order: 99, icon: eye }
