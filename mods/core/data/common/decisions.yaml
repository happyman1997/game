# Решения — действия, доступные персонажу из меню «Решения».
# root (scope:actor) — принимающий решение.
decisions:
  hold_feast:
    icon: "🍖"
    is_shown: { is_ruler: yes }
    is_valid:
      is_at_war: no
      is_adult: yes
    cost:
      gold: feast_cost
    cooldown: { years: 3 }
    effect:
      - trigger_event: feast.0001
    ai_check_months: 12
    ai_will_do:
      value: 10
      add: { value: ai_sociability, multiply: 8 }
      if:
        - limit: { stress: 40 }
          add: 25

  go_hunting:
    icon: "🏹"
    is_shown: { is_ruler: yes }
    is_valid:
      is_at_war: no
      is_adult: yes
      custom_tooltip:
        text: ui.need_health_3
        trigger: { health: 3 }
    cost: { gold: 15 }
    cooldown: { years: 2 }
    effect:
      - trigger_event: hunt.0001
    ai_check_months: 12
    ai_will_do:
      value: 5
      if:
        - limit: { has_trait: [brave, hunter] }
          add: 15

  go_on_pilgrimage:
    icon: "🧭"
    is_shown: { is_ruler: yes, faith: catholic }
    is_valid:
      is_at_war: no
      is_adult: yes
    cost: { gold: 60 }
    cooldown: { years: 10 }
    effect:
      - trigger_event: { id: pilgrimage.0001 }
    ai_will_do:
      value: 5
      add: { value: ai_zeal, multiply: 8 }

  give_alms:
    icon: "🪙"
    is_shown: { is_ruler: yes }
    cost: { gold: 40 }
    cooldown: { years: 1 }
    effect:
      - add_piety: 50
      - add_stress: -10
      - every_vassal:
          add_opinion: { target: root, modifier: alms_given }
    ai_will_do:
      value: 0
      if:
        - limit: { gold: 300 }
          add: 20

  seek_solitude:
    icon: "🕯"
    is_shown: { is_adult: yes }
    is_valid:
      custom_tooltip:
        text: ui.need_stress
        trigger: { stress: 30 }
    cooldown: { years: 1 }
    effect:
      - add_stress: -40
      - add_prestige: -20
    ai_will_do:
      value: 0
      if:
        - limit: { stress: 60 }
          add: 30
        - limit: { stress: 120 }
          add: 30

  commission_chronicle:
    icon: "📚"
    is_shown: { is_ruler: yes, tier: ">= duchy" }
    cost: { gold: 120 }
    cooldown: { years: 15 }
    effect:
      - add_prestige: 150
      - add_dynasty_prestige: 100
      - add_modifier: { id: inspired, years: 3 }
    ai_will_do:
      value: 0
      if:
        - limit: { gold: 400 }
          add: 25

  emergency_taxes:
    icon: "🪙"
    is_shown: { is_ruler: yes, tier: ">= duchy" }
    is_valid:
      NOT: { has_modifier: emergency_taxes }
    cooldown: { years: 5 }
    effect:
      - add_gold: { value: income, multiply: 8, min: 30 }
      - add_modifier: { id: emergency_taxes, years: 3 }
      - every_vassal:
          add_opinion: { target: root, modifier: tyranny }
    ai_will_do:
      value: 0
      if:
        - limit: { is_at_war: yes, gold: "< 20" }
          add: 50

  prepare_invasion_of_england:
    icon: "⚓"
    major: true
    is_shown:
      culture: norman
      tier: ">= duchy"
      has_claim_on: title:k_england
      NOT: { has_flag: invasion_prepared }
    is_valid:
      is_at_war: no
    cost: { gold: 80, prestige: 100 }
    effect:
      - set_flag: invasion_prepared
      - add_modifier: { id: norman_host, years: 4 }
      - custom_tooltip: ui.invasion_tooltip
    ai_will_do: 90
    ai_check_months: 1

  unite_britannia:
    icon: "👑"
    major: true
    is_shown:
      tier: ">= kingdom"
      NOT: { exists: title:e_britannia.holder }
    is_valid:
      custom_tooltip:
        text: ui.need_two_british_kingdoms
        trigger:
          OR:
            - AND: [{ holds_title: title:k_england }, { holds_title: title:k_scotland }]
            - AND: [{ holds_title: title:k_england }, { holds_title: title:k_ireland }]
            - AND: [{ holds_title: title:k_england }, { holds_title: title:k_wales }]
            - AND: [{ holds_title: title:k_scotland }, { holds_title: title:k_ireland }]
    cost: { prestige: 1000, gold: 300 }
    effect:
      - gain_title: title:e_britannia
      - add_prestige: 500
      - add_modifier: { id: royal_coronation, years: 10 }
    ai_will_do: 100

  hire_mercenaries:
    icon: "🗡"
    is_shown: { is_ruler: yes, is_at_war: yes }
    is_valid:
      NOT: { has_modifier: mercenary_band }
    cost: { gold: { value: 80, add: { value: tier, multiply: 30 } } }
    effect:
      - add_modifier: { id: mercenary_band, years: 1 }
    ai_will_do:
      value: 0
      if:
        - limit: { gold: 250 }
          add: 40

script_values:
  feast_cost:
    value: 30
    add: { value: tier, multiply: 20 }
