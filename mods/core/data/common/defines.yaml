# Числовые константы движка. Любой мод может переопределить отдельные
# значения, просто указав их в своём файле defines — остальные сохранятся.
defines:
  start_gold_by_tier: [0, 40, 100, 250, 450]
  start_prestige_by_tier: [0, 50, 150, 400, 800]

  character:
    adult_age: 16
    marriage_age: 16
    base_health: 5
    personality_traits: 3
    base_stats: { fertility: 0.5 }
    # супруг правителя помогает советом: доля его собственных навыков
    spouse_skill_share: { diplomacy: 0.25, stewardship: 0.25, learning: 0.25 }
    stress_log_size: 8        # сколько последних источников стресса помнить (подсказка)
    old_age_start: 50
    old_age_health_per_year: 0.08
    old_age_prowess_per_year: 0.25
    old_age_fertility_per_year: 0.015
    health_mortality_factor: 0.35
    # [возраст, годовая вероятность смерти]
    mortality: [[0, 0.035], [5, 0.008], [16, 0.005], [30, 0.008], [40, 0.014], [50, 0.03], [60, 0.06], [70, 0.12], [80, 0.25], [90, 0.5]]
    min_fertile_age: 16
    max_fertile_age: 45
    base_conception: 0.03
    population_soft_cap: 850   # выше — рождаемость падает (мягкий предел числа живых персонажей)
    conception_child_decay: 0.85
    pregnancy_days: 270
    childbirth_death_chance: 0.015
    stress_decay: 2
    stress_skill_penalty: 1
    education_level_weights: [30, 40, 22, 8]
    name_after_relative_chance: 0.25
    prune_after_years: 60

  court:
    min_courtiers_by_tier: [0, 2, 3, 4, 5]
    max_courtiers_by_tier: [0, 5, 8, 11, 14]
    noble_courtier_chance: 0.5

  setup:
    female_ruler_chance: 0.03
    married_chance: 0.75

  economy:
    development_tax: 0.02
    development_levy: 0.01
    tax_skill: stewardship
    tax_per_skill: 0.02
    domain_skill: stewardship
    domain_limit_base: 2
    domain_limit_per_skill: 5
    domain_limit_by_tier: [0, 0, 1, 2, 3]
    over_domain_penalty: 0.2
    vassal_tax_share: 0.15
    vassal_levy_share: 0.35
    levy_maintenance_per_100: 0.25
    monthly_prestige_by_tier: [0, 0.2, 0.5, 1.0, 1.5]
    piety_per_learning: 0.03
    debt_prestige_divisor: 50
    dynasty_prestige_share: 0.1

  # Казна (engine/world/treasury.gd): книга по статьям за последние месяцы.
  treasury:
    history_months: 12
    # золото из скриптов (add_gold, pay_gold) — в статью по виду источника…
    source_kinds: { event: events, decision: decisions, interaction: interactions, building: estates, district: estates, on_action: events, law_inherit: relief, land_work: land_works }
    # …а точнее — по самому источнику
    sources:
      "on_action:on_siege_won": loot
      "interaction:demand_ransom": ransom
      "interaction:hook_demand_gold": hooks
      "interaction:send_gift": gifts
      "interaction:bribe": gifts
      "interaction:fulfill_ambition": gifts
      "interaction:temple_gift": temple
      "interaction:synod_sway_for": temple
      "interaction:synod_sway_against": temple
      "decision:take_loan": loans
      "event:realm.0001": loans
      "event:realm.0002": loans
      "event:realm.0003": loans
      "decision:hire_mercenaries": war
      "decision:give_alms": alms
      "decision:hold_feast": court
      "decision:hold_tournament": court

  development:
    base_growth: 0.12
    growth_per_stewardship: 0.005   # вторую половину даёт учёность (skills.learning.per_point)
    max: 100

  buildings:
    slots_per_holding: 2

  military:
    speed: 12            # пикселей карты в день
    min_army: 50
    min_levy_ratio: 0.1
    levy_regen: 0.05
    martial_bonus: 0.04
    battle_luck_min: 0.85
    battle_luck_max: 1.15
    loser_loss_base: 0.25
    loser_loss_scale: 0.4
    winner_loss_base: 0.05
    winner_loss_scale: 0.2
    battle_score_min: 5
    battle_score_max: 25
    battle_prestige: 20
    loser_commander_death: 0.04
    winner_commander_death: 0.01
    chase_min: 0.5                  # потери проигравших: 1 + pursuit победителя − orderly_retreat проигравшего
    chase_max: 1.8
    personal_example_safe: 0.03     # личный пример сверх этого — риск раны: (x − safe) × wound
    personal_example_wound: 2
    wound_trait: wounded
    siege_per_fort: 800
    siege_base: 400
    siege_speed: 3
    siege_max_daily: 12

  # Полководцы (engine/features/command.gd): очки перевеса и навыки (черты
  # command в common/command.yaml).
  command:
    per_martial: 1                # очко перевеса за очко военного дела
    stat_mult: 0.5                # очков перевеса за единицу commander_advantage (и home_advantage)
    example_mult: 50              # очков перевеса за единицу personal_example
    max_traits: 3                 # навыков у одного полководца — не больше
    learn_chance_win: 0.18        # шанс обрести навык после победы…
    learn_chance_lose: 0.06       # …и после поражения
    learn_per_martial: 0.05       # шанс × (1 + военное дело × это)
    learn_terrain_share: 0.4      # навык местности — если её доля клеток не меньше
    start_martial: [12, 17]       # на старте: от первого числа — один навык, от второго — два
    ai_min_gain: 3                # ИИ отдаёт армию другому, если тот лучше на столько очков

  # Сражение (считает ядро, native/src/battle.rs): перестрелка → сеча по
  # дням → слом и погоня. Проигравших полководцев и рыцарей судьба та же, что
  # в military (loser_commander_death…), погоня — chase_min/chase_max.
  battle:
    max_days: 5
    min_days: 2                   # раньше этого дня ломаются, только если дух иссяк совсем
    field_years: 2                # поле битвы остаётся на карте столько лет
    field_max: 30                 # и не больше стольких последних
    skirmish_scale: 0.03          # потери от перестрелки за единицу силы ranged
    melee_scale: 0.05             # потери за день сечи за единицу силы melee
    morale_per_loss: 150          # дух падает на столько за всю армию павшими
    break_morale: 20              # дух ниже — сторона ломается и бежит
    craven_break: 15              # у труса-полководца ломается раньше
    rout_frac: 0.35               # от войска осталось меньше — бегство
    levy_flee_morale: 30          # дух ниже — ополчение разбегается
    levy_flee_rate: 0.08          # доля ополчения, бегущая за день
    flee_morale: 0.3              # бегство ополчения бьёт по духу (доля от morale_per_loss)
    exchange_shock: 200           # проигранный за день размен потерь бьёт по духу сильнее…
    exchange_cap: 20              # …но не больше этого за день
    pursuit_cap: 0.25             # погоня выбивает не больше этой доли бегущих
    refuse_ratio: 3               # войско втрое меньше вражеского сечи не принимает — отходит после перестрелки
    pursuit_scale: 0.25            # погоня: потери за единицу силы pursuit
    charge_day: 2                 # день натиска конницы (горячий — раньше, осторожный — позже)
    luck_min: 0.7
    luck_max: 1.3
    morale_noise: 8               # дух каждой стороны за день колеблется на ± столько (слухи, знамения)
    advantage_effect: 0.015         # каждое очко перевеса полководца над вражеским — сила стороны
    advantage_cap: 25             # перевес считается не больше стольких очков
    morale_per_martial: 1         # дух войска за очко военного дела полководца
    max_counter: 0.75
    knight_melee: 8               # рыцарь бьёт в сече как prowess × knight_melee ополченцев
    duels_per_day: 2
    duel_per_prowess: 0.05        # шанс поединка: 50% ± за разницу доблести
    knight_kill: 0.12
    knight_wound: 0.3
    knight_capture: 0.15
    knight_morale: 3
    knight_slain_morale: 5
    # кого бьют чаще (доля урона по виду войск)
    exposure_melee: { levy: 1.3, infantry: 1.2, special: 1.1, cavalry: 0.8, ranged: 0.6, arcane: 1.0 }
    exposure_ranged: { levy: 1.2, infantry: 1.0, special: 0.9, cavalry: 0.7, ranged: 0.8, arcane: 1.0 }
    # ополчение
    levy: { melee: 1.0, ranged: 0.15, toughness: 1.0, morale: 50, pursuit: 0.4, screen: 0.6 }
    # нрав полководца: черты горячих (натиск раньше), осторожных (позже), трусов (ломаются раньше)
    aggressive: [brave, wrathful, impatient, arrogant]
    cautious: [patient, calm]
    craven: [craven]

  war:
    target_weight: 70
    max_battle_score: 50
    capital_bonus: 15
    max_ticking: 25
    ticking_gain: 2
    ticking_loss: 1
    defender_ticking_after_months: 12
    truce_years: 5
    ally_min_opinion: 0             # минус ally_persuasion зовущего (дипломатия)
    ai_surrender_threshold: 85      # минус peace_persuasion победителя (дипломатия)
    min_surrender_threshold: 50
    fatigue_after_years: 2
    fatigue_per_year: 6
    white_peace_years: 3
    white_peace_max_score: 30
    white_peace_losing: 35          # минус peace_persuasion того, кто предлагает мир

  ai:
    war_check_chance: 0.35
    war_strength_ratio: 1.3
    base_war_chance: 0.2
    enforce_at: 50
    surrender_to_player_at: 90
    max_targets_per_interaction: 12
    max_interaction_chance: 90
    marriage_chance: 0.5
    gold_reserve: 60
    build_chance: 0.3
    rich_gold: 400            # богаче — строит и вкладывается охотнее
    # копилка: ИИ выбирает стройку из того, что накопит за save_months дохода,
    # и копит на неё (не дольше goal_months); пока копит — тратит лишь мелочь
    # (до petty_spend или двух месячных доходов)
    save_months: 24
    goal_months: 48
    petty_spend: 10
    use_hook_min_will: 30          # ИИ давит крюком, только если очень хочет
    use_hook_on_player_min_will: 60

  opinion:
    same_culture: 5
    different_culture: -10
    same_faith: 5
    different_faith: -30
    spouse: 20
    parent: 20
    child: 20
    sibling: 10
    same_dynasty: 5
    liege_base: 0
    holds_my_claim: -15
    short_reign: -25        # вассалы не доверяют новому правителю…
    short_reign_years: 8    # …пока он не процарствует столько лет

  titles:
    create_fraction: 0.51
    create_cost:
      duchy: { gold: 100, prestige: 300 }
      kingdom: { gold: 300, prestige: 800 }
      empire: { gold: 600, prestige: 1600 }
    usurp_cost:
      duchy: { gold: 0, prestige: 400 }
      kingdom: { gold: 0, prestige: 1000 }
      empire: { gold: 0, prestige: 2000 }

  schemes:
    max_success: 95

  succession:
    default_law: partition
    max_partition_heirs: 4

  # Образ жизни: опыт в месяц = (base_xp + навык × xp_per_skill) × (1 + lifestyle_xp_mult);
  # цена перка = perk_cost + perk_cost_growth × (уже открытых перков этого образа жизни).
  lifestyle:
    base_xp: 20
    xp_per_skill: 2
    perk_cost: 300
    perk_cost_growth: 100
    second_branch_mult: 2     # перк второй ветки стези вдвое дороже
    focus_change_cooldown_months: 12

  # общая проверка (эффект check): удача, частичный успех, провал
  checks:
    partial_band: 15          # ширина полосы частичного успеха, %
    min: 5                    # шанс удачи не ниже
    max: 95                   # и не выше
    stress_penalty: 10        # минус к шансу за каждую сотню стресса

  momentum:
    success_stress: -5        # успех в своём деле снимает стресс
    failure_stress: 5         # провал добавляет

  events:
    # проверки навыка в событиях: шанс = check_base + (навык − сложность) × check_per_point
    check_base: 50
    check_per_point: 5
    check_min: 5
    check_max: 95
    check_stress_penalty: 10  # минус к шансу за каждую сотню стресса

  council:
    councillor_opinion: 10          # мнение советника о сюзерене
    ai_replace_skill_gap: 4         # ИИ меняет советника, если кандидат лучше на столько
    dismiss_opinion_modifier: dismissed_from_council
    ai_task_jitter: 4               # случайная добавка к пользе задачи — ИИ выбирает разнообразнее
    # дела: прогресс в месяц = (база + навык × коэф.) × скорость платы; 100 — событие
    # (навык 10 — дело за ~4,5 года, навык 20 — за ~3 года)
    progress_base: 0.6
    progress_per_skill: 0.12
    # жалованье: доля налогов с домена за каждое место, мнение советников, скорость дел
    pay:
      low: { share: 0.015, opinion: -10, speed: 0.7 }
      normal: { share: 0.03, opinion: 0, speed: 1.0 }
      generous: { share: 0.06, opinion: 10, speed: 1.3 }
    ai_low_pay_below: 40            # ИИ платит скупо, когда казна тоньше

  prison:
    escape_chance: 0.004            # в месяц
    escape_per_passage: 0.02         # × secret_passages (интрига 10 → +0,6% в месяц)
    siege_capture_chance: 0.5       # правитель в столице при её взятии
    family_capture_chance: 0.3
    battle_capture_chance: 0.08     # выживший полководец проигравших
    leader_captured_warscore: 75
    ransom_base: 40
    ransom_per_tier: 60
    ransom_income_months: 6
    monthly_stress: 2
    dungeon_health: -1
    crime_opinion_modifiers: [attempted_murder, murdered_relative, rebel, abducted_kin, caught_scheming]

  factions:
    power_threshold: 80             # % силы сюзерена, при котором растёт недовольство
    discontent_gain: 6              # в месяц
    discontent_decay: 4
    ai_consider_chance: 0.35        # ИИ-вассал раз в месяц думает о фракциях
    ai_join_chance: 0.5
    ai_create_threshold: 10         # ai_join, при котором ИИ создаёт фракцию
    ai_create_chance: 0.25
    ai_leave_below: -10
    cooldown_years: 5               # после распада фракции её члены не вступают в новые
    sibling_claim_chance: 0.5       # дети, не унаследовавшие титул, получают на него претензию
    ultimatum_event: faction.0001
    negotiation_check: 16           # переговоры с мятежниками: проверка дипломатии ИИ-сюзерена такой сложности
    negotiated_opinion: heard_out

  regiments:
    cap_by_tier: [0, 2, 3, 4, 6]    # сколько отрядов можно держать (по рангу)
    start_regiments_by_tier: [0, 0, 1, 2, 3]
    raised_upkeep_mult: 2
    reinforce_rate: 0.1             # пополнение в месяц (доля от полного состава)
    max_counter: 0.75
    ai_recruit_chance: 0.15
    ai_gold_reserve: 60
    ai_disband_below_gold: -30
    # дружина (Retinue): опыт отрядов — новобранцы → бывалые → ветераны →
    # прославленные; quality — сила отряда в бою (×), morale — дух,
    # upkeep_mult — жалованье (×), reinforce_mult — пополнение (×: тянет добровольцев)
    ranks:
      - { id: recruits, xp: 0, quality: 1.0, morale: 0 }
      - { id: seasoned, xp: 100, quality: 1.08, morale: 4 }
      - { id: veterans, xp: 250, quality: 1.16, morale: 8, upkeep_mult: 1.2 }
      - { id: renowned, xp: 500, quality: 1.25, morale: 12, upkeep_mult: 1.5, reinforce_mult: 1.6 }
    xp_battle: 12            # за бой
    xp_win: 18               # за победу
    xp_kills: 60             # за сражённых: kills / воинов отряда × xp_kills
    xp_refused: 0.4          # бой без сечи — доля опыта
    xp_max: 800
    reinforce_keep: 0.3      # пополнение разбавляет опыт: новобранец приносит эту долю опыта отряда
    start_xp: [0, 200]       # опыт стартовых отрядов
    chronicle_max: 10        # строк летописи отряда
    captain_prowess: 0.012   # капитан: сила отряда за очко доблести (×)
    captain_quality_max: 0.25
    captain_martial: 0.6     # дух отряда за очко военного дела капитана
    captain_death: 0.15      # гибель капитана: × доля потерь отряда (у проигравших × 2)
    ai_captain_min: 14       # ИИ ставит капитаном того, у кого доблесть + военное дело не меньше
    unpaid_months: 3         # столько месяцев в долгах — и дружина начинает уходить
    desert_opinion: -20      # капитан ветеранов уводит отряд от наследника, если мнение ниже

  mercenaries:
    hire_mult: 0.45          # найм: цена отрядов роты × hire_mult × (1 + опыт/xp_price)
    fee_mult: 3.0            # плата в месяц: жалованье отрядов × fee_mult
    xp_price: 500
    contract_months: 12      # срок; на войне продлевается сам, пока платят
    max_hired: 2             # рот на службе у одного правителя
    min_tier: 1              # нанимают правители от этого ранга (1 — граф)
    reinforce_rate: 0.08     # свободная рота пополняется в месяц
    ai_hire_chance: 0.5      # ИИ на войне нанимает, если его сила меньше вражеской × ai_hire_ratio
    ai_hire_ratio: 1.15
    ai_gold_reserve: 20

  knights:
    cap_by_tier: [0, 3, 5, 8, 12]
    power_per_prowess: 8            # рыцарь с доблестью 12 стоит ~100 ополченцев
    loser_death_chance: 0.04
    loser_wound_chance: 0.12
    winner_death_chance: 0.01
    winner_wound_chance: 0.05
    wound_trait: wounded
    prestige_per_battle: 10

  hooks:
    strong_hook_cooldown_years: 5   # сильный крюк можно использовать не чаще

  secrets:
    max_known_per_secret: 12
    plotter_weight: 4               # во столько раз чаще тайный советник находит секреты заговорщиков

  # Механики движка, которые нужно отключить (lifestyles, council, prison, factions, regiments, secrets, laws,
  # knights, politics, personality, renown, lands, momentum, duels).
  disabled_features: []

  # Характеристики, доступные в скриптах как значения (gold, age и навыки — встроены).
  script_stat_values: [general_opinion, vassal_opinion, monthly_prestige, monthly_piety, commander_advantage, levy_flat, scheme_power, scheme_defense, loot_mult, audit_chance, turn_plotter_chance, secret_passages, personal_example]
