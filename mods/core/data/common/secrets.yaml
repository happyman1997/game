# Секреты и крюки. secret_types: hook — какой крюк даёт шантаж (strong/weak);
# severity — насколько тяжёл (шантажируют и разоблачают самым тяжёлым);
# discovered_by — списки, чьи члены могут случайно узнать секрет;
# discovery_chance — шанс в месяц (%); on_expose — эффект разоблачения
# (root — владелец секрета, scope:exposer, scope:secret_target).
secret_types:
  secret_murder:
    icon: "🩸"
    hook: strong
    severity: 100
    discovered_by: [spouse, close_family, courtier]
    discovery_chance: 0.4
    on_expose:
      - add_prestige: -200
      - if:
          limit: { exists: scope:secret_target }
          scope:secret_target:
            every_close_family:
              limit: { NOT: { is_same_as: root } }
              add_opinion: { target: root, modifier: murdered_relative }
      - if:
          limit: { exists: liege }
          mark_criminal: { target: liege, years: 10 }
          liege: { add_opinion: { target: root, modifier: exposed_murderer } }
  secret_lover:
    icon: "💘"
    hook: weak
    severity: 40
    discovered_by: [spouse, courtier]
    discovery_chance: 1.5
    on_expose:
      - add_prestige: -50
      - every_spouse:
          add_opinion: { target: root, modifier: cheated_on_me }
      - if:
          limit: { exists: scope:secret_target }
          scope:secret_target:
            add_prestige: -50
            every_spouse: { add_opinion: { target: scope:secret_target, modifier: cheated_on_me } }
  secret_embezzler:
    icon: "🪙"
    hook: strong
    severity: 60
    discovered_by: [liege, courtier]
    discovery_chance: 1
    on_expose:
      - add_prestige: -100
      - if:
          limit: { exists: scope:secret_target }
          mark_criminal: { target: scope:secret_target, years: 10 }
          scope:secret_target: { add_opinion: { target: root, modifier: embezzled_from_me } }

interactions:
  blackmail:
    requires_feature: secrets
    icon: "🤐"
    category: hostile
    is_shown:
      knows_secret_of: scope:recipient
    is_valid:
      NOT: { has_strong_hook_on: scope:recipient }
    auto_accept: yes
    on_accept:
      - blackmail: scope:recipient
      - scope:recipient: { add_opinion: { target: scope:actor, modifier: blackmailed_me } }
    ai_targets: known_secret_owner
    ai_frequency_months: 6
    ai_will_do:
      value: 10
      if:
        - limit: { has_trait: [deceitful, ambitious, greedy, arbitrary] }
          add: 25
        # крюк на заговорщика — способ расколоть фракцию
        - limit: { scope:recipient: { is_vassal_of: scope:actor, is_in_faction: yes } }
          add: 30
        - limit: { has_trait: [honest, just, compassionate] }
          multiply: 0
        - limit: { scope:recipient: { is_close_family_of: scope:actor } }
          multiply: 0.2

  expose_secret:
    requires_feature: secrets
    icon: "📢"
    category: hostile
    is_shown:
      knows_secret_of: scope:recipient
    auto_accept: yes
    on_accept:
      - expose_secret: scope:recipient
      - add_prestige: 20
      - scope:recipient: { add_opinion: { target: scope:actor, modifier: exposed_me } }
    ai_targets: known_secret_owner
    ai_frequency_months: 12
    ai_will_do:
      value: 0
      if:
        - limit: { has_trait: [honest, just, zealous] }
          add: 25
        - limit: { opinion: { target: scope:recipient, value: "< -20" } }
          add: 20
        - limit: { scope:recipient: { is_close_family_of: scope:actor } }
          multiply: 0

  fabricate_hook:
    requires_feature: secrets
    icon: "🪝"
    category: hostile
    scheme: fabricate_hook
    is_shown:
      scope:recipient: { is_adult: yes }
      NOT: { scope:actor: { has_hook_on: scope:recipient } }
    ai_targets: [liege, vassal, neighboring_ruler]
    ai_frequency_months: 24
    ai_will_do:
      value: 0
      if:
        - limit: { has_trait: [deceitful, ambitious] }
          add: 15
        - limit: { scope:recipient: { is_liege_of: scope:actor } }
          add: 10

schemes:
  fabricate_hook:
    requires_feature: secrets
    category: hostile
    icon: "🪝"
    skill: intrigue
    is_valid:
      scope:target: { is_alive: yes }
      NOT: { scope:owner: { has_hook_on: scope:target } }
    progress:
      value: 5
      add: { value: "scope:owner.intrigue", multiply: 0.5 }
    success_chance:
      value: 25
      add:
        - { desc: ai.your_intrigue, value: { value: "scope:owner.intrigue", multiply: 2.5 } }
        - { desc: ai.target_intrigue, value: { value: "scope:target.intrigue", multiply: -1.5 } }
        - { desc: ai.scheme_power, value: "scope:owner.scheme_power" }
        - { desc: ai.target_scheme_defense, value: { value: "scope:target.scheme_defense", multiply: -0.7 } }
      min: 5
      max: 90
    discovery_chance:
      value: 4
      add: { value: "scope:target.scheme_defense", multiply: 0.2 }
    on_success:
      - scope:owner:
          add_hook: { target: scope:target, years: 10 }
          send_message: { text: msg.hook_fabricated, kind: good }
    on_failure:
      - scope:owner: { send_message: { text: msg.hook_failed, kind: bad } }
    on_discovered:
      - scope:target: { add_opinion: { target: scope:owner, modifier: insulted, value: -25 } }

council_tasks:
  find_secrets:
    requires_feature: secrets
    position: spymaster
    icon: "🔎"
    monthly_chance: { value: intrigue, multiply: 0.8 }
    monthly_effect:
      scope:liege: { discover_secret: yes }
    ai_will_do:
      value: 7
      if:
        - limit: { has_trait: [deceitful, paranoid, ambitious] }
          add: 6
        - limit: { any_faction_against: yes }
          add: 12

opinion_modifiers:
  blackmailed_me: { value: -30, years: 10 }
  exposed_me: { value: -50, decay: 0.3 }
  exposed_murderer: { value: -40, years: 10 }
  cheated_on_me: { value: -40, decay: 0.3 }
  embezzled_from_me: { value: -40, years: 10 }

events:
  # Казначей с жадной душой запускает руку в казну.
  secret.0001:
    requires_feature: secrets
    triggered_only: true
    theme: intrigue
    icon: "🪙"
    trigger:
      is_councillor: steward
      has_trait: [greedy, deceitful]
      scope:liege: { gold: ">= 50" }
      NOT: { has_secret: secret_embezzler }
    immediate:
      - scope:liege: { save_scope_as: victim }
    options:
      - effect:
          add_gold: 40
          scope:victim: { add_gold: -40 }
          add_secret: { type: secret_embezzler, target: scope:victim }
        ai_chance: 80
      - effect: { add_stress: 10 }
        ai_chance: 20

# Ежемесячный «пульс» советников (root — советник, scope:liege — правитель).
on_actions:
  on_councillor_pulse:
    random_events:
      chance: 2
      events:
        secret.0001: 10
