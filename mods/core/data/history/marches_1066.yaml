  sonning: { culture: marcher, prestige: 1000 }
  kronwald: { culture: marcher, prestige: 500 }
  wolfing: { culture: marcher, prestige: 350 }
  felsen: { culture: marcher, prestige: 300 }
  eisenwart: { culture: marcher, prestige: 300 }
  ukkena: { culture: frisian, prestige: 150 }
  attena: { culture: frisian, prestige: 120 }
  benninga: { culture: frisian, prestige: 100 }
  idzinga: { culture: frisian, prestige: 80 }
