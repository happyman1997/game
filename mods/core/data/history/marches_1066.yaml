# Пепельные марки в 1066 году. Полвека назад, в день летнего солнцестояния
# 1016 года, император Отгар Сожжённый поджёг себя и Зонненштадт; с ним сгорел
# наследник, и мужская линия Зоннингов пресеклась. Четыре дочери императора
# были замужем за маркграфами — их сыновья и дочь правят марками сегодня, и
# каждый считает себя законным наследником. Венец пропал в пепле.
