# Норвежское вторжение: Харальд Суровый собирает флот, чтобы взять Англию.
decisions:
  prepare_norse_invasion:
    icon: "🛶"
    major: true
    is_shown:
      culture: norse
      tier: ">= kingdom"
      has_claim_on: title:k_england
      NOT: { has_flag: norse_invasion_prepared }
    is_valid:
      is_at_war: no
    cost: { gold: 80 }
    effect:
      - set_flag: norse_invasion_prepared
      - add_prestige: 150
      - add_modifier: { id: viking_host, years: 3 }
      - custom_tooltip: ui.norse_invasion_tooltip
    ai_will_do: 90
    ai_check_months: 1

modifiers:
  viking_host: { icon: "🛶", modifiers: { levy_flat: 6000, martial: 2, commander_advantage: 8, prowess: 2 }, good: true }
