# Пепельные марки — земли павшей Солнечной империи. В 1016 году последний
# император Отгар Сожжённый поджёг себя и свою столицу Зонненштадт; огонь
# выжег сердце империи, а Солнечный венец пропал в пепле. Четыре маркграфа —
# внуки Отгара по дочерям — правят окраинами и ищут венец; рыцарский орден
# Стражей Пепла верит, что венец проклят, и не даёт его найти; на севере
# крестьяне болот живут без господ, на востоке в Рудных горах — цверги.
# Пепелище посредине — дикие земли без владельцев.
titles:
  e_sun_empire: { tier: empire, color: "#c9a23a", capital: c_sonnenstadt }

  # ---------------------------------------------------------- Рейнская марка
  # Старый двор: в Кронхафене хранятся императорские регалии — кроме венца.
  k_rhine_march: { tier: kingdom, liege: e_sun_empire, color: "#b8433a", capital: c_kronhafen }
  d_kronland: { tier: duchy, liege: k_rhine_march, color: "#c24f44", capital: c_kronhafen }
  d_maasland: { tier: duchy, liege: k_rhine_march, color: "#a83b34", capital: c_silberau }
  d_weingau: { tier: duchy, liege: k_rhine_march, color: "#b8565a", capital: c_weinberg }
  d_wasgau: { tier: duchy, liege: k_rhine_march, color: "#9e3a30", capital: c_goldbach }

  # ---------------------------------------------------------- Северная марка
  # Воины пустошей и побережья: лучшее войско марок, бедная казна.
  k_north_march: { tier: kingdom, liege: e_sun_empire, color: "#4f6a8c", capital: c_wolfsgard }
  d_wolfsmark: { tier: duchy, liege: k_north_march, color: "#5a779a", capital: c_wolfsgard }
  d_heideland: { tier: duchy, liege: k_north_march, color: "#465f80", capital: c_heidemoor }
  d_nordgau: { tier: duchy, liege: k_north_march, color: "#5f7fa4", capital: c_sturmfeld }
  d_rossgau: { tier: duchy, liege: k_north_march, color: "#3f5675", capital: c_rossmark }

  # ---------------------------------------------------------- Южная марка
  # Горцы-наёмники: их роты служат любому, кто платит.
  k_south_march: { tier: kingdom, liege: e_sun_empire, color: "#5a8a4a", capital: c_soldburg }
  d_soldgau: { tier: duchy, liege: k_south_march, color: "#659856", capital: c_soldburg }
  d_alpenmark: { tier: duchy, liege: k_south_march, color: "#4f7c40", capital: c_felsengau }
  d_tannenland: { tier: duchy, liege: k_south_march, color: "#46703a", capital: c_steinach }
  d_talgau: { tier: duchy, liege: k_south_march, color: "#6fa25e", capital: c_talmark }

  # ---------------------------------------------------------- Восточная марка
  # Крепости на границе и торг с цвергами.
  k_east_march: { tier: kingdom, liege: e_sun_empire, color: "#8a6a3a", capital: c_grenzburg }
  d_grenzmark: { tier: duchy, liege: k_east_march, color: "#967544", capital: c_grenzburg }
  d_seemark: { tier: duchy, liege: k_east_march, color: "#7e6034", capital: c_wachtholm }
  d_erzgau: { tier: duchy, liege: k_east_march, color: "#a07d4a", capital: c_erzfurt }

  # ---------------------------------------------------------- Орден Стражей Пепла
  # Крепости-монастыри у края пепелища.
  k_ash_order: { tier: kingdom, liege: e_sun_empire, government: order, color: "#d8d4c8", capital: c_aschenwacht }
  d_ashwatch: { tier: duchy, liege: k_ash_order, color: "#e0dccf", capital: c_aschenwacht }
  d_bussland: { tier: duchy, liege: k_ash_order, color: "#cdc8b8", capital: c_bussfeld }

  # ---------------------------------------------------------- Пепелище
  d_ash_heart: { tier: duchy, liege: e_sun_empire, color: "#5e5a56", capital: c_sonnenstadt, no_generate: yes }

  # ---------------------------------------------------------- Вольная Фрисия
  # Крестьяне болот без господ: сход в каждом графстве, вожак на десять лет.
  k_frisia: { tier: kingdom, government: people_republic, color: "#3a9aa8", capital: c_terpenholm }
  d_wadden: { tier: duchy, liege: k_frisia, color: "#44a8b5", capital: c_terpenholm }
  d_dijkland: { tier: duchy, liege: k_frisia, color: "#328c99", capital: c_dijkshorn }

  # ---------------------------------------------------------- Подгорное царство
  # Цверги Рудных гор: правит лучший мастер.
  k_underhill: { tier: kingdom, government: master_council, color: "#7a4a8a", capital: c_copper_mountain }
  d_ore_mountains: { tier: duchy, liege: k_underhill, color: "#86569a", capital: c_copper_mountain }
  d_stone_belt: { tier: duchy, liege: k_underhill, color: "#6c3f7a", capital: c_stone_belt }

