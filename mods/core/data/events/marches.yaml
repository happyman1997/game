# Пепельные марки: вступительные события для каждой державы и цверги на
# службе у людей.
on_actions:
  on_player_start:
    events: { $append: [marches.0001, marches.0002, marches.0003, marches.0004, marches.0005, marches.0006, marches.0007] }
  # всеобщее ополчение: на народную республику напали — встаёт весь народ
  on_war_started:
    effect:
      $append:
        - scope:defender:
            if:
              limit: { government: people_republic }
              then:
                add_modifier: { id: levee_en_masse, years: 3 }
  on_war_ended:
    effect:
        - scope:defender:
            if:
              limit: { has_modifier: levee_en_masse }
              then:
                remove_modifier: levee_en_masse
  # поиск венца — дело рода: след переходит к наследнику
  on_death:
    effect:
      $append:
        - if:
            limit: { var: { name: crown_trail, value: ">= 1" } }
            then:
              primary_heir:
                change_var: { name: crown_trail, add: scope:deceased.var:crown_trail }
                add_modifier: { id: crown_trail, years: 10 }

scripted_triggers:
  # правитель одной из держав Пепельных марок — у них своё вступление
  rules_ashen_marches_realm:
    OR:
      - holds_title: k_rhine_march
      - holds_title: k_north_march
      - holds_title: k_south_march
      - holds_title: k_east_march
      - holds_title: k_ash_order
      - holds_title: k_frisia
      - holds_title: k_underhill

events:
  # общее вступление — не для марок
  start.0001:
    trigger: { rules_ashen_marches_realm: no }

  # Рейнская марка: регалии без венца.
  marches.0001:
    theme: realm
    icon: "👑"
    triggered_only: true
    trigger: { holds_title: k_rhine_march }
    options:
      # объявить себя наследником империи
      - effect:
          add_prestige: 150
          set_flag: { name: crown_seeker, years: 5 }
          every_vassal:
            limit: { has_claim_on: title:k_rhine_march }
            add_opinion: { target: root, modifier: insulted }
      # помириться с братом
      - effect:
          add_prestige: -30
          every_vassal:
            limit: { has_claim_on: title:k_rhine_march }
            add_opinion: { target: root, modifier: grateful }
      # регалии — для вида, а казна — для дела
      - effect:
          add_gold: 100
          add_prestige: -50

  # Северная марка: мечи важнее венца.
  marches.0002:
    theme: war
    icon: "🐺"
    triggered_only: true
    trigger: { holds_title: k_north_march }
    options:
      - effect:
          add_regiment: heavy_infantry
          add_gold: -40
      # через жену-фризку — союз с вольными болотами
      - trigger:
          title:k_frisia: { is_held: yes }
        effect:
          title:k_frisia:
            holder: { save_scope_as: frisian_elder }
          add_alliance: scope:frisian_elder
          add_prestige: -20

  # Южная марка: серебро гор.
  marches.0003:
    theme: court
    icon: "💰"
    triggered_only: true
    trigger: { holds_title: k_south_march }
    options:
      # оставить роты себе
      - effect:
          - add_regiment: mountain_companies
          - add_regiment: mountain_companies
      # сдать роты внаём
      - effect:
          add_gold: 200

  # Восточная марка: старый маркграф и его наследник.
  marches.0004:
    theme: family
    icon: "🏯"
    triggered_only: true
    trigger: { holds_title: k_east_march }
    options:
      # довериться наследнику
      - effect:
          primary_heir:
            add_opinion: { target: root, modifier: grateful }
          add_stress: 10
      # держать наследника на коротком поводке
      - effect:
          primary_heir:
            add_opinion: { target: root, modifier: insulted }
          add_stress: -10
          add_dread: 5
      # торговый договор с Подгорьем
      - effect:
          add_modifier: { id: zwerg_trade, years: 10 }

  # Орден: обет Стражей.
  marches.0005:
    theme: faith
    icon: "⚱"
    triggered_only: true
    trigger: { holds_title: k_ash_order }
    options:
      - effect:
          add_piety: 150
      # призвать добровольцев из-за моря
      - effect:
          - add_prestige: -50
          - create_character: { culture: norman, faith: ash_penitence, age: 24, female: no, traits: [order_brother, brave], dynasty: none }
          - create_character: { culture: danish, faith: ash_penitence, age: 22, female: no, traits: [order_brother, zealous], dynasty: none }

  # Фрисия: сход на терпе.
  marches.0006:
    theme: realm
    icon: "⚖"
    triggered_only: true
    trigger: { holds_title: k_frisia }
    options:
      # говорить на сходе — до выборов недолго
      - effect:
          add_campaign: 3
          add_prestige: 20
      # чинить дамбы всем миром
      - effect:
          every_domain_province:
            limit: { terrain: wetlands }
            add_county_opinion: grievances_heard

  # Подгорное царство: совет мастеров.
  marches.0007:
    theme: court
    icon: "⚒"
    triggered_only: true
    trigger: { holds_title: k_underhill }
    options:
      # открыть торг с людьми
      - effect:
          add_gold: 150
          add_modifier: { id: zwerg_trade, years: 10 }
      # закрыть ворота горы
      - effect:
          add_modifier: { id: closed_gates, years: 10 }

  # Мастер-цверг пришёл служить ко двору.
  marches.0010:
    theme: court
    icon: "⛏"
    triggered_only: true
    immediate:
      create_character:
        culture: zwerg
        faith: ancestor_cult
        age: 60
        traits: [education_stewardship_3, diligent]
        dynasty: new
        save_scope_as: zwerg_master
    options:
      - effect:
          scope:zwerg_master: { add_opinion: { target: root, modifier: grateful } }
