building_desc:
  armory: "Stores of spears, shields and helmets: the levy is better armed and more regiments can be kept."
  gallows: "Executions and floggings before the whole town. Fewer petitions, more dread — but the county dislikes its lord."
  great_hall: "A feasting hall where the lord receives vassals. Honour for the vassals, renown for the lord."
  donjon: "The last and tallest tower of the fortress. Requires walls; the owner's capital holds out longer under siege."
  caravanserai: "Visiting merchants bring goods and rumours. Once a year, the stronger the quarter, the likelier the lord learns someone's secret."
  bathhouse: "Steam and birch twigs: the lord is healthier and calmer."
  mint: "The realm's own coin. Income for the treasury, and vassals pay their taxes more faithfully. One per realm."
  bell_tower: "The bell calls to prayer and to arms alike."
  sun_school: "Lightbearer priests teach the children of the court and their tutors. Wards learn faster."
  vineyard: "Wine for the table and for sale: taxes and a little renown for the lord."
  orchards: "Apple and pear trees around the villages: the county grows and is content."
  sheepfold: "Sheep on the hills and plains: wool is silver."
  tannery: "Leather for armour and harness: taxes and slightly stronger regiments."
  weavers: "Cloth and linen for sale."
  siege_workshop: "Rams and siege engines: enemy fortresses fall faster."
  fishery: "Fish for towns and fasts: taxes, growth and full bellies."
  customs: "Duties on foreign ships. Good for the treasury, less so for the townsfolk."
  longhouse: "The longhouse of a northern war band that lives by raiding: more loot from every fortress taken."
  polders: "Land won from sea and marsh by dikes and ditches. Wetlands only."
  mine: "Ore and silver of the hills and mountains: taxes and income once a year by the quarter's power."
  ash_watch: "An outpost on the edge of the Ashlands. The lord's army loses fewer men in the ash; the watchmen pray for him."
  wolf_shrine: "Fangs and blood on the altar of the Winter Wolf. The war band is fiercer and the neighbours afraid."
  ancestor_hall: "The memory of the house in stone: dynasty legacies are cheaper and the house more renowned."
  east_cloister: "A cloister of the Eastern Rite. Heretics stick together."
  sun_cathedral: "The greatest temple of the Sun in the world. Piety and renown for its lord, respect from all around. The only one in the world; built by kings of the Sun faith."
  university: "Scholars from all around: the ruler and court grow wiser, children learn faster. One per realm."
  great_market: "A fair half the world comes to: great income every year, and curio merchants visit constantly. The only one in the world."
  border_wall: "A chain of walls and outposts along the whole frontier: every domain fortress is sturdier, the capital holds out longer, campaigns are easier. One per realm."
  hall_of_justice: "The lord's court for the whole realm. Factions build discontent more slowly, vassals are calmer. One per realm."
  royal_stables: "The finest horses of the realm: faster armies, stronger knights. One per realm."
  great_forge: "A forge that never goes out: stronger regiments, cheaper upkeep, better commissions. One per realm."
  great_lighthouse: "A fire seen a day's sail away. Renown for its lord and growth for the town. The only one in the world."
  walls: "Stone instead of a palisade: the fortress holds out twice as long."
  barracks: "The county levy lives and drills here."
  training_grounds: "A field for mounted jousts. The owner's commanders and knights fight better."
  dungeon: "A pit under the tower that nobody leaves. Every prisoner in the owner's dungeon breeds more dread — but the county grumbles."
  watchtower: "The watch sees an army a day away. The county is sturdier and the owner's capital holds out longer under siege."
  secret_passage: "A tunnel under the walls known to three people. The owner may slip out of a fallen capital and escape a foreign dungeon."
  market: "Rows of stalls and a grain measure. The quarter's main income."
  guild_hall: "Guilds fix prices and build the town. Taxes grow, and so does the county."
  fairground: "Once a year merchants gather from all around: the treasury takes a share of the trade, more the stronger the quarter. Sometimes a curio merchant comes along."
  money_changer: "Money changers and lenders. Construction and commissions are cheaper, and in a hard year the changers will lend (the Changers' Loan decision)."
  monastery: "The brethren pray for the owner and teach letters."
  cathedral: "A cathedral of the Sun. Piety and renown for the owner."
  hospice: "A shelter for pilgrims, orphans and cripples. The county is grateful, and every year Light falls on the owner's soul."
  scriptorium: "Scribes copy chronicles and teach the children of the court. Wards learn faster, and so does the ruler."
  reliquary: "A shrine with relics that pilgrims visit: piety and alms once a year. If the owner keeps a reliquary in the treasury, three times as many come."
  farms: "Farmsteads around the county: more bread, more taxes and people."
  hunting_grounds: "A forest reserved for the hunt. The owner is stronger and calmer."
  granary: "Bread stored for a hungry year. A well-fed county submits faster and petitions less."
  stud_farm: "Herds of war horses. The owner's armies march faster and cut down the fleeing."
  supply_depot: "Carts, barrels, hardtack. On campaigns through the Ashlands and wild lands the army loses fewer men."
  forge: "Forges make armour and blades: stronger regiments, cheaper upkeep."
  masons: "Masons and carpenters. All construction in the domain is faster, and its fortresses sturdier."
  goldsmith: "A jewellers' workshop. Commissions are cheaper, and pieces come out rarer."
  docks: "Quays for merchant ships. Taxes, and dues from ships once a year."
  salt_works: "Sea salt — the silver of the coast."
  shipyard: "Ships are built here: the army crosses by sea, campaigns and sieges are faster."
  lighthouse: "A fire on the cape leads ships into port. The town grows, and so does the owner's renown."
msg:
  fair_income: "The fair at [scope:province.name] drew merchants from all around: [scope:fair_gold] gold to the treasury."
  pilgrims: "Pilgrims to the shrine at [scope:province.name] left [scope:pilgrim_gold] gold in alms."
