district_desc:
  citadel: "The fortified heart of the county: walls, barracks, a dungeon. Stronger on a border with another realm and in the mountains."
  market: "Shops, warehouses and trade. Every neighbouring market quarter whose lord is not at war with yours is a trade route and adds power."
  temple_quarter: "The temple and everything around it: monks, scribes, alms. Halved if the county follows another faith."
  fields: "Ploughland, mills, stables. Farmlands and plains yield best; hills and marshes worse."
  crafts: "Forges and workshops. Ore lies in hills and mountains; the guilds of a domain support each other."
  harbor: "Quays and warehouses by the sea. The harbours of a domain form one sea trade, and neighbouring markets bring them goods."
