vassal_obligation:
  privileged: Privileges
  standard: Standard Obligations
  heavy: Heavy Duties
vassal_obligation_desc:
  privileged: The vassal pays half the taxes and sends half the troops — and is grateful for it.
  standard: The usual terms of service.
  heavy: The vassal pays half as much again and sends more troops. They will not forget it.

