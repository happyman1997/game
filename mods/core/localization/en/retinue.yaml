mercenary_company_desc:
  grey_lances: Light horse from the far pastures; they come dear, but they come first.
  heather_bows: Archers from the heather hills — they strike from afar and dislike the melee.
  rusted_oath: Heavy foot bound by an old oath; never once have they fled a field.
  ash_wolves: Rabble from the ashlands; they fight hard and take no prisoners.
  stone_shields: Pikemen whose line breaks any cavalry.
  crimson_hooves: Heavy riders in crimson caparisons — costly and terrible.
  sons_of_the_waste: Exiles of the wastes; cheap and green, but many.
  lantern_company: An old company with a lantern on its banner; they march by night and keep their word.
