  fief_law: Fief Inheritance
law_group_desc:
  crown_authority: How strong the ruler's power over the vassals is. The higher it is, the more taxes and troops the vassals provide — and the less they like it.
  tax_law: How much the domain peasants pay. Heavy taxes bring more gold but anger the counties and slow their growth.
  military_service: "How vassals and peasants serve: with gold instead of soldiers, or with a general levy."
  church_law: "The Temple's rights in the realm: liberties bring piety and the faith head's favour, the royal tithe brings gold and the Temple's anger."
  fief_law: "What the liege gets when a vassal dies: nothing, relief from the heir, or the fief itself when there is no heir."
