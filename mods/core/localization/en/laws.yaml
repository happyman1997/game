realm_law_desc:
  crown_authority_0: The vassals are nearly independent. They are content but pay less and send fewer troops.
  crown_authority_1: The usual order. The ruler may revoke titles, but it is considered tyranny.
  crown_authority_2: The vassals pay more and send more troops, though they grumble.
  crown_authority_3: The ruler's word is law. Revoking titles is not considered tyranny.
  tax_law_0: The counties pay less, but are happier and grow faster.
  tax_law_1: The usual taxes.
  tax_law_2: More gold from the domain — and angrier counties. Cannot be enacted with two or more discontented counties.
  military_service_0: "Vassals buy their way out of service with gold: fewer troops, more vassal taxes. Cannot be enacted during a war."
  military_service_1: The usual service.
  military_service_2: "Everyone who can hold a weapon marches: more troops, but the counties and vassals are unhappy."
  church_law_0: The Temple pays no taxes and judges its own. Lower taxes, more piety, the faith head is pleased.
  church_law_1: "The usual order: neither crown nor Temple pulls the blanket its way."
  church_law_2: The crown takes a share of the Temple's tithe. Higher taxes, less piety, the faith head is displeased.
  fief_law_0: Vassals' heirs take up their fiefs freely. The vassals like it.
  fief_law_1: A vassal's heir pays the liege relief — a year's income, but no more than half the treasury.
  fief_law_2: "Relief — and more: the fief of a count who dies childless returns to the liege. The vassals are unhappy. Requires at least High crown authority."
