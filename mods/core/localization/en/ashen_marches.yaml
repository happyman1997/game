culture:
  marcher: Marcher
  frisian: Frisian
  zwerg: Zwerg

faith:
  ash_penitence: Ashen Penitence
  ancestor_cult: Covenant of the Ancestors
faith_desc:
  ash_penitence: "The ash is punishment for the pride of the empire. The sacraments of the old church — but pride and ambition are the first of sins."
  ancestor_cult: "The zwerge honour their ancestor-masters, whose names are carved in stone, and swear by their hammers."

terrain:
  ash: Ashlands

stat:
  lifespan_mult: Longevity

trait:
  dwarf: Zwerg
trait_desc:
  dwarf: "The zwerge live twice as long as men, but their children are rare. They marry only their own kind."

building:
  imperial_regalia: Imperial Regalia
  wolf_hall: Wolf Hall
  mercenary_market: Mercenary Market
  border_citadel: Border Citadel
  ash_citadel: Ash Citadel
  great_dike: Great Dike
  deep_forges: Deep Forges
  burnt_palace: Burnt Palace
building_desc:
  imperial_regalia: "The sceptre, orb and sword of the Sun Empire. Only the crown is missing."
  wolf_hall: "Here the margraves of the North feast with their knights and pick the best fighters."
  mercenary_market: "The mountain companies hire out here to anyone who pays in silver."
  border_citadel: "Walls built over half a century: a chain of fortresses from Grenzburg to the mountains."
  ash_citadel: "A fortress-monastery on the edge of the ashes. The brothers keep watch day and night."
  great_dike: "A dike the Frisians built together: it holds back the sea — and holds them together."
  deep_forges: "The forges deep in the Copper Mountain have not gone out for a thousand years."
  burnt_palace: "The charred walls of Otgar's palace. Whoever holds them holds the memory of the empire."

regiment_type:
  mountain_companies: Mountain Companies
  dike_militia: Dike Militia
  ironclads: Ironclads
regiment_type_desc:
  mountain_companies: Pikemen from the mountains of the South March. Mercenaries famed across the empire; none match them in the mountains.
  dike_militia: Frisian peasants with hooks and flails. In the marshes, knights' horses sink before their eyes.
  ironclads: Zwerge in forged plate. Slow, but nearly impossible to stop.

