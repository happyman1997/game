# The Synod (data/common/synod.yaml, events/synod.yaml).
interaction:
  synod_sway_for: Sway a Vote “For” at the Synod
  synod_sway_against: Sway a Vote “Against” at the Synod
interaction_desc:
  synod_sway_for: "Gold, friendship or a hook — and this ruler will vote “for” at the Synod. The weightier their vote, the dearer it costs."
  synod_sway_against: "Gold, friendship or a hook — and this ruler will vote “against” at the Synod. The weightier their vote, the dearer it costs."
opinion_modifier:
  broke_the_peace: Broke the Peace of the Sun
msg:
  broke_the_peace: "You have broken the Peace of the Sun by attacking a coreligionist. The Temple will not forgive it."
  synod_sway_refused: "The ruler would not change their vote at the Synod."
ev:
  synod.0002:
    t: The Synod Is Called
    desc: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod at Reims. In a year the rulers of the faith will decide a great question — and until then everyone looks for allies."
    desc_anathema: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to ask whether the [scope:synod_faith_ruler.faith_name] shall be anathematised. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_reconcile: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to ask whether the [scope:synod_faith_ruler.faith_name] shall be received back into the Light. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_peace: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to proclaim the Peace of the Sun — ten years without war between coreligionists. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_tithe: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to ask for a tithe — a share of taxes for the Temple for twenty years. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_tyrant: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to cast [scope:synod_target] out of the Light. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_canonize: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to proclaim [scope:synod_target.name] a saint. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_crusade: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to summon the faithful to a holy campaign against the [scope:synod_faith_ruler.faith_name]. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_tithe_condemn: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to condemn [scope:synod_target] for the royal tithe. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_fields: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to bless the fields of the faithful. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    desc_duels: "Heralds of the Temple of the Sun carry the news: [scope:synod_head] calls a Synod to ban duels. In a year the rulers of the faith will vote. Your vassals wait to hear what their lord will say."
    a: "Declare: I am “for”"
    b: "Declare: I am “against”"
    c: Keep silent until the Synod
  synod.0001:
    t: The Synod at Reims
    desc: "The sun-priests have lit a thousand candles beneath the vaults of the Temple of the Sun. [scope:synod_head] opens the Synod, and the rulers of the faith await your word."
    desc_anathema: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] puts the question: shall the [scope:synod_faith_ruler.faith_name] be anathematised? If the Synod agrees, for twenty years its followers will be heretics — and holy war will be waged on them."
    desc_reconcile: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] puts the question: shall the [scope:synod_faith_ruler.faith_name] be received back into the Light? If the Synod agrees, the heresy will be lifted and holy wars against its followers will cease."
    desc_peace: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] proposes the Peace of the Sun: for ten years war between coreligionists will be a sin before the Temple. Holy war on heretics will remain permitted."
    desc_tithe: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] asks for a tithe: for twenty years the faithful will give the Temple a share of their taxes, and the Temple will pray for them. The treasury grows lighter; piety grows."
    desc_tyrant: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] denounces [scope:synod_target]: blood, lies and fear are their rule. Shall the whole Synod cast them out of the Light?"
    desc_canonize: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] recalls the righteous life of [scope:synod_target.name]. Shall the righteous one be proclaimed a saint? Glory to their house, and a place in the Temple for their relics."
    desc_crusade: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] calls the faithful to a holy campaign against the [scope:synod_faith_ruler.faith_name]. If the Synod agrees, for ten years the rulers of the faith will more readily raise swords against the heretics, and the piety of the faithful will grow."
    desc_tithe_condemn: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] denounces [scope:synod_target]: the crown takes the Temple's tithe. If the Synod agrees, [scope:synod_target] will have to restore the Temple's rights — and atone for the sin."
    desc_fields: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] proposes to bless the fields: for ten years the priests will bless the lands of the faithful, and they will prosper faster."
    desc_duels: "Beneath the vaults of the Temple of the Sun, [scope:synod_head] proposes to ban duels: “God's judgement” is pride, not faith. If the Synod agrees, for fifteen years a duel won will bring half the glory, and the challenger will sin."
    a: Vote “for”
    b: Vote “against”
    c: Abstain
