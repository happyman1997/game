focus_desc:
  focus_foreign_affairs: Negotiating with foreign courts hones your diplomatic talent.
  focus_majesty: You carry yourself like a true monarch, and tales of your majesty travel far.
  focus_family: You devote your time to your spouse, your children and your house.
  focus_strategy: You study the works of ancient generals and maps of campaigns.
  focus_chivalry: Tournaments, duels and knightly vows harden hand and spirit.
  focus_authority: You keep your vassals and your army in an iron grip.
  focus_wealth: Every coin counts — and the treasury grows.
  focus_domain: You personally tour your lands and oversee their management.
  focus_duty: You heed your vassals' needs and honour your obligations.
  focus_scheming: Whispers, secret letters and the right people in the right places.
  focus_seduction: Charm is a weapon too, and you wield it masterfully.
  focus_protection: Your informants make sure no one plots against you.
  focus_scholarship: Libraries and learned conversation are your passion.
  focus_theology: You spend your days in prayer and reading the Solar Tablets.
  focus_medicine: You study herbs and the works of ancient physicians.

