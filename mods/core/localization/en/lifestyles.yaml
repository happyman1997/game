perk_desc:
  regal_bearing: "Your glory weighs more: prestige levels raise your subjects' opinion half again as much. The sovereign listens to the people: petitioners and petitions are not cowed even under Unease, and hearing petitioners brings prestige."
  court_etiquette: "Feasts cost half as much and add 50 prestige. You enjoy feasts — they relieve stress."
  statesman: "Neighbours are readier to become your vassals: +10 acceptance per level of your prestige."
  august_majesty: "Unlocks the Royal Progress: your domain counties and vassals long remember your visit."
  fecund_line: "Each of your children adds 25 renown to your house."
  blood_ties: "Dynasty legacies cost a quarter less while you head the house. Kin think more warmly of you."
  wise_mentor: "Wards in your care learn half again as fast."
  head_of_house: "Your house gains 100 renown. Unlocks Gather the Kin: rulers of your house bring gifts."
  logistics: "Your armies lose half as many men to attrition in wild and scorched lands."
  take_alive: "After a won battle, 35% chance to capture an enemy knight — ransom him or keep him in your dungeon."
  military_drills: "Men-at-arms are stronger and cheaper to maintain."
  master_strategist: "Unlocks the Grand Muster: for two years levies, regiments and command are on the rise."
  stern_gaze: "Dread of you fades half as fast and grows faster."
  bloody_justice: "Executions inspire 15 more dread. You enjoy executions and imprisonment — they relieve stress."
  dungeon_dread: "Each prisoner in your dungeon inspires 1 dread a month (up to five), but only up to horror — terror is forged by executions. You hate releasing prisoners."
  iron_fist: "Unlocks Intimidate (tribute through fear; a refusal gives you a lawful reason to imprison) and the Public Execution."
  knightly_vow: "Refusing your duel challenge is a double disgrace. You enjoy challenging others to duels."
  trophy_taker: "When you win a duel you take the loser's weapon (he will claim it back). A won battle has a 20% chance to bring a trophy shield."
  sword_brotherhood: "Two more knight places, and your knights fight better."
  paragon_of_chivalry: "Unlocks the Quest for Glory: enter the lists yourself or send your best knight — for fame and a famed weapon."
  master_builder: "Buildings are cheaper, and each finished building raises its county's opinion by 10 (5 years)."
  thriving_lands: "Development grows faster and control over counties recovers sooner."
  court_splendor: "Commissions cost 40% less and craftsmen take on rarer work."
  royal_architect: "Unlocks the Great Work: once in a lifetime — a cathedral, a keep or a market in the capital, forever."
  efficient_rule: "You can hold one more county in your domain."
  tax_collectors: "Taxes are higher, and embezzlers on your council are caught more often."
  lombard_loan: "Unlocks the Changers' Loan: 300 gold at once, repaid at 2.5 a month for twelve years."
  great_administrator: "Unlocks Bribe: gold buys favour and pulls a vassal out of a faction. The honest and the just are offended."
  subtle_hand: "Every year you learn someone's secret in your realm."
  prying_eyes: "Every hook brings 0.5 gold a month. You enjoy blackmail."
  secret_trade: "Unlocks Sell a Secret: a neighbouring ruler learns a secret you know and pays in silver."
  master_schemer: "Unlocks Compel Service: a hook spent for service — gold, an alliance or a council seat."
  alluring: "Seduction succeeds 15% more often and goes half again as fast."
  pillow_talk: "A conquered lover gives away their secret and their liege's."
  heartbreaker: "Every lover you conquer is on your hook. You enjoy seduction."
  irresistible: "Unlocks the Pact of Hearts: a ruling lover allies with you, or makes peace if you are at war."
  avid_reader: "Every deed (a victory, a building, a duel…) brings 25 experience in your current lifestyle."
  natural_philosophy: "Development grows faster and lifestyle experience accrues sooner."
  polymath: "+1 to diplomacy, martial, stewardship and intrigue."
  renowned_scholar: "Unlocks the Magnum Opus: a book of famed rarity (illustrious at learning 20), renown for your house."
  devout_prayer: "Pilgrimage washes away all stress and has a 35% chance to bring a reliquary. You enjoy pilgrimages and almsgiving."
  inner_peace: "Stress grows slower, and piety levels raise coreligionists' opinion half again as much."
  relic_keeper: "A reliquary at court yields 60 piety a year and the veneration of coreligionist vassals. You hate executions."
  doctor_of_theology: "Unlocks the Miracle (healing yourself and your family, rejoicing counties) and the Call to Holy War."
  peacemaker: "Feuds between your vassals fade faster, and your mediation in other rulers' wars is accepted more readily (+25)."
  unifier: "Those you defeat bear no grudge (+25 opinion for 10 years) and are readier to become your vassals. Vassals send more troops."
  kin_council: "Kin are readier to ally with you (+25) and to marry into your line (+20). Your kin think more warmly of you."
  worthy_heir: "Your heir receives the Ancestor's Legacy: twenty years of prestige, vassals' respect and braver knights."
  ambush: "Your army is stronger on your own land, and a beaten enemy loses more in the rout."
  quartermaster: "Twice the loot, mercenaries at half price, and the army is cheaper to maintain."
  scourge: "Every battle won inspires dread (+3), and enemies surrender sooner. People hate you."
  menace: "Intimidation works better (+20 acceptance), and dread grows faster."
  champion: "Victories in duels bring twice the glory."
  warrior_king: "You fight in the ranks of your knights yourself — and share their risk. Your knights fight better."
  fortifier: "The fortresses of your domain are one level stronger."
  castellan: "Your capital holds out against sieges twice as long, and building is cheaper."
  reformer: "Realm laws cost half as much to change, do not offend vassals, and their discontent does not stand in the way of reform."
  golden_hand: "Your gifts are twice as effective, and rulers are readier to sign a trade pact with you (+20). Vassals pay a little more."
  gray_eminence: "An exposed scheme is blamed on one of your courtiers. Discord is sown more successfully — even without a spymaster."
  night_blade: "Your assassins work twice as fast, and assassins sent against you succeed half as often."
  courtly_love: "The court is charmed: they sing of your loves rather than whisper."
  honey_trap: "Schemes succeed more often: the road to secrets runs through the bedchamber."
  archivist: "Every year the archives give up a neighbour's secret, and claims in old charters are found almost certainly."
  engineer: "Siege engines and reckoning: enemy walls fall faster, your own building is cheaper."
  holy_warrior: "A battle won against an infidel or heretic pleases the Sun (+30 piety). You survive battles more often."
  sun_sword: "Holy war costs half as much, and your knights fight better."

