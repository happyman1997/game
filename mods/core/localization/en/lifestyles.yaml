trait_desc:
  diplomat: An acknowledged master of negotiation.
  family_patriarch: Head of a large and close-knit house.
  strategist: A commander who knows the worth of every step on the battlefield.
  tyrant: Feared more than loved — and content with that.
  paragon: His deeds are sung from Normandy to Norway.
  overseer: Knows how to raise and keep an army.
  architect: Builds quickly, cheaply and to last.
  administrator: Keeps vast holdings in good order.
  schemer: Weaves webs of intrigue while staying in the shadows.
  seducer: Few can resist these charms.
  theologian: A profound scholar of the Solar Tablets and the teachings of the Lightbearers.

