perk_tree_desc:
  august: "Rules by glory: feasts and progresses — or the peace he brings, and the defeated who come to kneel."
  family_first: "The house is the pillar: children add renown, legacies cost less, kin become allies; a mentor raises a worthy heir."
  strategist: "War of manoeuvre: baggage trains, captured knights, ambushes — or veterans, loot and mercenaries."
  tyranny: "Rules by fear: executions and victories that make enemies yield — or the dungeon and menace."
  chivalry: "Personal valour: duels and trophies — or a brotherhood of knights where the king fights in the line."
  architect: "Building and splendour — or strongholds that break sieges."
  administrator: "Gold as a weapon: taxes and reform — or loans, generous gifts and bribery."
  schemer: "Secrets and hooks — or other hands: a courtier to blame and a blade in the night."
  seducer: "Love as a weapon: pillow talk, lovers on a hook, a pact of hearts."
  scholarship: "Knowledge speeds everything: experience for every deed, secrets from the archives, siege engines."
  theology: "Piety and relics — or the sword of faith: victories over infidels and cheap holy war."
