  theology: Path of the Saint
perk_tree_desc:
  august: "Rules by glory: feasts, royal progresses, neighbours who ask to kneel."
  family_first: "The house is the pillar: children add renown, legacies cost less, kin bring gifts."
  strategist: "War of manoeuvre: no losses to attrition, captured knights for ransom, a grand muster."
  tyranny: "Rules by fear: executions and the dungeon terrify, vassals can be intimidated and fleeced."
  chivalry: "Personal valour: duels, trophies, a brotherhood of knights and a quest for glory."
  architect: "Building and splendour: counties cheer new walls, craftsmen seek your commissions."
  administrator: "Gold as a weapon: taxes, a Lombard loan and bribery."
  schemer: "Secrets and hooks: ears everywhere, silver for silence, secrets for sale."
  seducer: "Love as a weapon: pillow talk, lovers on a hook, a pact of hearts."
  scholarship: "Knowledge speeds everything: experience for every deed, paths open earlier."
  theology: "Piety and relics: pilgrimages, veneration of relics, miracles and holy war."

