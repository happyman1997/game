faction_desc:
  populist_faction: "Lands of a foreign faith or culture want a ruler of their own blood. They revolt only when strong; if they win, they break away under their own leader."
  peasant_faction: "Peasants worn down by wars, conquest and levies. Their discontent grows on its own; their host is weak, but every county they take gives them more men."
