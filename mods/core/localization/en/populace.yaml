ev:
  populace.0001:
    t: The Peasants Rise
    desc: "Smoke rises over the villages of your domain. [scope:faction_leader] has gathered the discontented — those ruined by wars and levies — and demands that their burden be eased. Refuse, and the peasants will take up their pitchforks."
    a: "Give in: lower taxes for ten years"
    b: "Disperse the rabble!"
    c: "Ride out to the rebels and talk"
  populace.0002:
    t: The Land Asks for Its Own Lord
    desc: "Lands that share neither your faith nor your blood refuse to serve you. [scope:faction_leader] speaks for them: they want a ruler of their own. Refuse, and there will be war."
    a: Let these lands go
    b: Never!
    c: Persuade them to stay under your hand
