secret_type:
  secret_murder: Murderer
  secret_lover: Secret Lover
  secret_embezzler: Embezzler
secret_type_desc:
  secret_murder: This person secretly murdered another. If the truth comes out, the victim's family will seek revenge and their liege will have grounds to imprison them.
  secret_lover: An affair outside marriage. Exposure shames both lovers and insults their spouses.
  secret_embezzler: Has been stealing from their liege's treasury. The liege may lawfully imprison the thief.
interaction:
  blackmail: Blackmail
  expose_secret: Expose Secret
  fabricate_hook: Fabricate Hook
interaction_desc:
  blackmail: "Threaten to reveal a secret you know. You gain a hook: a strong one for murder or embezzlement, a weak one for an affair."
  expose_secret: Make public the gravest secret of this person that you know.
  fabricate_hook: A scheme to gather compromising material and gain a weak hook on this person.
scheme:
  fabricate_hook: Fabricate Hook
council_task:
  find_secrets: Find Secrets
council_task_desc:
  find_secrets: The spymaster digs up the secrets of the nobles of your realm.
opinion_modifier:
  blackmailed_me: Blackmails me
  exposed_me: Exposed me
  exposed_murderer: Exposed murderer
  cheated_on_me: Cheated on me
  embezzled_from_me: Stole from me
msg:
  hook_fabricated: "The dirt has been gathered: you now have a hook on [scope:target]!"
  hook_failed: You failed to fabricate a hook.
ev:
  secret.0001:
    t: The Temptation of the Treasury
    desc: "Thousands of coins of [scope:liege]'s treasury pass through your hands. Who would notice if a few dozen stayed in your purse?"
    a: No one will know… (+40 gold, but it becomes your secret)
    b: No, I serve my lord honestly
