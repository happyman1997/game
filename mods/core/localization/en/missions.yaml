# Missions (missions.yaml) and journey events (events/missions.yaml)
mission:
  embassy: Embassy
  foreign_service: Service at a Foreign Court
  glory_wandering: Wandering for Glory
  pilgrimage: Pilgrimage
  preaching: Preaching
  recall: Recall from the Mission
mission_desc:
  embassy: "Send an envoy to a ruler's court. An eloquent envoy of a renowned lord wins goodwill; a clumsy one gives offence. At a foreign court the envoy may be offered gold for your secrets — or learn someone else's."
  foreign_service: "Two years of service at a renowned ruler's court: the young one learns what the host excels at and returns a friend of a foreign house. They may fall in love there — or into a quarrel."
  glory_wandering: "A year and a half on the roads: duels at foreign lists, bandits, beasts in the woods. The brave return with a name and a good blade — or wounded, or not at all."
  pilgrimage: "Pray at the shrines for you and your house: piety for you and the pilgrim, perhaps relics for the court. The road is long — one may fall ill."
  preaching: "A learned coreligionist goes to preach in a county of another faith. Success — the county converts; failure — the preacher is driven out, or killed."
  recall: "Bring the person home now: the mission ends without an outcome."
