ev:
  duel.0001:
    t: A Gauntlet at the Feast
    desc: "In the middle of the feast [scope:challenger.name] rises, cup in hand, and calls you a coward who hides behind other men's swords. A gauntlet falls on the table. The hall goes silent: everyone awaits your answer."
    a: Accept and fight yourself
    b: Send a champion
    c: Cut the straps of his armor at night
    d: Laugh it off — a ruler does not fight his vassals
  duel.0002:
    t: A Beast at the Walls
    desc: "Grim news from [scope:province.name]: a man-eating beast is killing cattle and people, and the peasants fear to go out into the fields. The elders beg their lord for protection."
    a: Hunt the beast yourself
    b: Send your best knight
    c: Offer hunters a bounty (50 gold)
    d: Let them deal with it
