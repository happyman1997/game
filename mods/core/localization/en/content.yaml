bookmark:
  b1066: The Norman Conquest
bookmark_desc:
  b1066: "1066. Edward the Confessor has died childless, and three men claim the English throne: Harold Godwinson, William of Normandy and Edgar Ætheling. Ireland is divided among petty kings, Wales is split, and the young King of France rules under the regency of the Count of Flanders."

