decision_desc:
  hold_feast: Invite your vassals to a feast. Prestige, goodwill and some relief from worries.
  go_hunting: Hunting relieves stress and brings glory — with some luck.
  go_on_pilgrimage: A long road to the holy places will strengthen your faith.
  give_alms: Generosity to the poor pleases God.
  seek_solitude: Withdraw from affairs to recover.
  commission_chronicle: Chroniclers will glorify your house for ages.
  emergency_taxes: Fill the treasury quickly — at the price of vassal discontent.
  prepare_invasion_of_england: Gather a fleet and knights from all over France to take what you were promised.
  unite_britannia: Proclaim yourself Emperor of Britannia.
  hire_mercenaries: A mercenary band strengthens your army for a year.

