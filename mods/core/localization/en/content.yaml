  choose_spouse_from_family: Whom do you offer in marriage?
  need_learning_8: Requires learning of at least 8
  need_health_3: Requires health of at least 3
  need_stress: Requires stress of at least 30
  need_two_british_kingdoms: You must hold two kingdoms of Britain
  alliance_requires_marriage: Requires a marriage between your families
  must_be_neighbor: Their lands must border yours
  invasion_tooltip: "Knights from all over France flock to your banners: +7500 soldiers for 4 years."
