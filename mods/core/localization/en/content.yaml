casus_belli:
  claim: Claim on a Title
  de_jure: De Jure Claim
  independence: War of Independence
  county_conquest: Raiding Conquest
  holy_war: Holy War
casus_belli_desc:
  claim: Fight for a title you have a claim on. Victory grants the title and its lands.
  de_jure: Annex counties that rightfully belong to your titles.
  independence: Throw off the rule of your liege.
  county_conquest: Take a neighbouring county by the sword.
  holy_war: Take lands from the infidels.

