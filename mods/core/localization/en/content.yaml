interaction_desc:
  arrange_marriage: Marry off a member of your family or court. Marrying into a ruling house creates an alliance.
  send_gift: A gift improves the recipient's opinion of you.
  propose_alliance: Allies join your wars. Requires a marriage tie.
  offer_vassalization: Offer a ruler to become your vassal.
  grant_title: Give a county or duchy to a vassal or courtier.
  revoke_title: Take a title away from a vassal. Tyranny!
  release_vassal: Let a vassal go — they become independent.
  invite_to_court: Invite a character to move to your court.
  befriend: Start a scheme to become friends.
  sway: Start a scheme to improve the character's opinion of you.
  seduce: Start a seduction scheme.
  murder: Plot a murder. Being discovered has dire consequences.
  fabricate_claim: Your scribes will "find" documents proving your rights.

