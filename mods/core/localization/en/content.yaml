succession_law:
  partition: Partition
  primogeniture: Primogeniture
  tanistry: Tanistry
  equal_primogeniture: Equal Primogeniture
succession_law_desc:
  partition: Titles are split between children; the eldest gets the primary one. Realms fragment.
  primogeniture: The eldest child inherits everything. The realm stays whole.
  tanistry: The eldest adult member of the dynasty inherits.
  equal_primogeniture: The eldest child inherits everything regardless of gender.

