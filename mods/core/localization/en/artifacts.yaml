artifact:
  edward_crown: Crown of Edward the Confessor
  joyeuse: Joyeuse, Sword of Charlemagne
  landwaster: Banner “Landwaster”
  papal_banner: Banner of Saint Peter
  stone_of_destiny: Stone of Destiny
  bell_of_patrick: Bell of Saint Patrick
artifact_desc:
  edward_crown: "The crown of England's saintly king. Harold was crowned with it at Westminster — and whoever wears it may call themselves the rightful king."
  joyeuse: "Charlemagne's sword, said to change its color thirty times a day. The kings of the Franks are girded with it at their coronation."
  landwaster: "A raven on white silk. The saga says Harald Hardrada never lost a battle under this banner."
  papal_banner: "A consecrated banner sent by Pope Alexander to the Duke of Normandy. With it, the war for the English throne is a holy cause."
  stone_of_destiny: "The sandstone block of Scone on which the kings of Scotland are crowned. Whoever sits upon it is king."
  bell_of_patrick: "Saint Patrick's iron bell in a golden shrine. Its ringing, they say, drove the snakes and demons out of Ireland."

