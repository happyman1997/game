interaction:
  gift_artifact: Give an Item
  demand_artifact: Demand an Item
interaction_desc:
  gift_artifact: "Give an item from your inventory. The rarer it is, the greater the gratitude."
  demand_artifact: "Demand back an item you have a claim on: it was taken from you or from your dynasty. A refusal leaves a grudge."

ev:
  artifact.0001:
    t: A Dealer in Curiosities
    desc: "A merchant from distant lands has come to court. His chests are full of wonders: jeweled rings, amulets, goblets of chased silver, books in gilded covers. Everything — for those with taste and gold to spare."
    a: Buy a ring or an amulet (−100 gold)
    b: Buy a curiosity for the court (−160 gold)
    c: Send the merchant away
  artifact.0002:
    t: A Vassal's Gift
    desc: "[scope:vassal] asks leave to present you with a gift — a token of loyalty and love. Servants carry in a bundle tied with a scarlet ribbon."
    a: Accept it gratefully
    b: Give a gift in return (−60 gold)
  artifact.0003:
    t: A Worn Treasure
    desc: "“[scope:artifact]” has served you well, but the years take their toll: the metal is worn, the seams are parting. A little more, and it will fall apart in your hands."
    a: Summon the finest artisan (−40 gold)
    b: Let the court smith mend it
    c: Let it serve as long as it can
  artifact.0004:
    t: A Neighbor's Envy
    desc: "Envoys of [scope:buyer] have brought rich gifts and a request: their lord wishes to have “[scope:artifact]” and offers two hundred and fifty gold for it."
    a: Sell it for 250 gold
    b: Give it away — and gain a friend
    c: Refuse
