ev:
  stezi.0001:
    t: Quest for Glory
    desc: "Heralds sound their trumpets; knights from three kingdoms fill the lists of a foreign court. To the victor — a weapon songs will be made of; to the loser — shame and a physician. Ride yourself or send the best of your men?"
    a: Enter the lists myself
    b: Send my best knight
    c: Feast and listen to the songs
  stezi.0002:
    t: The Great Work
    desc: "The masons are gathered, the stone ordered, the treasury open. What shall rise in the capital, to be remembered when you are only a name in a chronicle?"
    a: A cathedral — to the glory of the Sun
    b: A keep — to the terror of enemies
    c: A market — to the joy of merchants
  stezi.0003:
    t: A Debt Called In
    desc: "[scope:recipient] knows what you know. The time has come to pay — choose the coin."
    a: Let them pay in gold
    b: Let them become an ally
    c: Let them serve on my council
