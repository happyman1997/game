# Childhood, upbringing, regency and dynasty.
trait:
  rowdy: Rowdy
  charming: Charming
  curious: Curious
  pensive: Pensive
  bossy: Bossy
trait_desc:
  rowdy: "A child who never sits still: fights the pages and climbs the walls. Aptitude for martial; grows up brave — or a brawler."
  charming: "This child's smile disarms even the guards. Aptitude for diplomacy; grows up gregarious and generous — or fickle."
  curious: "A child who asks questions even the monks cannot answer. Aptitude for learning; grows up diligent — or cynical."
  pensive: "A quiet child who sees and remembers everything. Aptitude for intrigue; grows up calm — or paranoid."
  bossy: "A child who orders even their elders about. Aptitude for stewardship; grows up ambitious and just — or arrogant."

