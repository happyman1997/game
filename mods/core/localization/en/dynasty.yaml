  choose_guardian: Assign Guardian
  appoint_regent: Appoint as Regent
  disinherit: Disinherit
  restore_inheritance: Restore Inheritance
  demand_family_tribute: Demand Dynasty Tribute
  honor_kin: Honor a Kinsman
interaction_desc:
  choose_guardian: "The guardian teaches the child their craft: the higher their skill in the education focus, the better the education. The child may also pick up the guardian's personality."
  appoint_regent: "While you are a child, a regent rules the realm. Their skills shape vassal opinion, taxes and levies — but an ambitious regent may dip into the treasury."
  disinherit: "The dynasty head strikes a kinsman from every line of succession. They will not forgive it."
  restore_inheritance: "The dynasty head restores a kinsman's rights as an heir."
  demand_family_tribute: "The dynasty head takes a third of a ruling kinsman's treasury (at most 150) for the needs of the dynasty."
  honor_kin: "The dynasty head honors a kinsman: they gain prestige and are grateful."

decision:
  found_cadet_house: Found a Cadet Branch
decision_desc:
  found_cadet_house: "You are not the senior of your dynasty, but noble enough to found a house of your own, with its own name and coat of arms. You and your descendants become a cadet branch; renown and legacies stay shared with the dynasty."

