ev:
  upbringing.0001:
    t: A Ward's Progress
    desc: "[scope:child]'s guardian reports: the child tries hard, but could do more. The children of the court are drawn to whoever takes the time with them."
    a: Praise them
    b: Hire tutors (−40 gold)
    c: Teach the child myself
  upbringing.0002:
    t: A Harsh Guardian
    desc: "[scope:child] runs to you in tears: the guardian has struck them again. The guardian insists that strictness is the best teacher."
    a: Change the guardian
    b: Strictness builds character
  upbringing.0003:
    t: A Childish Prank
    desc: "[scope:child] has caused an uproar at court: a terrified hen in the bishop's chambers and a broken jug of wine. The court waits for your word."
    a: Punish them
    b: Laugh along with everyone
  regency.0001:
    t: The End of the Regency
    desc: "You have come of age, and [scope:regent] lays down the regency. All these years the realm was ruled in your name — now you rule it yourself. The treasurer, however, asks you to look at the accounts."
    a: Thank the regent (−50 gold)
    b: Demand an account of the treasury
    c: Bid farewell with honors
