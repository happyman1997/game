# Dread: tiers, who fears you, petitioners from the counties, the Sadistic trait.
dread_tier:
  calm: Calm
  unease: Unease
  fear: Fear
  horror: Horror
  terror: Terror
dread_tier_desc:
  calm: "No one fears you. Complaints and petitions flow freely; factions gather without a backward glance."
  unease: "Voices drop at court. The obedient join factions but do not start them; complaints come half as often. Informers appear."
  fear: "Taxes and levies are gathered without evasion, schemes against you stall, complaints come a quarter as often. Courtiers with a conscience leave, and vassals send gifts for no reason."
  horror: "No complaints at all. Enemies make peace sooner and weak garrisons surrender, but neighbours will not marry into your house or ally with you. You sleep badly — unless you are callous, paranoid or a sadist."
  terror: "Factions fall apart — only the defiant remain — and peasants dare not revolt. But villages empty, the Temple condemns you, sleepless nights torment you and the brave sharpen their knives. They call you the Terrible."

