skill_archetype_desc:
  gray_eminence: "Diplomacy and intrigue. Smiles at everyone and sets them against each other. Sows discord even without a spymaster, and better."
  warlord: "Diplomacy and martial. Men follow such a leader: vassals send more troops and love them."
  merchant_prince: "Diplomacy and stewardship. Trade is war, only more profitable. Can conclude trade pacts with neighbours."
  arbiter: "Diplomacy and learning. Their word settles disputes: respect, prestige and piety. Has their own option in vassal disputes."
  courtly_knight: "Diplomacy and prowess. Troubadours, tournaments and fair ladies: knights serve them gladly."
  quartermaster: "Martial and stewardship. A well-fed army is a fierce army: cheaper armies, larger levies."
  ambush_master: "Martial and intrigue. The enemy learns of their army when it is too late."
  siege_engineer: "Martial and learning. Knows where a wall is weak and how to build their own stronger."
  warrior_king: "Martial and prowess. Fights in the ranks of their own knights, and takes the same risks."
  shadow_treasurer: "Stewardship and intrigue. Knows where the vassals hide their silver."
  reformer: "Stewardship and learning. Realm laws change at half the cost; the land develops faster."
  castellan: "Stewardship and prowess. Builds strong and cheap, keeps the men in line."
  archivist: "Intrigue and learning. Old charters always hold a right to a neighbouring land."
  night_blade: "Intrigue and prowess. Their own assassin and their own bodyguard."
  holy_warrior: "Learning and prowess. Prayer and sword: piety grows, knights are steadier, and they rarely fall."
  philosopher_king: "Legend: diplomacy, stewardship and learning. A wise ruler of the kind chroniclers write about."
  scourge: "Legend: martial, intrigue and prowess. Their victories inspire terror, and people hate them."
  hero_of_songs: "Legend: diplomacy, martial and prowess. Every court sings of them."
