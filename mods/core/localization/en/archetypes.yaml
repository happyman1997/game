interaction_desc:
  mediate_peace: "The arbiter offers a ruler peace: if they agree, all of their wars end in white peace, and the arbiter gains glory."
  trade_pact: "Merchants of both realms travel freely: for five years both rulers collect more taxes."
decision:
  search_archives: Search the Archives
  golden_age: Proclaim a Golden Age
decision_desc:
  golden_age: "Once in a lifetime, a philosopher king may proclaim a Golden Age: for ten years the land develops faster, the court is calm, the vassals content."
  search_archives: "The archivist digs through old charters and finds a right to one of the neighbouring counties."
msg:
  hero_legacy: "You inherit not only titles but the glory of a hero of songs."
  archives_claim: "An old charter turned up in the archives: you now have a claim on [scope:claim_target]!"
