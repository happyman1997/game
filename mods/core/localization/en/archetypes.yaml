skill_archetype_desc:
  gray_eminence: "Diplomacy and intrigue. By other hands: when their scheme is discovered, a courtier takes the blame. Sows discord even without a spymaster, and better."
  warlord: "Diplomacy and martial. Those they defeat bear no grudge and bend the knee more readily; their own vassals send more troops."
  merchant_prince: "Diplomacy and stewardship. Concludes trade pacts with neighbours, and their gifts work twice as well."
  arbiter: "Diplomacy and learning. Mediates other rulers' wars (and gains glory for it); their word settles disputes."
  courtly_knight: "Diplomacy and prowess. Two more knights in service, and duel victories bring twice the glory."
  quartermaster: "Martial and stewardship. Double the loot, mercenaries at half price, cheaper armies."
  ambush_master: "Martial and intrigue. Their army is stronger on home ground, and a routed enemy loses twice as many men."
  siege_engineer: "Martial and learning. Fortresses in their domain are a level stronger, enemy walls fall faster."
  warrior_king: "Martial and prowess. Fights in the ranks of their own knights, and takes the same risks."
  shadow_treasurer: "Stewardship and intrigue. Everyone they hold a hook on pays silver for their silence."
  reformer: "Stewardship and learning. Realm laws change at half the cost, and disgruntled vassals cannot stop reforms."
  castellan: "Stewardship and prowess. Their capital holds out twice as long under siege; builds strong and cheap."
  archivist: "Intrigue and learning. Old charters always hold a right to a neighbouring land, and each year — someone's secret."
  night_blade: "Intrigue and prowess. Their assassins work twice as fast, and no assassin can kill them."
  holy_warrior: "Learning and prowess. Victories over infidels please God; holy wars cost half as much."
  philosopher_king: "Legend: diplomacy, stewardship and learning. Once in a lifetime may proclaim a Golden Age."
  scourge: "Legend: martial, intrigue and prowess. Their victories inspire terror, enemies surrender sooner — and people hate them."
  hero_of_songs: "Legend: diplomacy, martial and prowess. Every court sings of them, and their heir inherits the Hero's Legacy."
