realm_law_desc:
  crown_authority_0: Вассалы почти независимы. Они довольны, но платят меньше и дают меньше войск.
  crown_authority_1: Обычный порядок. Правитель может отзывать титулы, но это считается тиранией.
  crown_authority_2: Вассалы платят больше и шлют больше войск, хотя и ворчат.
  crown_authority_3: Слово правителя — закон. Отзыв титулов не считается тиранией.
  tax_law_0: Графства платят меньше, зато довольнее и быстрее богатеют.
  tax_law_1: Обычный порядок податей.
  tax_law_2: Больше золота с домена — и злее графства. Нельзя вводить, если недовольных графств уже два и больше.
  military_service_0: "Вассалы откупаются от службы золотом: войск меньше, налогов с вассалов больше. Нельзя вводить во время войны."
  military_service_1: Обычный порядок службы.
  military_service_2: "Под знамёна идут все, кто может держать оружие: войск больше, но графства и вассалы недовольны."
  church_law_0: Храм не платит податей и судит своих сам. Меньше налогов, больше благочестия, глава веры доволен.
  church_law_1: "Обычный порядок: корона и Храм не тянут одеяло на себя."
  church_law_2: Корона забирает часть церковной десятины. Больше налогов, меньше благочестия, глава веры недоволен.
  fief_law_0: Наследники вассалов вступают в лен свободно. Вассалы этим довольны.
  fief_law_1: Наследник вассала платит сюзерену рельеф — годовой доход, но не больше половины казны.
  fief_law_2: "Рельеф — и сверх того: лен графа, умершего без детей, возвращается сюзерену. Вассалы недовольны. Нужна власть короны не ниже «Высокой»."
