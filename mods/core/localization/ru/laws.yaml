law_group:
  crown_authority: Власть короны
law_group_desc:
  crown_authority: Насколько сильна власть правителя над вассалами. Чем она выше, тем больше налогов и войск дают вассалы — и тем меньше им это нравится.
realm_law:
  crown_authority_0: Автономия вассалов
  crown_authority_1: Ограниченная власть
  crown_authority_2: Высокая власть
  crown_authority_3: Абсолютная власть
realm_law_desc:
  crown_authority_0: Вассалы почти независимы. Они довольны, но платят меньше и дают меньше войск.
  crown_authority_1: Обычный порядок. Правитель может отзывать титулы, но это считается тиранией.
  crown_authority_2: Вассалы платят больше и шлют больше войск, хотя и ворчат.
  crown_authority_3: Слово правителя — закон. Отзыв титулов не считается тиранией.
stat:
  vassal_tax_mult: Налоги с вассалов
  vassal_levy_mult: Войска вассалов
ui:
  law_needs_loyal_vassals: Слишком много недовольных вассалов
  revoke_needs_authority: Нужна власть короны не ниже «Ограниченной» или законный повод
