law_group_desc:
  crown_authority: Насколько сильна власть правителя над вассалами. Чем она выше, тем больше налогов и войск дают вассалы — и тем меньше им это нравится.
  tax_law: Сколько берут с крестьян домена. Тяжкие подати дают больше золота, но злят графства и тормозят их развитие.
  military_service: "Чем служат вассалы и крестьяне: золотом вместо воинов или всеобщим сбором."
  church_law: "Права Храма в державе: вольности дают благочестие и милость главы веры, королевская десятина — золото и гнев Храма."
  fief_law: "Что получает сюзерен, когда умирает вассал: ничего, рельеф с наследника или сам лен, если наследника нет."
