bookmark:
  b1066: Норманнское завоевание
bookmark_desc:
  b1066: "1066 год. Эдуард Исповедник умер бездетным, и на английский трон претендуют сразу трое: Гарольд Годвинсон, Вильгельм Нормандский и норвежский король Харальд Суровый, к которому бежал мятежный брат Гарольда Тостиг. Свен Эстридсен в Дании тоже помнит о наследии Кнуда Великого, в Швеции христиане и язычники делят страну, а юный король Франции правит под опекой графа Фландрского."

