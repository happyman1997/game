  brave: Этот персонаж не отступает перед опасностью.
  craven: Опасность заставляет этого персонажа искать спасения в бегстве.
  ambitious: "Ему всегда мало: больше земель, больше власти, больше славы."
  genius: Ум этого персонажа поражает всех вокруг.
  ill: Персонаж страдает от недуга, который может пройти — или убить.
