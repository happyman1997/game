skill:
  diplomacy: Дипломатия
  martial: Военное дело
  stewardship: Управление
  intrigue: Интриги
  learning: Учёность
  prowess: Личная доблесть
skill_desc:
  diplomacy: "Люди. Правителю — любовь вассалов, тише фракции, союзники охотнее идут на войну, враг раньше соглашается на мир, а мятежников можно уговорить разойтись. Канцлеру — его задачи."
  martial: "Война. Полководцу — сила армии, быстрый марш, жёсткое преследование и порядок при отходе. Правителю — быстрые осады и муштра отрядов. Маршалу — его задачи."
  stewardship: "Казна. Правителю — налоги, лимит домена, рост развития, дешёвые стройки и войска, добыча с осад, ревизия: казнокрады в совете попадаются. Казначею — его задачи."
  intrigue: "Тайны. Защита от интриг и сила своих, тайные ходы (побег из темницы и из павшей столицы), перевербовка раскрытых заговорщиков, слухи о соперниках. Тайному советнику — его задачи."
  learning: "Вера и знание. Благочестие, рост развития, учение образа жизни, немного здоровья. Духовнику — его задачи, фабрикация претензий."
  prowess: "Личная сила. Поединки, рыцари в войске, личный пример полководца (и риск раны), выживание в бою, страх перед правителем — дерзкие вассалы уважают силу."

