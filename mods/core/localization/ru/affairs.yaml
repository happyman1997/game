intervention_desc:
  send_workers: "Открытая помощь: участок пойдёт быстрее, хозяин работ запомнит добром."
  stir_forest_folk: "Тайно подбить охотников, углежогов и бортников против чужой вырубки: работы встанут, а в лесу могут завестись разбойники. Раскроют — хозяин не простит."
  spoil_works: "Тайно сломать запруды и увести волов: работы затянутся. Раскроют — хозяин не простит."
  send_masons: "Открытая помощь: стройка пойдёт быстрее, хозяин запомнит добром."
  fire_the_works: "Тайно поджечь леса чужой стройки: работы отойдут назад. Раскроют — хозяин не простит."
  honor_envoy: "Посол едет к вам: принять его с почётом — его дело пойдёт лучше, а его господин запомнит."
  escort_traveler: "Путник идёт вашими землями: дать ему охрану — шайки ему не страшны."
  detain_traveler: "Задержать чужого путника на заставе: его дело затянется и пойдёт хуже. Такое трудно скрыть."
  ambush_traveler: "Нанять людей и устроить засаду на чужого посланца: проиграет схватку — его дело пойдёт хуже, а то и не вернётся."
