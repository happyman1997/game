# Путь Пепла и Путь Света.
trait:
  ash_marked: Меченый пеплом
  ash_pact: Договор с Князем Пепла
  ash_iron_ward: Не берёт железо
  ash_voice: Голос повелителя
  ash_gold: Золото из пепла
  ash_viceroy: Наместник Пепла
  ash_heretic: Еретик
  living_saint: Живой святой
trait_desc:
  ash_marked: "Он ответил на шёпот из пепла. Жестокость больше не тяготит, страх перед ним растёт быстрее, а молитвы даются тяжелее."
  ash_pact: "Скреплено пеплом и кровью: Князь Пепла дал свой дар. Глаза тлеют, как угли, — но видят это лишь посвящённые."
  ash_iron_ward: "Дар договора: клинок соскальзывает, стрела проходит мимо."
  ash_voice: "Дар договора: перед этим голосом нет дерзких — гнутся и храбрецы, и кровники."
  ash_gold: "Дар договора: каждая казнь оборачивается золотом из пепла."
  ash_viceroy: "Князь Пепла поставил его своим наместником на земле. Он не стареет, страх перед ним не спадает ниже ужаса, войско врага тает перед боем, а Солнечный венец жжёт его вдвойне. Вера Солнечного Императора поднимается против него."
  ash_heretic: "Раскрыт договор с Князем Пепла. Единоверцы и Стражи Пепла вправе идти на него священной войной."
  living_saint: "Дал обет Солнцу и держит его. Видит души и скрытые печати, творит сильные чудеса, отмаливает чужие души и ведёт крестовый поход Света. Тяжкий грех — и Свет уйдёт."

secret_type:
  secret_ash_pact: Договор с Князем Пепла
secret_type_desc:
  secret_ash_pact: "Этот человек ответил Князю Пепла. Если правда откроется — он еретик, и на него пойдут священной войной."

karma_deed:
  resisted_prince: Отвернулся от шёпота
  answered_prince: Ответил Князю Пепла
  pact: Договор с Князем Пепла
  refused_pact: Отказался от договора
  viceroy: Стал Наместником Пепла
  vow: Обет Солнцу
  humility: Смирение
  soul_saved: Отмоленная душа
  crusade: Крестовый поход Света
  miracle: Чудо

interaction:
  pray_for_soul: Отмолить душу
interaction_desc:
  pray_for_soul: "Живой святой молится за душу, на которую лёг пепел Князя: печати ломаются назад, и пепел сходит. Наместника Пепла так не спасти — разве что чудом."

casus_belli:
  light_crusade: Крестовый поход Света
casus_belli_desc:
  light_crusade: "Живой святой ведёт верных на еретика, где бы тот ни был, — и на державу, что его укрывает. Победа отдаёт столицу еретика, а Наместника Пепла — на костёр."
cb:
  light_crusade:
    war_name: "Крестовый поход Света на [scope:defender]"

opinion_modifier:
  viceroy_of_ash: Наместник Пепла

msg:
  viceroy_saved: "Святой отмолил Наместника Пепла: тлеющие глаза погасли."
  viceroy_resists: "Князь Пепла не отпустил своего наместника. Молитва разбилась о пепел."
  ash_spawn: "В ночь, когда погасли все свечи, правитель ушёл в пепел порождением Князя. Власть переходит к наследнику."
  ash_path_left: "У края Пепелища вы бросили в пепел свою метку. Князь отпустил вас — пока."

ev:
  ashpath.0001:
    t: Шёпот
    desc: "Ночью в очаге не гаснет один уголёк. Он смотрит на вас — и шепчет. Голос тёплый, как пепел, и знает ваше имя. «Ты уже мой, — говорит он. — Осталось только ответить»."
    a: Отвернуться
    b: Ответить
  ashpath.0002:
    t: Договор
    desc: "Князь Пепла пришёл сам — тенью в углу зала, где не горят свечи. «Я дам тебе дар. Выбирай. Цена — лишь тайна между нами»."
    a: Пусть меня не берёт железо
    b: Пусть передо мной гнутся все
    c: Пусть казни приносят золото
    d: Нет. Метку — в пепел
  ashpath.0003:
    t: Ночь, когда погасли все свечи
    desc: "В эту ночь погасли все свечи в замке разом. Пепел поднялся с пола и встал вокруг вас стеной. «Пора, — говорит Князь. — Шагни ко мне. Я сделаю тебя своим наместником — если выдержишь»."
    a: Шагнуть в пепел
    b: Отступить, пока не поздно
  ashpath.0004:
    t: Наместник Пепла
    desc: "Вы вышли из пепла другим. Кожа серая, как зола, в глазах тлеют угли, и время больше не властно над вами. По всей Вере Солнечного Императора бьют в набат."
    a: Да будет пепел
  lightpath.0001:
    t: Обет Солнцу
    desc: "На рассвете луч солнца лёг на алтарь и не уходил, пока вы молились. Жрецы-светочи пали ниц. Император-Солнце зовёт вас дать обет — и стать его светом на земле."
    a: Дать обет
    b: Я недостоин
  lightpath.0002:
    t: Свет ушёл
    desc: "Утром вы поняли: Свет ушёл. Молитва звучит пусто, а люди больше не тянутся коснуться вашего плаща."
    a: Я сам виноват
