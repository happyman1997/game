building_desc:
  armory: "Склады копий, щитов и шлемов: ополчение вооружено лучше, а отрядов можно держать больше."
  gallows: "Казни и порка при всём народе. Жалоб меньше, страха больше — но графство владельца не любит."
  great_hall: "Пиршественный зал, где владелец принимает вассалов. Вассалам — почёт, владельцу — слава."
  donjon: "Последняя и самая высокая башня крепости. Стоит на стенах; столица владельца держится в осаде дольше."
  caravanserai: "Заезжие купцы везут товар и слухи. Раз в год, чем сильнее посад, тем вероятнее, что владелец узнает чью-то тайну."
  bathhouse: "Пар и веники: владелец крепче здоровьем и спокойнее."
  mint: "Своя монета державы. Казна получает доход, а вассалы платят подати исправнее. Одна на державу."
  bell_tower: "Колокол созывает и на молитву, и в ополчение."
  sun_school: "Жрецы-светочи учат детей двора и их наставников. Воспитанники умнеют быстрее."
  vineyard: "Вино для стола и на продажу: подати и немного славы владельцу."
  orchards: "Яблони и груши вокруг сёл: графство растёт и довольно."
  sheepfold: "Овцы на холмах и равнинах: шерсть — серебро."
  tannery: "Кожи для доспехов и сбруи: подати и чуть крепче отряды."
  weavers: "Сукно и полотно на продажу."
  siege_workshop: "Тараны и метательные машины: крепости врагов падают быстрее."
  fishery: "Рыба для городов и постов: подати, рост и сытость."
  customs: "Пошлины с чужих кораблей. Казне хорошо, горожанам не очень."
  longhouse: "Длинный дом северной дружины, которая живёт набегами: добыча с каждой взятой крепости больше."
  polders: "Земля, отвоёванная у моря и болот дамбами и канавами. Только на болотах."
  mine: "Руда и серебро холмов и гор: подати и доход раз в год по силе слободы."
  ash_watch: "Застава у края Пепелища. Войско владельца теряет в пепле меньше людей; дозорные молятся за него."
  wolf_shrine: "Клыки и кровь на алтаре Зимнего Волка. Дружина свирепее, а соседи боятся."
  ancestor_hall: "Память рода в камне: наследие династии дешевле, а род славнее."
  east_cloister: "Обитель Восточного обряда. Еретики держатся друг за друга."
  sun_cathedral: "Величайший храм Солнца в мире. Благочестие и слава владельцу, уважение всех вокруг. Единственный в мире; строят короли Солнечной веры."
  university: "Учёные со всей округи: правитель и его двор умнеют, дети учатся быстрее. Один на державу."
  great_market: "Ярмарка, на которую съезжается полмира: большой доход каждый год, а торговцы редкостями заезжают постоянно. Единственный в мире."
  border_wall: "Цепь стен и застав по всему рубежу: все крепости домена прочнее, столица держится дольше, походы легче. Один на державу."
  hall_of_justice: "Суд владельца для всей державы. Фракции копят недовольство медленнее, вассалы спокойнее. Одна на державу."
  royal_stables: "Лучшие кони державы: войско быстрее, рыцари сильнее. Одни на державу."
  great_forge: "Горн, что не гаснет: отряды сильнее, содержание дешевле, заказы мастерам лучше. Одна на державу."
  great_lighthouse: "Огонь, видный за день пути под парусом. Слава владельцу и рост городу. Единственный в мире."
  walls: "Камень вместо частокола: крепость держится в осаде вдвое дольше."
  barracks: "Здесь живёт и учится ополчение графства."
  training_grounds: "Поле для конных сшибок. Полководцы и рыцари владельца бьются лучше."
  dungeon: "Яма под башней, откуда не выходят. Каждый узник в темнице владельца множит страх перед ним — но графство ропщет."
  watchtower: "Дозор видит войско за день пути. Графство крепче, а столица владельца дольше держится в осаде."
  secret_passage: "Лаз под стенами, о котором знают трое. Владелец может уйти из павшей столицы и бежать из чужой темницы."
  market: "Ряды лавок и мера для зерна. Главный доход посада."
  guild_hall: "Цеха договариваются о ценах и строят город. Подати растут, графство — тоже."
  fairground: "Раз в год сюда съезжаются купцы со всей округи: казна получает долю торга, и чем сильнее посад — тем больше. С купцами порой приходит торговец редкостями."
  money_changer: "Менялы и ростовщики. Стройки и заказы мастерам дешевле, а в трудный год у менял можно взять ссуду (решение «Заём у менял»)."
  monastery: "Братия молится за владельца и учит грамоте."
  cathedral: "Соборный храм Солнца. Благочестие и слава владельцу."
  hospice: "Приют для странников, сирот и увечных. Графство благодарно, а на душу владельца каждый год ложится Свет."
  scriptorium: "Книжники переписывают летописи и учат детей двора. Дети воспитанников учатся быстрее, правитель — тоже."
  reliquary: "Рака с мощами, к которой идут паломники: благочестие и подаяния раз в год. Если в сокровищнице владельца есть реликварий, паломников втрое больше."
  farms: "Хутора по округе: больше хлеба — больше податей и людей."
  hunting_grounds: "Заповедный лес для охоты. Владелец крепче и спокойнее."
  granary: "Запас хлеба на голодный год. Сытое графство быстрее покоряется власти и реже шлёт ходоков."
  stud_farm: "Табуны боевых коней. Войска владельца ходят быстрее и добивают бегущих."
  supply_depot: "Возы, бочки, сухари. В походах по Пепелищу и диким землям войско теряет меньше людей."
  forge: "Кузни куют броню и клинки: отряды сильнее, содержание дешевле."
  masons: "Каменщики и плотники. Все стройки домена идут быстрее, а его крепости прочнее."
  goldsmith: "Мастерская ювелиров. Заказы мастерам дешевле, а вещи выходят редкостнее."
  docks: "Причалы для купеческих кораблей. Подати и пошлины с кораблей раз в год."
  salt_works: "Морская соль — серебро побережья."
  shipyard: "Здесь строят корабли: войско переправляется морем, походы и осады быстрее."
  lighthouse: "Огонь на мысу ведёт корабли в гавань. Город растёт, слава владельца — тоже."
msg:
  fair_income: "Ярмарка в [scope:province.name] собрала купцов со всей округи: в казну — [scope:fair_gold] золотых."
  pilgrims: "Паломники к раке в [scope:province.name] оставили [scope:pilgrim_gold] золотых подаяний."
