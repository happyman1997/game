district_desc:
  citadel: "Укреплённое сердце графства: стены, казармы, темница. Сильнее на рубеже с чужой державой и в горах."
  market: "Лавки, склады и торг. Каждый соседний посад, с хозяином которого нет войны, — торговый путь и прибавка силы."
  temple_quarter: "Храм и всё, что при нём: монахи, книжники, призрение. Слабеет вдвое, если графство чужой веры."
  fields: "Пашни, мельницы, конюшни. Лучше всего родят пашни и равнины, хуже — холмы и болота."
  crafts: "Кузни и артели. Руда в холмах и горах; цеха домена поддерживают друг друга."
  harbor: "Причалы и склады у моря. Пристани домена — одна морская торговля, соседние посады везут к ним товар."
