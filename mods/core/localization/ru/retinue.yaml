mercenary_company_desc:
  grey_lances: Лёгкая конница с дальних пастбищ; берут дорого, но приходят первыми.
  heather_bows: Стрелки с вересковых холмов — бьют издали и не любят сечи.
  rusted_oath: Тяжёлая пехота, связанная старой клятвой; ни разу не бежала с поля.
  ash_wolves: Сброд с пепелища; дерутся зло и не берут пленных.
  stone_shields: Копейщики, о чей строй разбивается любая конница.
  crimson_hooves: Тяжёлые всадники в багровых попонах — дорогие и страшные.
  sons_of_the_waste: Изгнанники с пустошей; дёшевы и неопытны, зато их много.
  lantern_company: Старая рота с фонарём на знамени; ходят ночью и держат слово.
