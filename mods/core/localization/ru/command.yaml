trait:
  forest_leader: Лесной вождь
  hill_leader: Горный вождь
  marsh_leader: Знаток болот
  plains_leader: Вождь равнин
  shock_master: Мастер натиска
  volley_master: Мастер залпов
  shield_wall: Стена щитов
  unstoppable: Неудержимый
  hound_of_war: Гонитель
  rearguard: Хранитель отхода
  inspirer: Вдохновитель
  cautious_strategist: Осторожный стратег
  reckless_brawler: Безрассудный рубака
  siege_master: Мастер осад
trait_desc:
  forest_leader: Знает, как вести войско меж деревьев: засады, узкие тропы, бой без строя.
  hill_leader: Держит высоты и бьёт сверху; в горах его войско как дома.
  marsh_leader: Проводит войско там, где другие вязнут, и теряет в топях меньше людей.
  plains_leader: На открытой земле разворачивает строй и пускает конницу во всю ширь.
  shock_master: Выбирает миг для натиска — и конница бьёт раньше и вдвое страшнее.
  volley_master: Ставит стрелков так, что перестрелка решает половину боя.
  shield_wall: Его строй стоит на месте, сколько бы ни падало людей.
  unstoppable: Ведёт в атаку, не давая врагу опомниться.
  hound_of_war: Не отпускает бегущих — погоня при нём собирает страшную жатву.
  rearguard: Даже разбитым уводит войско в порядке: в отходе теряет мало.
  inspirer: Одним видом поднимает дух; ополчение держится при нём дольше.
  cautious_strategist: Не рискует понапрасну: удача меньше пляшет, потери ниже, натиск — позже.
  reckless_brawler: Лезет в самую гущу: войско за ним идёт, но и платит кровью — а сам он рискует жизнью.
  siege_master: Знает подкопы, тараны и голод: крепости при нём сдаются быстрее.
