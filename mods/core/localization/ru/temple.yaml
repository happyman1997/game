# Храм Солнца и Великий Светоч (data/common/temple.yaml).
government:
  temple: Храмовый престол
government_desc:
  temple: "Великого Светоча избирают жрецы-светочи при Престоле; все дают обет безбрачия, и каждый год к Храму приходят новые жрецы. Храм не завоёвывает — он ведёт лишь священные войны, а единоверцы поднимают на него руку неохотно: это святотатство."
succession_law:
  temple_election: Выборы жрецов-светочей
succession_law_desc:
  temple_election: "Новым Великим Светочем жрецы избирают самого учёного и красноречивого из своих рядов."
trait:
  sun_priest: Жрец-светоч
trait_desc:
  sun_priest: "Служит Храму Солнца и дал обет безбрачия. Из жрецов-светочей избирают Великого Светоча."
interaction:
  temple_gift: Дар Храму
  beg_absolution: Просить о снятии отлучения
interaction_desc:
  temple_gift: "Золото Храму Солнца — благочестие дарителю и благосклонность Великого Светоча. Душу не купишь, но лицо — можно."
  beg_absolution: "Публично покаяться перед Великим Светочем: сто золота и сто благочестия, если он примет покаяние. Он принимает его у тех, кому верит."
decision:
  request_divorce: Просить Храм о разводе
decision_desc:
  request_divorce: "Ваш культ не признаёт развода без дозволения Храма. Если Великий Светоч к вам благосклонен, он расторгнет брак; бывший супруг и его родня этого не простят."
casus_belli:
  liberate_temple: Освобождение Храма
casus_belli_desc:
  liberate_temple: "Реймс в руках чужака, Престол Светоча пуст. Победа вернёт Храм жрецам и посадит на Престол нового Великого Светоча — единоверцы этого не забудут."
cb:
  liberate_temple:
    war_name: "Освобождение Храма Солнца"
opinion_modifier:
  temple_gift: Дар Храму
  crowned_by_me: Помазан мною
  absolved: Принял покаяние
  divorced_me: Развёлся со мной
  divorced_relative: Развёлся с родственницей
  freed_the_temple: Освободил Храм
karma_deed:
  temple_freed: Освободил Храм
  temple_desecrated: Поднял руку на Храм
doctrine:
  divorce:
    approval: развод — с дозволения Храма
  polygamy:
    "true": многожёнство
    "false": единобрачие
tr:
  faith_doctrine: "Учение культа: {value}"
ui:
  coronation_needs_head: "Помазывает Великий Светоч: он должен к вам благоволить (мнение не ниже 0). Престол пуст — помазать некому."
  divorce_needs_head: "Великий Светоч должен быть к вам благосклонен (мнение от 20)"
msg:
  news_temple_attacked: "Весть: [scope:news_subject] поднял(а) войну на Храм Солнца. Великий Светоч изгнал святотатца из Света."
  news_temple_taken: "Весть: [scope:news_subject] захватил(а) Реймс. Престол Светоча пуст, святотатец изгнан из Света — единоверцы зовут освободить Храм."
  news_temple_freed: "Весть: Храм Солнца освобождён. Жрецы-светочи избрали нового Великого Светоча."
  saint_recognized: "Великий Светоч признал вашу святость: о Живом святом говорят во всех храмах."
