government:
  feudal: Феодальное правление
  order: Рыцарский орден
  people_republic: Народная республика
  master_council: Совет мастеров
government_desc:
  feudal: "Земли держат вассалы за службу, власть передаётся по закону наследования."
  order: "Магистра избирают братья из своих рядов; братья дают обет безбрачия, а каждый год приходят новые добровольцы. Земли держит сам орден."
  people_republic: "Вожака выбирает сход на десять лет из глав видных родов. Наступательную войну одобряет сход, рыцарей нет — воюет всё вольное ополчение. Вы играете за свой род: не избраны — боритесь за голоса."
  master_council: "Правит лучший мастер народа, а не наследник. Подгорные крепости неприступны, рудники богаты."
succession_law:
  order_election: Выборы среди братьев
  republic_election: Выборы схода
  master_council_law: Лучший мастер
succession_law_desc:
  order_election: "Новым магистром братья избирают самого достойного воина из своих рядов."
  republic_election: "Каждое графство на сходе голосует за одного из глав видных родов: в счёт идут слава, красноречие и агитация."
  master_council_law: "Власть переходит к лучшему мастеру своего народа в державе — по управлению и учёности."
trait:
  order_brother: Брат ордена
trait_desc:
  order_brother: "Дал обет безбрачия и служит ордену мечом и молитвой."
decision:
  campaign_for_assembly: Агитировать на сходе
decision_desc:
  campaign_for_assembly: "Угощения, подарки старостам и речи на площадях: на следующих выборах схода за ваш род проголосует больше графств."
modifier:
  levee_en_masse: Всеобщее ополчение
