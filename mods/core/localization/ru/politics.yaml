vassal_obligation:
  privileged: Привилегии
  standard: Обычные обязательства
  heavy: Тяжкие повинности
vassal_obligation_desc:
  privileged: Вассал платит вдвое меньше налогов и даёт вдвое меньше войск — и благодарен за это.
  standard: Обычный порядок службы.
  heavy: Вассал платит в полтора раза больше и шлёт больше войск. Он этого не забудет.

opinion_modifier:
  refused_council_seat: Отказал в месте в совете
  compensated: Получил отступное
  won_dispute: Рассудил в мою пользу
  lost_dispute: Рассудил против меня
  fair_judgment: Справедливый суд
  ignored_dispute: Не стал нас судить
  refused_privileges: Отказал в привилегиях
  privileges_revoked: Отнял привилегии
  duties_lightened: Облегчил повинности
  caught_sowing_discord: Сеял раздор
  false_accusation: Оклеветал меня
  trusted_me: Поверил мне
  refused_land: Отказал в землях
  swore_fealty: Присягнул на Великом совете
  taxed_by_council: Чрезвычайный сбор
  heard_grievances: Выслушал наши жалобы
  levied_by_council: Призвал к оружию
  amnesty: Амнистия

modifier:
  council_war_levy: Призыв Великого совета
  iron_hand: Железная рука

interaction:
  grant_privileges: Даровать привилегии
  impose_heavy_duties: Ужесточить повинности
  restore_obligations: Вернуть обычные обязательства
  sow_discord: Посеять раздор
interaction_desc:
  grant_privileges: Освободить вассала от части налогов и службы. Он станет вернее и реже будет слушать смутьянов.
  impose_heavy_duties: Обязать вассала платить и служить больше. Нужна сильная корона, крюк или законный повод.
  restore_obligations: Вернуть вассалу обычные условия службы.
  sow_discord: Через тайных людей рассорить вассала с его ближайшим союзником. Соперники не вступают во фракции, которые ведёт другой.

decision:
  convene_great_council: Созвать Великий совет
decision_desc:
  convene_great_council: "Собрать вассалов на совет — у англичан это витенагемот, у северян тинг. Совет может принести присягу, деньги, мир при дворе или войска."

faction:
  liberty_faction: Партия вольностей
faction_desc:
  liberty_faction: Вассалы недовольны сильной короной и тяжкими повинностями. Если требования примут, власть короны ослабнет на ступень, а повинности станут обычными.
casus_belli:
  liberty_revolt: Мятеж за вольности
casus_belli_desc:
  liberty_revolt: Победа мятежников ослабит власть короны на две ступени и даст им привилегии.
cb:
  liberty_revolt:
    war_name: "Мятеж за вольности против [scope:defender]"

ev:
  politics.0001:
    t: Место за столом
    desc: "[scope:vassal] [scope:vassal|g:прибыл/прибыла] ко двору без приглашения. «Мои земли кормят половину вашего войска, — говорит [scope:vassal|g:он/она], — а в совете сидят люди, чьих имён никто не знает. Я требую места среди советников»."
    a: Дать ему место в совете
    b: Откупиться золотом
    c: Указать ему на дверь
  politics.0002:
    t: Тяжба о меже
    desc: "[scope:first] и [scope:second] спорят о мельнице и лесе на границе своих владений. Оба привели свидетелей, оба клянутся на Евангелии. Двор ждёт вашего решения."
    a: "Прав [scope:first]"
    b: "Прав [scope:second]"
    c: Разделить спорное и возместить обоим
    d: Пусть решают мечом
  politics.0003:
    t: Прошение о вольностях
    desc: "[scope:vassal] просит освободить [scope:vassal|g:его/её] от части податей и службы. «Мои люди измучены поборами, — пишет [scope:vassal|g:он/она]. — Дайте мне вольности, и я буду вам вернейшим из слуг»."
    a: Даровать вольности
    b: Отказать
    c: Напомнить ему, кому он служит
  politics.0004:
    t: Жалоба на советника
    desc: "[scope:accuser] при всём дворе обвиняет [scope:accused] в том, что тот запускает руку в казну и торгует вашими милостями. Обвиняемый бледнеет, но молчит."
    a: Провести дознание
    b: Сместить советника
    c: Отклонить жалобу
  politics.0005:
    t: Родич просит земли
    desc: "[scope:petitioner] устал жить при дворе из милости. «Я вашей крови, — говорит [scope:petitioner|g:он/она], — а у меня нет даже деревни. Пожалуйте мне графство, и я буду вашей опорой»."
    a: Пожаловать графство
    b: Отказать
    c: Дать денег и обещаний
  politics.0006:
    t: Шёпот о тирании
    desc: "Когда вы входите в зал, разговоры смолкают. Говорят, в кабаках вас называют мясником, а матери пугают вами детей. Страх держит вассалов в узде — но долго ли?"
    a: Объявить амнистию
    b: Пусть боятся
  politics.0007:
    t: Осведомитель
    desc: "Ночью к вам привели [scope:informant]. [scope:informant|g:Он/Она] признаётся, что состоит в заговоре против вас, и [scope:informant|g:готов/готова] назвать имена — за плату и прощение."
    a: Заплатить и отпустить из заговора
    b: Пусть остаётся среди них — нашими глазами
    c: Прогнать предателя
  politics.0010:
    t: Великий совет
    desc: "В главном зале собрались вассалы со всей державы — с дружинами, знамёнами и старыми обидами. Они выслушают вас, но и сами захотят быть услышанными. О чём вы попросите совет?"
    a: Принести присягу дому и наследнику
    b: Утвердить чрезвычайный сбор
    c: Выслушать жалобы и примириться
    d: Призвать вассалов к оружию
