faith:
  ash_penitence: Пепельное покаяние
  ancestor_cult: Завет предков
faith_desc:
  ash_penitence: "Пепел — кара за гордыню империи. Те же таинства, что у старой церкви, но первые грехи — гордыня и честолюбие."
  ancestor_cult: "Цверги чтут предков-мастеров, чьи имена высечены в камне, и клянутся их молотами."

terrain:
  ash: Пепелище

stat:
  lifespan_mult: Долголетие

trait:
  dwarf: Цверг
trait_desc:
  dwarf: "Цверги живут вдвое дольше людей, но дети у них редки. Браки — только между своими."

building:
  imperial_regalia: Императорские регалии
  wolf_hall: Волчий зал
  mercenary_market: Наёмный рынок
  border_citadel: Пограничная цитадель
  ash_citadel: Пепельная твердыня
  great_dike: Великая дамба
  deep_forges: Глубинные горны
  burnt_palace: Сожжённый дворец
building_desc:
  imperial_regalia: "Скипетр, держава и меч Солнечной империи. Нет лишь венца."
  wolf_hall: "Здесь маркграфы Севера пируют со своими рыцарями и выбирают лучших бойцов."
  mercenary_market: "Горные роты нанимаются здесь на службу к любому, кто платит серебром."
  border_citadel: "Стены, что строились полвека: от Гренцбурга до гор — цепь крепостей."
  ash_citadel: "Крепость-монастырь на краю пепелища. Братья несут дозор днём и ночью."
  great_dike: "Дамба, которую фризы строили всем миром: она держит море — и держит их вместе."
  deep_forges: "Горны в глубине Медной горы не гаснут уже тысячу лет."
  burnt_palace: "Обугленные стены дворца Отгара. Тот, кто держит их, держит память империи."

regiment_type:
  mountain_companies: Горные роты
  dike_militia: Ополчение дамб
  ironclads: Железнобокие
regiment_type_desc:
  mountain_companies: Пикинёры с гор Южной марки. Наёмники, известные на всю империю; в горах им нет равных.
  dike_militia: Фризские крестьяне с баграми и цепами. На болотах конница рыцарей вязнет у них на глазах.
  ironclads: Цверги в кованых латах. Медленны, но остановить их почти невозможно.

