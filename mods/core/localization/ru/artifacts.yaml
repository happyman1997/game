artifact:
  edward_crown: Венец Эдуарда Исповедника
  joyeuse: Жуайёз, меч Карла Великого
  landwaster: Знамя «Опустошитель земель»
  papal_banner: Знамя святого Петра
  stone_of_destiny: Камень Судьбы
  bell_of_patrick: Колокол святого Патрика
artifact_desc:
  edward_crown: "Корона святого короля Англии. Ею венчали Гарольда в Вестминстере — и всякий, кто наденет её, назовётся законным королём."
  joyeuse: "Меч Карла Великого, что, говорят, менял цвет тридцать раз на дню. Короли франков опоясываются им на коронации."
  landwaster: "Ворон на белом шёлке. Сага говорит: под этим знаменем Харальд Суровый не проиграл ни одной битвы."
  papal_banner: "Освящённое знамя, присланное папой Александром герцогу Нормандии. С ним война за английский трон — дело святое."
  stone_of_destiny: "Глыба песчаника из Скона, на которой коронуют королей Шотландии. Кто сидит на ней — тот и король."
  bell_of_patrick: "Железный колокол святого Патрика в золотой раке. Его звон, говорят, изгнал из Ирландии змей и демонов."

