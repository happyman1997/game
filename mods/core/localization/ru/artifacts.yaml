interaction_desc:
  gift_artifact: "Подарить вещь из своего инвентаря. Чем она редче, тем сильнее благодарность."
  demand_artifact: "Потребовать назад вещь, на которую у вас есть притязание: её отняли у вас или ваш род. Отказ оставит обиду."

ev:
  artifact.0001:
    t: Торговец редкостями
    desc: "Ко двору прибыл торговец из дальних стран. Его сундуки полны чудес: перстни с камнями, обереги, кубки чеканного серебра, книги в окладах. Всё — для тех, кто знает толк и не жалеет золота."
    a: Купить перстень или оберег (−100 золота)
    b: Купить диковину для двора (−160 золота)
    c: Отпустить торговца
  artifact.0002:
    t: Дар вассала
    desc: "[scope:vassal] просит позволения преподнести вам дар — знак верности и любви. Слуги вносят свёрток, перевязанный алой лентой."
    a: Принять с благодарностью
    b: Одарить в ответ (−60 золота)
  artifact.0003:
    t: Ветхая вещь
    desc: "«[scope:artifact]» служит вам верно, но годы берут своё: металл истёрся, швы расходятся. Ещё немного — и вещь рассыплется у вас в руках."
    a: Позвать лучшего мастера (−40 золота)
    b: Пусть чинит дворцовый кузнец
    c: Пусть служит, сколько сможет
  artifact.0004:
    t: Зависть соседа
    desc: "Послы [scope:buyer] привезли богатые дары и просьбу: их господин желает получить «[scope:artifact]» и предлагает за неё двести пятьдесят золотых."
    a: Продать за 250 золотых
    b: Подарить — и обрести друга
    c: Отказать
