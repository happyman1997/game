interaction_desc:
  abduct: "Интрига: подкупленные люди схватят этого человека и доставят в вашу темницу. Пленника можно выкупить, обменять — или держать как рычаг. Родня и сюзерен похищенного этого не простят."
  steal_artifact: "Интрига: вор унесёт из сокровищницы самую ценную вещь — а если среди них есть ваша утраченная, то её. У прежнего владельца останется притязание."
  incite_unrest: "Интрига: подстрекатели разойдутся по трём богатейшим графствам этого правителя. Три года графства будут злее к нему — до податей ли, когда шепчут о бунте?"
  sabotage: "Интрига: в столице этого правителя загорятся склады — два года подати там меньше, а начатая стройка откатится на полгода."
