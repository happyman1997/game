interaction_desc:
  intimidate: "Потребовать у вассала треть его казны. Согласится тот, кто боится; храбрый откажет — и даст вам законный повод заточить его."
  bribe: "Золото вместо пиров: вассал или придворный надолго проникнется к вам расположением и выйдет из фракции. Честных и справедливых подкуп оскорбит."
  sell_secret: "Продать соседнему правителю известную вам тайну — лучше всего о его вассале или враге. Он заплатит серебром и будет благодарен."
  compel_service: "Потратить крюк: тот, кто у вас на крючке, заплатит золотом, вступит в союз или займёт место в вашем совете и забудет о фракциях."
  heart_pact: "Любовник-правитель не откажет: заключит с вами союз, а если вы воюете — сложит оружие."

