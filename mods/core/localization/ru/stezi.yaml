  holy_call: Воззвание к священной войне
decision_desc:
  golden_age: "Раз в жизни государь может провозгласить Золотой век: десять лет земли растут быстрее, двор спокоен, вассалы довольны."
  royal_progress: "Вы объезжаете свои земли со двором и знамёнами. Удастся ли — зависит от дипломатии и славы: тогда графства и вассалы надолго запомнят визит, а молва разнесётся далеко; неловкий объезд обернётся насмешками."
  gather_kin: "Правители вашего рода съезжаются на родовое вече и несут дары — часть своей казны. Род гремит, родня теплеет к главе."
  grand_muster: "Смотр войска: два года ополчение собирается охотнее, отряды муштрованы, полководец уверен, рыцари польщены."
  public_execution: "Самого знатного из пленников казнят на площади при всём народе. Грозная слава поднимется на ступень, столица долго будет помнить казнь, дерзкие возненавидят тирана, а родня казнённого станет кровниками."
  glory_quest: "Вы отправляетесь туда, где звенят мечи: на ристалище чужого двора или к границе, где ищут славы. Можно биться самому или выставить лучшего рыцаря."
  great_work: "Раз в жизни правитель может воздвигнуть в столице нечто, что переживёт его на века: собор, донжон или рынок."
  take_loan: "Менялы дадут 300 золота сразу, а расплачиваться — двенадцать лет. Условия зависят от вас: без связей — кабала (3,5 золота в месяц), с Меняльным двором в домене или перком «Заимодавец» — обычные (2,5), Великому казначею и щедрой руке — льготные (1,8). Новый заём — только после прежнего."
  magnum_opus: "Вы садитесь за труд, который будут переписывать веками. Книга станет прославленной реликвией двора (при учёности 20 — легендарной)."
  miracle: "Молитва, после которой встают с одра. Исцеляет ваши раны и болезни и раны близких; графства домена говорят о чуде."
  holy_call: "Во время войны с чужим культом или еретиком вы призываете единоверцев к оружию: три года ополчение больше, рыцари яростнее, единоверные вассалы благодарны."

interaction:
  intimidate: Запугать
  bribe: Подкупить
  sell_secret: Продать тайну
  compel_service: Заставить служить
  heart_pact: Сердечный союз
interaction_desc:
  intimidate: "Потребовать у вассала треть его казны. Запугать можно лишь покорного или сломленного: согласится тот, кто боится. Отказ даст вам законный повод заточить его, но если вас не боятся, над угрозой посмеются."
  bribe: "Золото вместо пиров. Удастся ли — решают жадность того, кого подкупают, и ваша ловкость: тогда он надолго проникнется к вам расположением и выйдет из фракции. Честных и справедливых подкуп оскорбит."
  sell_secret: "Продать соседнему правителю известную вам тайну — лучше всего о его вассале или враге. Он заплатит серебром и будет благодарен."
  compel_service: "Потратить крюк: тот, кто у вас на крючке, заплатит золотом, вступит в союз или займёт место в вашем совете и забудет о фракциях."
  heart_pact: "Любовник-правитель не откажет: заключит с вами союз, а если вы воюете — сложит оружие."

