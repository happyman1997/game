ui_category:
  decisions:
    stezi: Стези

decision:
  royal_progress: Королевский объезд
  gather_kin: Созвать родню
  grand_muster: Военный смотр
  public_execution: Показательная казнь
  glory_quest: Поход за славой
  great_work: Великая стройка
  take_loan: Ломбардский заём
  magnum_opus: Великий труд
  miracle: Чудо
  holy_call: Воззвание к священной войне
decision_desc:
  royal_progress: "Вы объезжаете свои земли со двором и знамёнами. Графства домена и вассалы надолго запомнят ваш визит, а молва о величии разнесётся далеко."
  gather_kin: "Правители вашего рода съезжаются на родовое вече и несут дары — часть своей казны. Род гремит, родня теплеет к главе."
  grand_muster: "Смотр войска: два года ополчение собирается охотнее, отряды муштрованы, полководец уверен, рыцари польщены."
  public_execution: "Самого знатного из пленников казнят на площади при всём народе. Страх расползётся по державе; храбрецы возненавидят тирана."
  glory_quest: "Вы отправляетесь туда, где звенят мечи: на ристалище чужого двора или к границе, где ищут славы. Можно биться самому или выставить лучшего рыцаря."
  great_work: "Раз в жизни Зодчий может воздвигнуть в столице нечто, что переживёт его на века: собор, донжон или рынок."
  take_loan: "Ломбардские менялы дадут 300 золота сразу. Расплата — по 2,5 золота в месяц двенадцать лет. Новый заём — только после прежнего."
  magnum_opus: "Вы садитесь за труд, который будут переписывать веками. Книга станет прославленной реликвией двора (при учёности 20 — легендарной)."
  miracle: "Молитва, после которой встают с одра. Исцеляет ваши раны и болезни и раны близких; графства домена говорят о чуде."
  holy_call: "Во время войны с иноверцами вы призываете единоверцев к оружию: три года ополчение больше, рыцари яростнее, единоверные вассалы благодарны."

interaction:
  intimidate: Запугать
  bribe: Подкупить
  sell_secret: Продать тайну
  compel_service: Заставить служить
