ev:
  stezi.0001:
    t: Поход за славой
    desc: "Трубят герольды, на ристалище чужого двора рыцари из трёх королевств. Победителю — оружие, о котором сложат песни, проигравшему — позор и лекарь. Выйти самому или выставить лучшего из своих людей?"
    a: Выйти на ристалище самому
    b: Выставить лучшего рыцаря
    c: Пировать и слушать песни
  stezi.0002:
    t: Великая стройка
    desc: "Мастера собраны, камень заказан, казна раскрыта. Что воздвигнуть в столице, чтобы его помнили, когда от вас останется лишь имя в летописи?"
    a: Собор — во славу Божью
    b: Донжон — на страх врагам
    c: Рынок — на радость купцам
  stezi.0003:
    t: Должок
    desc: "[scope:recipient] знает, что вам известно. Пришло время платить — выбирайте, какой монетой."
    a: Пусть заплатит золотом
    b: Пусть станет союзником
    c: Пусть служит в совете
