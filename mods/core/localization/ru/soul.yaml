# «Свет и Пепел»: ступени души, Книга деяний, паломничество к Пепелищу, знамения.
karma_tier:
  ashen: Пепельный
  tainted: Запятнанный пеплом
  common: Как все
  pious: Благочестивый
  solar: Солнечный
karma_tier_desc:
  ashen: "Душа почернела от пепла. Знамения дурны, жрецы отворачиваются, Великий Светоч может изгнать из Света. Князь Пепла давно смотрит в эту сторону."
  tainted: "На душе пепел. Жрецы холодны, по ночам снятся дурные сны."
  common: "Грешит и кается, как все. Весы в равновесии."
  pious: "Чистая душа: благочестие копится быстрее, ревнители веры чтут."
  solar: "Душа светла, как полуденное солнце. Знамения добры, а после смерти от таких остаются мощи и слава роду."
karma_deed:
  other: Деяние
  unjust_execution: Казнь без вины
  execution: Казнь
  public_execution: Казнь на площади
  unjust_imprisonment: Темница без вины
  murder: Убийство
  blackmail: Шантаж
  betrayal: Отнял землю без вины
  treachery: Посеял раздор
  intimidation: Запугал вассала
  false_promise: Солгал ходокам
  petitioners_driven_away: Прогнал ходоков
  sacrilege: Прогнал жреца
  mercy: Милость к пленникам
  alms: Милостыня
  just_judgment: Справедливый суд
  prayer_with_people: Молился с народом
  pilgrimage: Паломничество
  confession: Исповедь
  penance: Покаяние
  prayer: Молитва
  donation: Дар Храму
  ash_pilgrimage: Паломничество к Пепелищу

decision:
  ash_pilgrimage: Паломничество к Пепелищу
decision_desc:
  ash_pilgrimage: "Пройти пешком к краю Пепелища, где в ночь пожара пал Князь Пепла, и бросить в пепел свой грех. Путь тяжёл — пепельные бури калечат, — но там с души сходит больше пепла, чем после любой исповеди."

modifier:
  cast_out_of_light: Изгнан из Света
  good_omen: Доброе знамение
  bad_omen: Дурное знамение

msg:
  ash_pilgrimage_back: "Вы вернулись от Пепелища. На душе легче."
  ash_pilgrimage_storm: "Пепельная буря настигла паломников у самого края. Вы вернулись — но не целым."

ev:
  soul.0001:
    t: Доброе знамение
    desc: "В день вашего рождения над замком встала двойная радуга, а в поле нашли колос с двумя зёрнами на каждом стебле. Жрецы-светочи говорят: Император-Солнце смотрит на вас с любовью."
    a: Возблагодарить Солнце
    b: Объявить о знамении народу
  soul.0002:
    t: Дурное знамение
    desc: "Во всей округе разом скисло молоко, вороны третий день кружат над башней, а в очаге зала огонь горит без жара. Слуги шепчутся и отводят глаза."
    a: Пустое суеверие
    b: Заказать очистительный молебен
  soul.0003:
    t: Пепельный сон
    desc: "Вам снится, что вы идёте по пеплу, и он тёплый, как зола от вчерашнего костра. Кто-то идёт следом — шаг в шаг. Вы не оборачиваетесь. Вы знаете, что если обернуться — он улыбнётся."
    a: Проснуться и забыть
    b: Молиться до рассвета
  soul.0004:
    t: Холод жрецов
    desc: "На праздничном молебне жрец-светоч не подал вам освящённой свечи и прошёл мимо, будто не заметил. Двор всё видел."
    a: Пожертвовать Храму
    b: Стерпеть
    c: Прогнать жреца со двора
  soul.0005:
    t: Изгнание из Света
    desc: "Гонец Великого Светоча привёз грамоту с чёрной печатью: за дела ваши вы изгнаны из Света. Отныне жрецы не благословят ваших начинаний, а верные вправе отвернуться от вас."
    a: Покаяться и заплатить
    b: Пусть изгоняют
