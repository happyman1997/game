# Тексты событий. [путь] — подстановка из скриптового контекста:
# [root], [scope:vassal], [scope:child.first_name]...
# [scope:x|g:вариант_м/вариант_ж] — выбор по полу персонажа.
ev:
  health.0001:
    t: Недомогание
    desc: "Последние дни вы чувствуете себя скверно: ломит кости, бросает то в жар, то в холод. Придворные шепчутся за спиной."
    a: Позвать лучшего лекаря (−20 золота)
    b: Молиться о выздоровлении
    c: Пустяки, пройдёт само
  health.0002:
    t: Воспаление лёгких
    desc: "Болезнь не отступает — теперь каждый вдох даётся с хрипом и болью. Лекари мрачно качают головами."
    a: Я и не такое переживал
    b: Привезти учёного врача из Салерно (−50 золота)
  health.0003:
    t: Выздоровление
    desc: "Однажды утром вы просыпаетесь и понимаете, что болезнь отступила. Слава Господу!"
    a: Возблагодарить небеса
  health.0004:
    t: Груз лет
    desc: "Руки уже не так тверды, а глаза не так зорки, как прежде. Старость вступает в свои права."
    a: Такова судьба всех смертных
    b: Найти утешение в молитве
  health.0005:
    t: Учебный поединок
    desc: "Молодой рыцарь вызывает вас на учебный бой. Двор собрался поглазеть."
    a: Принять вызов!
    b: У меня есть дела поважнее
  stress.0001:
    t: Невыносимое напряжение
    desc: "Заботы правления давят на вас тяжким грузом. Так дальше продолжаться не может — нужно найти отдушину."
    a: Утопить тревоги в вине
    b: Искупить грехи бичеванием
    c: Закатить разгульный пир (−30 золота)
    d: Стиснуть зубы и терпеть
  stress.0002:
    t: На грани
    desc: "Вы больше не можете спать, а мысли путаются. Сердце колотится так, будто вот-вот разорвётся."
    a: Я должен выдержать...
  court.0001:
    t: Просьба вассала
    desc: "[scope:vassal] просит вашей помощи: казна вассала пуста, а долги растут."
    a: Помочь деньгами (30 золота)
    b: Пусть сам разбирается со своими долгами
  court.0002:
    t: Странствующий учёный
    desc: "Ко двору прибыл учёный муж, повидавший Константинополь и Кордову. Он предлагает свои услуги."
    a: Нанять его советником (−30 золота)
    b: Пусть остаётся при дворе
    c: Прогнать шарлатана
  court.0004:
    t: Ссора при дворе
    desc: "[scope:first] и [scope:second] сцепились прямо в пиршественном зале. Оба требуют, чтобы вы рассудили спор."
    a: "Встать на сторону [scope:first.first_name]"
    b: "Встать на сторону [scope:second.first_name]"
    c: Не вмешиваться
  court.0005:
    t: Крестьянские волнения
    desc: "Крестьяне [scope:province] отказываются платить подати и грозят взяться за вилы."
    a: Подавить бунт силой
    b: Пойти на уступки (−40 золота)
    c: Пусть побузят
  court.0006:
    t: Обильный урожай
    desc: "Этим летом в [scope:province] собрали небывалый урожай — амбары ломятся от зерна."
    a: Отличные новости!
  court.0007:
    t: Неурожай
    desc: "Дожди погубили посевы в [scope:province]. Зимой крестьянам грозит голод."
    a: Открыть княжеские амбары (−30 золота)
    b: Пусть выживают как могут
  court.0008:
    t: Ярмарка
    desc: "Купцы просят разрешения устроить большую ярмарку в [scope:province]."
    a: Разрешить и не брать пошлин
    b: Обложить купцов налогом (+40 золота)
  court.0009:
    t: Просьба епископа
    desc: "Епископ просит пожертвовать на строительство новой церкви. Отказ будет воспринят без восторга."
    a: Пожертвовать 50 золота
    b: Казна не бездонна
  court.0010:
    t: Наёмники
    desc: "Капитан наёмного отряда предлагает свой меч — за хорошую плату, разумеется."
    a: Нанять отряд (−100 золота)
    b: Обойдёмся
  court.0011:
    t: Дерзкий вассал
    desc: "[scope:vassal] прилюдно насмехается над вами. Двор ждёт вашего ответа."
    a: Унизить наглеца перед всеми
    b: Сделать вид, что не заметили
    c: Пригласить его на примирительный обед (−25 золота)
  court.0012:
    t: Хвостатая звезда
    desc: "В небе появилась яркая комета с огненным хвостом. Монахи записывают её в хроники, а народ шепчется о знамении."
    a: Это знак грядущей победы!
    b: Это дурное предзнаменование. Нужно молиться
  family.0001:
    t: Способный ребёнок
    desc: "Наставники [scope:child] докладывают о больших успехах. Чему уделить особое внимание?"
    a: Дипломатии
    b: Военному делу
    c: Управлению
    d: Учёности
  family.0002:
    t: Семейная ссора
    desc: "[scope:spouse] устраивает вам сцену из-за пустяка. Слуги разбегаются по углам."
    a: Извиниться
    b: Стоять на своём
  family.0003:
    t: Семейное счастье
    desc: "Вечер с [scope:spouse] у камина напомнил вам, ради чего стоит жить."
    a: Хорошо дома
  family.0004:
    t: Зависть родича
    desc: "[scope:sibling] не скрывает зависти к вашему положению и намекает, что заслуживает большего."
    a: Подарить 50 золота
    b: Пусть знает своё место
  death.0001:
    t: Утрата
    desc: "Скончался [scope:deceased]. Двор в трауре."
    a: Молиться за упокой души
    b: Скорбеть в одиночестве
  intrigue.0001:
    t: Заговор раскрыт!
    desc: "Ваши люди перехватили убийцу. Под пытками он признался, что его нанял [scope:owner]!"
    a: Я этого не забуду!
    b: Простить, как велит Господь
  succession.0001:
    t: Новое правление
    desc: "Предшественник ушёл в мир иной. Теперь бремя власти лежит на ваших плечах."
    a: Короноваться с подобающей пышностью (−100 золота)
    b: Начать правление скромно
  start.0001:
    t: Год 1066
    desc: "Вы — [root.full_name], [root.title_name]. Мир вокруг полон опасностей и возможностей. Да будет ваше правление долгим!"
    desc_william: "Король Эдуард Исповедник умер, и Гарольд Годвинсон захватил трон, который был обещан вам! Норманнские бароны ждут приказа. Подготовьте вторжение (меню «Решения») и объявите войну за Англию."
    desc_harold: "Вы — король Англии, но корона сидит непрочно. За морем Вильгельм Нормандский точит меч, а Эдгар Этелинг не забыл о своих правах."
    desc_independent: "Вы правите [root.title_name] и никому не платите дани. Соседи следят за каждым вашим шагом."
    a: Да начнётся правление!
  war.0001:
    t: Война!
    desc: "[scope:attacker] объявил нам войну! Соберите войска (вкладка «Армия»), пока враг не вторгся в наши земли."
    a: К оружию!
  feast.0001:
    t: Пир
    desc: "Столы ломятся от яств, вино льётся рекой, менестрели поют о подвигах ваших предков."
    a: Веселиться вместе со всеми!
    b: Держаться с достоинством
  feast.0002:
    t: Пьяная драка
    desc: "Изрядно выпив, [scope:brawler] затеял драку с соседом по столу."
    a: Немедленно прекратить безобразие
    b: Посмеяться вместе с гостями
  hunt.0001:
    t: Охота
    desc: "Псы подняли великолепного оленя. Егеря трубят в рог."
    a: Пустить коня в галоп!
    b: Неспешно насладиться прогулкой
  hunt.0002:
    t: Раненый вепрь
    desc: "Из кустов вылетает огромный разъярённый вепрь и бросается прямо на вас!"
    a: Встретить его копьём
    b: Отступить к свите
  pilgrimage.0001:
    t: В путь
    desc: "Вы оставляете дела на советников и отправляетесь к святым местам."
    a: Идти смиренно, как простой паломник
    b: Путешествовать с подобающей роскошью (−50 золота)
  pilgrimage.0002:
    t: Возвращение паломника
    desc: "Вы вернулись домой, обновлённым душой и телом."
    a: Хвала Господу
