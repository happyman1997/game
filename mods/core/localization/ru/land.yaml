# Местность (land.yaml, events/land.yaml)
terrain:
  burnt_forest: Гарь
  old_forest: Дремучий лес
  clearing: Вырубка
  worn_fields: Истощённая пашня
  meadow: Луг
  heath: Пустошь
  burnt: Пожарище
terrain_desc:
  burnt_forest: "Выгоревший лес. Не распашешь — лет через десять отрастёт."
  old_forest: "Глушь, звери и разбойники: мало дохода и людей, зато врагу тут не пройти."
  forest: "Лес кормит охотников, углежогов и бортников, но пашни в нём нет."
  clearing: "Пни и подлесок. Не распашешь — через десяток лет снова встанет лес."
  plains: "Поле и выпасы. Без хозяина дичает в пустошь."
  farmlands: "Хлеб и люди. Со временем земля устаёт — ей нужен пар."
  worn_fields: "Земля устала и родит скудно. Под паром отдохнёт."
  meadow: "Сено, кони и жирная земля на месте осушенной топи."
  wetlands: "Топь: тростник, рыба и лихорадка. Врагу не пройти, но и хлеба нет."
  heath: "Вереск и камень. Распахать — тяжкий труд."
  burnt: "Выжженные поля и деревни. Лет через пять затянется."
  hills: "Холмы: овцы, камень, крепкие стены."
  mountains: "Горы: руда и перевалы."
roads:
  trail: Тропа
  road: Тракт
  paved: Мощёная дорога
land_work:
  build_road: Проложить тракт
  pave_road: Замостить тракт
  thin_old_forest: Проредить дремучий лес
  clear_forest: Свести лес
  plough: Распахать
  improve_fields: Унавозить поля
  fallow: Оставить под пар
  drain_marsh: Осушить топь
  plough_meadow: Распахать луг
  plant_forest: Насадить лес
land_work_desc:
  build_road: "Расчистить и укрепить тропы графства — станут трактом: войска пройдут быстрее и с меньшими потерями, посад у тракта торгует бойчее. Народ рад дорогам."
  pave_road: "Замостить тракт камнем: самый быстрый путь, войска почти не теряют людей, посад у мостовой богатеет. Дорого и долго — зато на века."
  thin_old_forest: "Рубить строевой лес и прокладывать просеки: глушь станет обычным лесом, бревна пойдут на продажу."
  clear_forest: "Свести лес под пашню: брёвна и уголь на продажу. Охотники, углежоги и бортники останутся без дела и не простят; у соседей ниже по течению может случиться разлив — и они будут знать, чьих рук дело."
  plough: "Распахать вырубку, гарь, пустошь или пожарище — станет полем."
  improve_fields: "Годы навоза и глубокой пахоты: поле станет тучной пашней. Нужны рабочие руки — развитие от 6."
  fallow: "Пока земля отдыхает, она родит меньше — потом снова тучная."
  drain_marsh: "Годы канав и запруд: топь станет лугом, лихорадка уйдёт, но и врагу станет легче пройти."
  plough_meadow: "Распахать осушенный луг — станет тучной пашней."
  plant_forest: "Насадить лес: внукам — брёвна и дичь, народу — тень и грибы."
opinion_modifier:
  forest_felled: Свёл наш лес
  forest_planted: Насадил лес
  marsh_drained: Осушил топь
  forest_spared: Сберёг лес
  flooded_my_land: Залил мою землю
modifier:
  flooding: Разлив
  forest_outlaws: Лесные разбойники
ev:
  land.0001:
    t: Лесной пожар
    desc: "Над [scope:province.name] стоит дым: горит лес. Если не поднять людей, огонь выжжет добрую часть леса."
    a: Поднять всех на тушение (30 золота)
    b: Пусть горит — потом распашем
  land.0002:
    t: Земля устала
    desc: "Старосты из [scope:province.name] говорят: пашня устала, колос мелкий. Можно купить навоза и семян — или пусть родит, как родит."
    a: Купить навоза и семян (40 золота)
    b: Пусть родит, как родит
  land.0003:
    t: Лесной народ
    desc: "Охотники, углежоги и бортники из [scope:province.name] пришли просить: не губите лес — им без него не жить."
    a: Пощадить лес и остановить работы
    b: Заплатить им отступное (30 золота)
    c: Прогнать — лес мой
  land.0004:
    t: Разлив
    desc: "[scope:actor.name] свёл лес выше по течению — и вода пошла в [scope:flooded.name]: залиты луга и погреба."
    a: Строить дамбы (40 золота)
    b: Проклинать соседа и ждать, пока вода сойдёт
