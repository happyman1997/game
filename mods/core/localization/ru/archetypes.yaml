skill_archetype_desc:
  gray_eminence: "Дипломатия и интриги. Улыбается всем — и всех стравливает. Сеет раздор и без тайного советника, причём удачнее."
  warlord: "Дипломатия и военное дело. За таким идут: вассалы шлют больше войск и любят его."
  merchant_prince: "Дипломатия и управление. Торговля — тоже война, только выгоднее. Может заключать торговые договоры с соседями."
  arbiter: "Дипломатия и учёность. Его слово — закон для спорщиков: уважение, престиж и благочестие. В тяжбах вассалов у него свой вариант."
  courtly_knight: "Дипломатия и доблесть. Песни трубадуров, турниры и прекрасные дамы — рыцари служат ему с охотой."
  quartermaster: "Военное дело и управление. Сытое войско — злое войско: армии дешевле, ополчение больше."
  ambush_master: "Военное дело и интриги. Враг узнаёт о его войске, когда уже поздно."
  siege_engineer: "Военное дело и учёность. Знает, где у стены слабое место, и как сложить свою покрепче."
  warrior_king: "Военное дело и доблесть. Сам бьётся в рядах своих рыцарей — и рискует, как они."
  shadow_treasurer: "Управление и интриги. Знает, где вассалы прячут серебро."
  reformer: "Управление и учёность. Законы державы меняются вдвое дешевле, земли растут быстрее."
  castellan: "Управление и доблесть. Строит крепко и дёшево, держит людей в строю."
  archivist: "Интриги и учёность. В старых грамотах всегда найдётся право на соседнюю землю."
  night_blade: "Интриги и доблесть. Сам себе убийца и сам себе телохранитель."
  holy_warrior: "Учёность и доблесть. Молитва и меч: благочестие растёт, рыцари крепче, сам он редко гибнет."
  philosopher_king: "Легенда: дипломатия, управление и учёность. Мудрый государь, о каком пишут хронисты."
  scourge: "Легенда: военное дело, интриги и доблесть. Победы его внушают ужас, а люди его ненавидят."
  hero_of_songs: "Легенда: дипломатия, военное дело и доблесть. О нём поют при всех дворах."
