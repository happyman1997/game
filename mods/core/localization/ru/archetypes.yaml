skill_archetype_desc:
  gray_eminence: "Дипломатия и интриги. «Чужими руками»: раскрытую интригу валят на кого-то из придворных. Сеет раздор и без тайного советника, причём удачнее."
  warlord: "Дипломатия и военное дело. Побеждённые им не держат зла и охотнее идут к нему в вассалы; свои вассалы шлют больше войск."
  merchant_prince: "Дипломатия и управление. Заключает торговые договоры с соседями, а его подарки вдвое действеннее."
  arbiter: "Дипломатия и учёность. Мирит чужие войны (и получает за это славу); его слово — закон для спорщиков."
  courtly_knight: "Дипломатия и доблесть. Ещё два рыцаря на службе, победы в поединках вдвое славнее."
  quartermaster: "Военное дело и управление. Вдвое больше добычи, наёмники вдвое дешевле, войска дешевле содержать."
  ambush_master: "Военное дело и интриги. На своей земле его войско сильнее, а разбитый враг теряет вдвое больше."
  siege_engineer: "Военное дело и учёность. Крепости его домена на уровень крепче, чужие стены падают быстрее."
  warrior_king: "Военное дело и доблесть. Сам бьётся в рядах своих рыцарей — и рискует, как они."
  shadow_treasurer: "Управление и интриги. Каждый, на кого у него есть крюк, платит за молчание серебром."
  reformer: "Управление и учёность. Законы державы меняются вдвое дешевле, и недовольство вассалов реформам не помеха."
  castellan: "Управление и доблесть. Его столица выдерживает осаду вдвое дольше; строит крепко и дёшево."
  archivist: "Интриги и учёность. В старых грамотах всегда найдётся право на соседнюю землю, а каждый год — чья-то тайна."
  night_blade: "Интриги и доблесть. Его убийцы вдвое быстрее, а убить его самого невозможно."
  holy_warrior: "Учёность и доблесть. Победы над иноверцами угодны Богу, священная война вдвое дешевле."
  philosopher_king: "Легенда: дипломатия, управление и учёность. Раз в жизни может провозгласить «Золотой век»."
  scourge: "Легенда: военное дело, интриги и доблесть. Победы его внушают ужас, враги сдаются раньше — а люди его ненавидят."
  hero_of_songs: "Легенда: дипломатия, военное дело и доблесть. О нём поют при всех дворах, а наследник получит «Наследие героя»."
