regiment_type_desc:
  light_footmen: Дешёвые и выносливые копейщики. Хороши в лесах и на холмах.
  archers: Стрелки, косящие пехоту издалека. Уязвимы для конницы.
  pikemen: Стена копий, о которую разбивается любая конница.
  light_cavalry: Быстрые всадники — гроза лучников. Бесполезны в лесах и болотах.
  heavy_infantry: Закованные в броню воины, прорубающие строй пикинёров.
  heavy_cavalry: Рыцарская конница — самая сокрушительная сила на равнине, но копья пикинёров ей страшны.
  housecarls: Личная дружина англосаксонских и скандинавских владык с огромными секирами.
  chevaliers: Нормандские и французские рыцари — лучшая тяжёлая конница эпохи.
  gallowglass: Наёмные воины-гэлы с длинными топорами, привычные к холмам и болотам.
  longbowmen: Валлийские лучники с длинными луками пробивают даже кольчугу.
