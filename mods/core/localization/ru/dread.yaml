  broken_promises: "Графство вспомнило прежнее обещание. Обманутые надежды не прощают."
  news_horror: "Весть: в землях [scope:news_subject] правит ужас. Темницы полны, при дворе говорят шёпотом."
  news_terror: "Весть: [scope:news_subject] правит террором — деревни пустеют, а дерзкие исчезают по ночам."

ev:
  populace.0010:
    t: Ходоки из графства
    desc: "Из графства [scope:province] пришли ходоки — старосты в лучших кафтанах, с шапками в руках. Кланяются в пол и просят выслушать: жить стало невмочь."
    desc_taxes: "Из графства [scope:province] пришли ходоки — старосты в лучших кафтанах, с шапками в руках. Чрезвычайные подати выгребли амбары подчистую: «Сеять нечем, государь, детям есть нечего»."
    desc_levies: "Из графства [scope:province] пришли ходоки — жёны и матери ополченцев. Мужики который год под знамёнами, поля зарастают, а дома некому чинить крыши."
    desc_faith: "Из графства [scope:province] пришли ходоки. Ваши люди косо смотрят на их обряды и грозят снести родовые святилища. «Мы чтим того же Императора, государь, — только по-своему»."
    desc_customs: "Из графства [scope:province] пришли ходоки. Ваши наместники ломают их старые обычаи: судят не по их правде, говорят не на их языке. Старосты просят оставить им их порядки."
    desc_ruin: "Из графства [scope:province] пришли ходоки, ещё пахнущие гарью. После осады от деревень остались печные трубы. Они просят помочь отстроиться."
    desc_plague: "Из графства [scope:province] пришли ходоки — издалека, не подходя близко: в графстве мор. Они просят лекарей и хлеба, пока не вымерли целыми деревнями."
    desc_new_lord: "Из графства [scope:province] пришли ходоки. Прежний господин дал им вольности, а ваши люди о них и слышать не хотят. Старосты держат старые грамоты и просят их подтвердить."
    desc_cruelty: "Из графства [scope:province] пришли ходоки — бледные, говорят шёпотом. Казни, плети, пустые дворы. Они не просят ничего — только чтобы это кончилось."
    desc_lies: "Из графства [scope:province] снова пришли ходоки — те же самые. Прошлый раз вы обещали. Они помнят каждое слово."
    a: Выслушать и облегчить
    pray: Помолиться вместе с ними
    b: Пообещать и забыть
    c: Прогнать
    d: Разобраться самому

  dread.0001:
    t: Донос
    desc: "[scope:informer] просит слова наедине и, оглядываясь на дверь, шепчет: [scope:accused] за вином бранил вас последними словами и звал других «поговорить о будущем»."
    a: Наградить доносчика — пусть все знают, что я слышу
    b: Пригрозить обвинённому
    c: Прогнать доносчика — я не верю наветам
  dread.0002:
    t: Дары без повода
    desc: "Без праздника и без просьбы во двор въезжают повозки: вассалы шлют серебро, меха и вино. Ни один не пишет, чего хочет. Все пишут, как вам преданы."
    a: Принять дары
    b: Вернуть дары с благодарностью
  dread.0003:
    t: Пустое место за столом
    desc: "За ужином пусто место [scope:leaver]. Утром слуги говорят: [scope:leaver|g:собрал/собрала] пожитки ещё ночью и [scope:leaver|g:уехал/уехала] ко двору [scope:refuge]. «Служить совести — не страху», — сказано было на прощание."
    a: Пусть уходит
    b: Вернуть — и умерить свой нрав
    c: Догнать и бросить в темницу
  dread.0004:
    t: Ворота открыты
    desc: "Едва ваше войско показалось на холме, ворота вражеской крепости распахнулись сами: комендант бежал ночью, а горожане вынесли ключи на подушке. Молва о вас идёт впереди войска."
    a: Войти без боя
  dread.0005:
    t: Сон о казнённых
    desc: "Ночью они пришли — все, кого вы казнили. Стояли вокруг постели и молчали. Вы проснулись в холодном поту, а свеча догорела до основания."
    a: Это лишь сон
    b: Заказать молебен за их души
    c: Распахнуть темницы
  dread.0006:
    t: Опустевшие деревни
    desc: "Из графства [scope:province] доносят: деревни пустеют. Люди уходят ночами, целыми семьями, бросая дома — куда угодно, лишь бы подальше от вас."
    a: Пусть бегут
    b: Вернуть беглых силой
    c: Отменить поборы — пусть возвращаются
  dread.0007:
    t: Кинжал под подушкой
    desc: "Перестилая постель, служанка нашла под вашей подушкой кинжал — без ножен, остриём к изголовью. Кто его положил, не знает никто. Или все молчат."
    a: Казнить стражу той ночи
    b: Удвоить стражу
    c: Спать с мечом
  dread.0008:
    t: Шут
    desc: "Пир идёт в тишине — никто не смеет смеяться. Только шут встаёт, кланяется и говорит: «Государь, отчего у нас такие весёлые похороны?» Зал замирает."
    a: Казнить шута
    b: Рассмеяться
    c: Шут прав — объявить милость
