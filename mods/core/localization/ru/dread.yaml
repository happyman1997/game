# Грозная слава: ступени страха, кто боится, ходоки из графств, черта «Садист».
dread_tier:
  calm: Спокойствие
  unease: Опасение
  fear: Страх
  horror: Ужас
  terror: Террор
dread_tier_desc:
  calm: "Вас не боятся. Жалобы и прошения идут свободно, фракции собираются без оглядки."
  unease: "При дворе понижают голос. Покорные вступают во фракции, но не зачинают их; жалобы — вдвое реже. Бывают доносы."
  fear: "Подати и ополчение собирают без уклонений, интриги против вас вязнут, жалобы — вчетверо реже. Совестливые придворные уходят, а вассалы шлют дары без повода."
  horror: "Жалоб нет вовсе. Враги охотнее мирятся, слабые гарнизоны сдаются, но соседи не отдают за вас дочерей и не заключают союзов. Вы плохо спите — если вы не чёрствы, не мнительны и не садист."
  terror: "Фракции распадаются — остаются лишь дерзкие, крестьяне не смеют бунтовать. Но деревни пустеют, Храм осуждает вас, бессонница мучит, а храбрецы точат кинжалы. Вас зовут Грозным."

