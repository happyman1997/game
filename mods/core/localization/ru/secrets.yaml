secret_type_desc:
  secret_murder: Этот человек тайно убил другого. Если правда откроется, родня жертвы будет мстить, а сюзерен получит повод для заточения.
  secret_lover: Тайная связь вне брака. Разоблачение опозорит обоих и оскорбит супругов.
  secret_embezzler: Запускал руку в казну сюзерена. Сюзерен вправе бросить вора в темницу.
