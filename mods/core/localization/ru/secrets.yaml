  fabricate_hook: Добыть компромат
interaction_desc:
  blackmail: "Пригрозить раскрыть известный вам секрет. Вы получите крюк: за убийство или казнокрадство — сильный, за измену — слабый."
  expose_secret: Предать огласке самый тяжёлый известный вам секрет этого человека.
  fabricate_hook: Интрига, чтобы собрать компромат и получить слабый крюк на этого человека.
