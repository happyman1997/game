# Дела совета: события по завершении задач (events/council.yaml).
opinion_modifier:
  dispute_ignored: Сюзерен не стал нас рассуживать
  friendly_embassy: Дружеское посольство
  harsh_collection: Недоимки выбиты силой
  arrears_forgiven: Нам простили недоимки
  levies_released: Ополчение отпустили к жатве
  sermon_heard: Проповедь духовника
  new_roads: Новые дороги
modifier:
  drilled_levies: Обученное ополчение
  drilled_knights: Рыцари на учениях
  battle_manual: Наставление о бое
ev:
  council.0101:
    t: Спор вассалов
    desc: "[scope:councillor.first_name], ваш канцлер, приносит жалобу: [scope:vassal_a] и [scope:vassal_b] не поделили межу и грозят друг другу оружием. Оба ждут вашего слова."
    a: "Правда за [scope:vassal_a]"
    b: Примирить обоих и одарить (−25 золота)
    c: Пусть разбираются сами
  council.0102:
    t: Посольство
    desc: "Стараниями [scope:councillor.first_name] ко двору прибыли послы [scope:envoy_lord]. Они привезли дары и ждут ответа."
    a: Принять дары с благодарностью
    b: Ответить дружбой
    c: Выставить послов за дверь
  council.0103:
    t: Недоимки
    desc: "Казначей [scope:councillor.first_name] нашёл в книгах [scope:province] недоимки за несколько лет. Крестьяне клянутся, что платить нечем."
    a: Взыскать до последней монеты
    b: Простить недоимки
    c: Взять половину и закрыть книгу
  council.0104:
    t: Новые дороги
    desc: "[scope:councillor.first_name] предлагает потратить сбережения казны на дороги и мосты. Отсталое [scope:province] ждёт этого больше всех."
    a: Мостить дороги к столице
    b: "Поднять [scope:province]"
    c: Оставить деньги в казне
  council.0105:
    t: Смотр ополчения
    desc: "Маршал [scope:councillor.first_name] пересчитал ополчение: люди есть, выучки нет. Что прикажете?"
    a: Учения на три года (−20 золота)
    b: Парад в столице (−30 золота)
    c: Отпустить людей к жатве
  council.0106:
    t: Учения полководцев
    desc: "[scope:councillor.first_name] закончил[scope:councillor|g:/а] обучать ваших рыцарей и воевод. Что дальше?"
    a: Гонять рыцарей и впредь
    b: Записать наставление о бое
    c: Наградить маршала (−25 золота)
  council.0107:
    t: Нити заговора
    desc: "Тайный советник [scope:councillor.first_name] выследил[scope:councillor|g:/а] [scope:suspect]: тот тайно переписывается с недругами двора. Доказательств немного, но они есть."
    a: Схватить
    b: Молчать — и держать на крючке
    c: Простить и приблизить
  council.0108:
    t: Подложная грамота
    desc: "[scope:councillor.first_name] раздобыл[scope:councillor|g:/а] в чужих архивах грамоту на [scope:claim_target]. Подлинна она или нет — неважно, если никто не докажет обратное."
    a: Пустить её в ход
    b: Продать её соседу (+50 золота)
    c: Сжечь — грех на душу не возьму
  council.0109:
    t: Проповедь
    desc: "Духовник [scope:councillor.first_name] готов говорить с народом и с вами. О чём будет проповедь?"
    a: О верности земле и господину
    b: О покаянии — для меня одного
    c: О пороках двора
  council.0110:
    t: Учёный муж
    desc: "[scope:councillor.first_name] нашёл[scope:councillor|g:/а] учёного, которого стоит приблизить: знает языки, счёт и звёзды."
    a: Взять ко двору
    b: Пусть учит наследника
    c: Пусть переписывает книги
