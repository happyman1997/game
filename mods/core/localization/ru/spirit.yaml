spirit_state:
  broken: Надлом
  fury: Ярость
  sleepless: Бессонница
  obsession: Одержимость
  rapture: Исступление
  longing: Тоска
  revelry: Разгул
  unease: Тревога
  serenity: Безмятежность
spirit_state_desc:
  broken: "Стресс перевалил за сотню: навыки страдают, а каждая новая сотня грозит срывом."
  fury: "Гнев не находит выхода: рука тяжелее, меч быстрее — а говорить с людьми всё труднее."
  sleepless: "Параноик не спит ночами: заговор не застанет его врасплох, но силы тают."
  obsession: "Честолюбец одержим целью: работает за троих и требует того же от вассалов."
  rapture: "Ревнитель в исступлении: молитва и книга поглощают его, мирское — раздражает."
  longing: "Тоска гонит от людей к книгам: учится легко, но двор видит его редко."
  revelry: "Жизнелюб топит заботы в пирах: весел и обаятелен, но казна тает."
  unease: "Тревога не отпускает: подозрителен и насторожен, но с людьми скован."
  serenity: "Два года без забот: учится легко — но беспечен, и заговорщикам с ним проще."
trait:
  hardened: Закалённый
  shattered: Надломленный
trait_desc:
  hardened: "Пережил надлом и вышел из него сильнее: стресс копится медленнее."
  shattered: "Второй надлом: душа треснула, и стресс бьёт больнее."
modifier:
  overworked: Работа на износ
  inner_resolve: Внутренняя решимость
  ancestor_blessing: Благословение предка
  prophetic_insight: Пророческое прозрение
  quiet_vow: Обет покоя
decision:
  work_to_exhaustion: Работать на износ
decision_desc:
  work_to_exhaustion: "Обратить стресс в дело: чем он выше, тем больше выучено (и в столице сделано). Здоровье заплатит, а стресс не уйдёт."
msg:
  spirit_state: "Состояние духа: {name}."
  spirit_hardened: "Вы пережили надлом и вышли из него закалённым."
  spirit_shattered: "Новый надлом: закалка не выдержала — душа треснула."
tr:
  spirit_state: "Состояние духа: {value}"
ui:
  spirit: Состояние духа
ev:
  stress.0010:
    t: Бессонная ночь
    desc: "Сон не идёт. Мысли ходят по кругу, свеча догорает, а до рассвета ещё далеко."
    a: Читать до рассвета
    b: Обойти стены замка
    c: Велеть подать вина
    d: Проверить караулы — кто там шепчется?
    e: Пересчитать войско в уме, полк за полком
  stress.0011:
    t: Вспышка гнева
    desc: "[scope:victim] сказал(а) какую-то глупость — мелочь, но кровь ударила в голову."
    a: Ударить
    b: Сдержаться
    c: Обратить всё в шутку
    d: Разбить стол кулаком
    e: Глубоко вдохнуть
  stress.0012:
    t: Шут говорит правду
    desc: "На пиру шут, кривляясь, бросает: «Государь стал похож на загнанную лошадь». Смеются все — кроме вас."
    a: Рассмеяться вместе со всеми
    b: Высечь наглеца
    c: Понять, на что он намекает
    d: Шут забылся — и все это видели
  stress.0013:
    t: Сон о предке
    desc: "Во сне приходит [scope:ancestor]: молча смотрит и качает головой. Просыпаетесь в холодном поту."
    a: Посетить его гробницу
    b: Это просто сон
    c: Истолковать сон по книгам
    d: Заказать молебен
  stress.0014:
    t: Друг юности
    desc: "[scope:friend] вспоминает, как вы когда-то вместе удирали с уроков. Давно вы так не смеялись."
    a: Провести вечер за вином
    b: Нет времени на воспоминания
    c: Сделать его доверенным другом
    d: Промолчать весь вечер — но рядом
  stress.0015:
    t: Письмо самому себе
    desc: "Ночью вы пишете письмо — себе самому, через десять лет. Чего вы хотите на самом деле?"
    a: Покоя
    b: Величия, чего бы оно ни стоило
    c: Сжечь письмо
    d: Зашифровать — вдруг кто прочтёт
  stress.0016:
    t: Разгул
    desc: "Музыканты, вино, смех до рассвета — заботы подождут. Или нет?"
    a: Гулять до утра
    b: Не сегодня
    c: Позвать на пир вассалов
    d: Выпить кубок воды
  stress.0017:
    t: Видение
    desc: "Среди бела дня перед глазами встаёт свет, и в нём — знаки, которые нельзя не понять. Или можно?"
    a: Это знак свыше
    b: Лихорадочный бред
    c: Записать и истолковать
    d: Сон разума — не более
  stress.0018:
    t: Тихое утро
    desc: "Заботы далеко, солнце тёплое, и кажется, что так будет всегда. Именно так и думают те, кого застают врасплох."
    a: Прогуляться по саду с книгой
    b: Отложить дела ещё на день
    c: Что-то не так в этой тишине…
  stress.0019:
    t: На краю
    desc: "Руки дрожат, слова путаются. Ещё немного — и что-то сломается."
    a: Исповедаться
    b: Сорваться на слугах
    c: Уйти в работу с головой
    d: Поговорить с супругом
