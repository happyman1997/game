  levy_relief_faction: "Вассалы требуют отменить всеобщий сбор — не дело гнать в поле каждого пахаря. Примете требования — повинность смягчится на ступень."
  zealot_faction: "Ревнители веры требуют отменить королевскую десятину: добро Храма — не добро короны. Примете требования — закон о Храме смягчится на ступень."
