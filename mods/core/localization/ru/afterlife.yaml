# Смена правителя и посмертие.
modifier:
  ash_curse: Пепел забирает своё
opinion_modifier:
  humbled_by_liege: Усмирён новым государем
karma_deed:
  ash_inherited: Пепел на роду
msg:
  relics_of_saint: "Предшественник ушёл к Солнцу праведником: его мощи легли в реликварий, а слава — на весь род."
ev:
  succession.0010:
    t: Тень на троне
    desc: "[scope:predecessor.first_name] правил страхом. Темницы полны, при дворе говорят вполголоса и косятся на вас: каким будет новое правление? Тень прежнего государя ещё стоит за троном — решайте, оставить ли её там."
    a: Держать в узде
    b: Распахнуть темницы
  succession.0011:
    t: Проверка нового государя
    desc: "[scope:challenger] не явился на присягу, а гонцу ответил: «Пусть сперва докажет, что рука у него не слабее отцовской». Двор ждёт, что вы сделаете."
    a: Призвать к ответу
    b: Выйти на поединок
    c: Уступить ради мира
  afterlife.0003:
    t: Пепел забирает своё
    desc: "Прах [scope:predecessor.first_name] не принял ни огонь, ни земля. С той ночи на род легло проклятие: дети рождаются слабыми, свечи в часовне гаснут сами, а в каждом очаге кто-то шепчет ваши имена. Пепел забирает своё — и не скоро насытится."
    a: Что же он наделал…
