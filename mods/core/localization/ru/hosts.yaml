regiment_type_desc:
  sun_guard: Латники Храма; не отступают, пока видят солнечное знамя.
  ash_reavers: Те, кого коснулся Пепел; рубят без страха и без жалости.
  kin_sworn: Родня и побратимы вождя; встанут стеной вокруг своего.
  wood_stalkers: Стрелки лесных троп; бьют из-за деревьев и растворяются в чаще.
  wolf_brothers: Воины Зимнего Волка; гонят бегущих, как волки гонят оленя.
