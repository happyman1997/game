# Воинства — специализации войска.
army_specialization:
  sun_host: Воинство Солнца
  ash_host: Пепельное воинство
  kin_host: Родовая дружина
  forest_host: Лесное войско
  wolf_pack: Стая
army_specialization_desc:
  sun_host: "Войско, что идёт под солнечным знаменем со жрецом впереди. Пока при войске светоч, ополчение не бежит; еретиков и продавшихся Пеплу оно бьёт злее. С единоверцами не воюет — такая война гасит его огонь."
  ash_host: "Войско, которому шепчет Пепел. Ополчение врага бежит от одного его вида, но воинству нужна кровь: без побед оно тает с каждым месяцем."
  kin_host: "Дружина из родни и присягнувших роду. Пока она стоит, вождь не гибнет и не попадает в плен. Своих выкупают: родич в чужой темнице — позор дружине; без рыцарей своей крови она слабеет."
  forest_host: "Войско лесных троп. В чаще оно бьёт из засад и уходит без погони. Лес не рубить: каждый сведённый участок бьёт по его духу."
  wolf_pack: "Стая Зимнего Волка. Вожак ведёт её доблестью и гонит бегущих без пощады; в лесу и на высотах стая бьёт из засад. Вожак должен быть сильнейшим — иначе стая уходит."
