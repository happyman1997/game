dynasty_legacy_desc:
  erudition_2: "Дети рода учатся на четверть быстрее."
  kin_1: "Члены рода лучше относятся друг к другу."
  kin_2: "Члены рода больше уважают главу, а слава главы растёт."
  kin_3: "Родная кровь держится вместе: члены рода ещё теплее друг к другу."

