# Детство, воспитание, регентство и династия.
trait:
  rowdy: Буйный
  charming: Обаятельный
  curious: Любознательный
  pensive: Задумчивый
  bossy: Властный
trait_desc:
  rowdy: "Ребёнок, который не сидит на месте: дерётся с пажами и лезет на стены. Склонность к воинскому делу; вырастет храбрецом — или драчуном."
  charming: "Улыбка этого ребёнка обезоруживает даже стражу. Склонность к дипломатии; вырастет общительным и щедрым — или ветреным."
  curious: "Ребёнок, задающий вопросы, на которые не знают ответа даже монахи. Склонность к учёности; вырастет усердным — или циником."
  pensive: "Тихий ребёнок, который всё видит и всё запоминает. Склонность к интригам; вырастет спокойным — или подозрительным."
  bossy: "Ребёнок, который командует даже старшими. Склонность к управлению; вырастет честолюбивым и справедливым — или высокомерным."

opinion_modifier:
  my_guardian: Мой опекун
  my_ward: Мой воспитанник
  removed_as_guardian: Отстранён от воспитания
  dismissed_regent: Отставлен от регентства
  regent_thanked: Благодарность за регентство
  regent_shamed: Опозорен отчётом о казне
  disinherited_me: Лишил меня наследства
  restored_my_rights: Вернул мне права наследника
  demanded_tribute: Взыскал с меня золото
  honored_by_head: Почести от главы рода

interaction:
  choose_guardian: Назначить опекуна
  appoint_regent: Назначить регентом
  disinherit: Лишить наследства
  restore_inheritance: Вернуть права наследника
  demand_family_tribute: Взыскать на нужды рода
  honor_kin: Воздать почести родичу
interaction_desc:
  choose_guardian: "Опекун учит ребёнка своему ремеслу: чем выше его навык в направлении воспитания, тем лучше будет образование. Ребёнок может перенять и черты характера опекуна."
  appoint_regent: "Пока вы малы, державой правит регент. Его навыки дают державе мнение вассалов, налог и ополчение — но честолюбивый регент может запустить руку в казну."
  disinherit: "Глава рода вычёркивает родича из всех линий наследования. Тот этого не простит."
  restore_inheritance: "Глава рода возвращает родичу права наследника."
  demand_family_tribute: "Глава рода взыскивает с родича-правителя треть казны (не больше 150) на нужды рода."
  honor_kin: "Глава рода воздаёт родичу почести: он получает престиж и благодарен главе."

decision:
  found_cadet_house: Основать младшую ветвь
decision_desc:
  found_cadet_house: "Вы — не старший в роду, но достаточно знатны, чтобы основать свой дом: со своим именем и гербом. Вы и ваши потомки станете младшей ветвью рода, известность и наследия рода останутся общими."

