ev:
  upbringing.0001:
    t: Успехи воспитанника
    desc: "Опекун [scope:child] докладывает: ребёнок старается, но мог бы больше. Мальчишки и девчонки при дворе тянутся к тому, кто ими занимается."
    a: Похвалить
    b: Нанять наставников (−40 золота)
    c: Заниматься с ребёнком самому
  upbringing.0002:
    t: Суровый опекун
    desc: "[scope:child] прибегает к вам в слезах: опекун снова поднял на него руку. Опекун уверяет, что строгость — лучший учитель."
    a: Сменить опекуна
    b: Строгость закаляет
  upbringing.0003:
    t: Детская проказа
    desc: "[scope:child] устроил при дворе переполох: перепуганная курица в покоях епископа и разбитый кувшин с вином. Двор ждёт, что вы скажете."
    a: Наказать
    b: Посмеяться вместе со всеми
  regency.0001:
    t: Конец регентства
    desc: "Вы выросли, и [scope:regent] слагает с себя регентство. Все эти годы державой правили от вашего имени — теперь вы правите сами. Казначей, однако, просит взглянуть на счета."
    a: Поблагодарить регента (−50 золота)
    b: Потребовать отчёт о казне
    c: Проститься с почестями
