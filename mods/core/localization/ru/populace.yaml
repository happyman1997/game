ev:
  populace.0001:
    t: Крестьяне поднимаются
    desc: "Над деревнями вашего домена поднимается дым. [scope:faction_leader] собрал недовольных — тех, кого разорили войны и поборы, — и требует облегчить их долю. Откажете — крестьяне возьмутся за вилы."
    a: "Уступить: снизить подати на десять лет"
    b: "Разогнать сброд!"
    c: "Выйти к восставшим и говорить с ними"
  populace.0002:
    t: Земля просит своего государя
    desc: "Земли, что не разделяют ни вашей веры, ни вашей крови, отказываются вам служить. [scope:faction_leader] говорит от их имени: они хотят правителя из своих. Откажете — будет война."
    a: Отпустить эти земли
    b: Никогда!
    c: Убедить их остаться под вашей рукой
