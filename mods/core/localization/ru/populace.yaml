faction_desc:
  populist_faction: "Земли чужой веры или культуры хотят правителя своей крови. Бунтуют, только когда сильны; если победят — отделятся под властью своего вождя."
  peasant_faction: "Крестьяне, измученные войнами, завоеванием и поборами. Их недовольство растёт само; войско у них слабое, но каждое взятое графство даёт им людей."
