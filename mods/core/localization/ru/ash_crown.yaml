# Пепелище и Солнечный венец.
modifier:
  ash_blight: Пепельная порча
  ash_settlers: Поселенцы на пепелище
  ash_healed: Пепел отступил
  crown_trail: След венца
  ash_penance: Покаяние перед Стражами
opinion_modifier:
  restored_the_empire: Возродил империю
  seeks_the_cursed_crown: Ищет проклятый венец
  gave_crown_to_order: Отдал венец Стражам
artifact:
  sun_crown: Солнечный венец
  otgar_sword: Меч Отгара
  imperial_seal: Печать империи
  sun_banner: Солнечное знамя
artifact_desc:
  sun_crown: "Корона, которую цверги выковали для самого Императора-Солнца; в ней горит его огонь. Пропала в пепле Зонненштадта в ночь, когда пал Князь Пепла. Кто её носит, тому верны вассалы и поклоняется слава. Но венец жжёт — покоя его владельцу нет."
  otgar_sword: "Меч, которым Отгар сражался до последнего дня. Огонь не тронул клинка."
  imperial_seal: "Печать, которой скреплялись указы империи. Её оттиск и сегодня открывает двери."
  sun_banner: "Под этим знаменем ходили имперские рыцари. Золото выцвело, но солнце видно издалека."
decision:
  ash_expedition: Поход в пепелище
  settle_ashlands: Заселить пепелище
  restore_sun_empire: Возродить Солнечную империю
  give_crown_to_order: Отдать венец Стражам Пепла
decision_desc:
  ash_expedition: "Снарядить отряд в мёртвое сердце империи, где в ночь пожара пал Князь Пепла. Пепельные бури — его дыхание — губят людей, но в руинах лежат сокровища, реликвии Отгара — и где-то там Солнечный венец. Три верных следа приведут к венцу; найденный след переходит к наследнику. Стражи Пепла пять лет будут считать вас искателем венца."
  settle_ashlands: "Отправить поселенцев на ничейную землю у границы. Графство станет вашим, но пока на нём пепельная порча, проку от него мало. Сожжённый дворец Зонненштадта прославит того, кто его держит."
  restore_sun_empire: "Надеть Солнечный венец в отстроенном Зонненштадте и провозгласить империю. Пепел отступит от сердца империи, Князь Пепла — во тьму, а земли марок по праву станут вашими."
  give_crown_to_order: "Передать венец Стражам Пепла: братья вернут его пеплу. Проклятию — конец, вам — благочестие и дружба ордена."
casus_belli:
  crown_war: Война за венец
  ash_crusade: Кара Стражей Пепла
casus_belli_desc:
  crown_war: Отнять Солнечный венец у того, кто его держит. Победа отдаёт вам венец.
  ash_crusade: "Орден карает искателей проклятого венца: победа возвращает венец пеплу, а побеждённый платит за покаяние."
cb:
  crown_war:
    war_name: "Война [scope:attacker] за Солнечный венец"
  ash_crusade:
    war_name: "Кара Стражей Пепла над [scope:defender]"
ev:
  ash.0001:
    t: Поход в пепелище
    desc: "Отряд готов: проводники, вьючные мулы, повозки с водой — в пепле нет ни ручья, ни травы. Остался вопрос: кто поведёт людей туда, где полвека назад сгорела империя?"
    a: Поведу сам
    b: Пошлю лучшего из рыцарей
  ash.0002:
    t: Поход вернулся
    desc: "Через четыре месяца отряд вернулся — поредевший, серый от пепла с головы до ног. Люди молчат, пока не выпьют вина; потом начинают говорить."
    a: Что вы нашли?
  ash.0003:
    t: Реликвия Отгара
    desc: "Под обрушенными сводами сгоревшего дворца, в слое спёкшегося пепла, люди нашли то, что принадлежало последнему императору."
    a: Отныне это наше
  ash.0004:
    t: След венца
    desc: "Старик, что жил у края пепелища ещё при Отгаре, рассказал вашим людям, куда несли венец в ночь пожара. Это не сам венец — но это след."
    a: Мы идём по верному пути
  ash.0005:
    t: Солнечный венец!
    desc: "В подземелье под тронным залом Зонненштадта, в сундуке, оплавленном огнём, лежал он — Солнечный венец. Золото холодно на ощупь, но у того, кто держит его, горят ладони. Весть разнесётся по маркам за неделю. Стражи Пепла придут за ним."
    a: Венец — мой. Империя возродится
    b: Вернуть его пеплу. Проклятию конец
  ash.0020:
    t: Солнце над Зонненштадтом
    desc: "Пятьдесят лет пепел лежал на сердце империи. Сегодня в отстроенном соборе Зонненштадта вы надели Солнечный венец — и, говорят, в тот же день над пепелищем пошёл дождь. Марки снова едины — по праву. Осталось сделать их едиными на деле."
    a: Да здравствует империя!
