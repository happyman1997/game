council_position:
  chancellor: Канцлер
  steward: Казначей
  marshal: Маршал
  spymaster: Тайный советник
  court_chaplain: Духовник
council_position_desc:
  chancellor: Ведает делами державы и сношениями с иноземными дворами. Важна дипломатия.
  steward: Распоряжается казной и хозяйством домена. Важно управление.
  marshal: Командует войском и собирает ополчение. Важно военное дело.
  spymaster: Следит за заговорами и добывает нужные бумаги. Важны интриги.
  court_chaplain: Духовный наставник правителя и покровитель учёности. Важна учёность.
council_task:
  domestic_affairs: Дела державы
  foreign_affairs: Внешние сношения
  collect_taxes: Сбор податей
  develop_domain: Развитие домена
  organize_levies: Сбор ополчения
  train_commanders: Обучение полководцев
  disrupt_schemes: Раскрытие заговоров
  fabricate_claims: Поиск претензий
  spiritual_guidance: Духовное наставничество
  promote_learning: Покровительство наукам
council_task_desc:
  domestic_affairs: Канцлер улаживает споры вассалов — они лучше относятся к правителю.
  foreign_affairs: Канцлер поддерживает связи с иноземными дворами — растёт престиж.
  collect_taxes: Казначей следит, чтобы подати собирались исправно.
  develop_domain: Казначей вкладывает средства в отсталые провинции домена — иногда растёт развитие.
  organize_levies: Маршал муштрует и пересчитывает ополчение — его становится больше.
  train_commanders: Маршал учит полководцев — армия сражается лучше.
  disrupt_schemes: Тайный советник защищает правителя и иногда раскрывает заговоры против его семьи.
  fabricate_claims: Тайный советник ищет в архивах соседей документы, дающие претензии на их графства.
  spiritual_guidance: Духовник наставляет правителя — растёт благочестие.
  promote_learning: Духовник покровительствует учёным — быстрее растёт опыт образа жизни и развитие земель.
opinion_modifier:
  dismissed_from_council: Изгнан из совета
msg:
  spymaster_claim: "Тайный советник раздобыл документы: у вас новая претензия на [scope:claim_target]!"
