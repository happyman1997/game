ev:
  duel.0001:
    t: Перчатка на пиру
    desc: "Посреди пира [scope:challenger.name] встаёт с кубком в руке и при всех называет вас трусом, что прячется за чужими мечами. Перчатка падает на стол. Зал затих: все ждут вашего ответа."
    a: Принять вызов и выйти самому
    b: Выставить поборника
    c: Ночью подрезать ремни его доспеха
    d: Высмеять наглеца — правитель не дерётся с вассалами
  duel.0002:
    t: Зверь у стен
    desc: "Из [scope:province.name] идут дурные вести: зверь-людоед режет скот и людей, крестьяне боятся выходить в поле. Старосты просят защиты у господина."
    a: Выйти на зверя самому
    b: Послать лучшего из рыцарей
    c: Назначить награду охотникам (50 золота)
    d: Пусть управятся сами
