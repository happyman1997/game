# Жизнь державы (events/realm.yaml).
opinion_modifier:
  widows_cared: Позаботился о вдовах
  widows_forgotten: Забыл о вдовах павших
  harsh_collectors: Лютые сборщики
  fair_market: Ярмарка без пошлин
  merciful_release: Отпустил из темницы
  legate_appeased: Уважил легата
  legate_insulted: Выгнал легата
  welcomed_kin: Принял родича ко двору
  turned_away_kin: Отказал родичу
  hook_redeemed: Позволил выкупить тайну
  redemption_refused: Не дал выкупить тайну
ev:
  realm.0001:
    t: Купцы просят ссуду
    desc: "Купеческая гильдия снаряжает караван за море и просит у казны сто золотых. Вернут с лихвой, клянутся они, — если море будет милостиво."
    a: Ссудить сто золотых
    b: Казна не меняльная лавка
  realm.0002:
    t: Караван вернулся
    desc: "Купцы вернулись с прибылью и, как обещали, приносят в казну долг — и сверх того."
    a: Добрая сделка
  realm.0003:
    t: Караван не вернулся
    desc: "Шторм или разбойники — кто знает. Гильдия разорена и может отдать лишь малую часть долга."
    a: Что ж, это море
  realm.0004:
    t: Сборщики лютуют
    desc: "Из [scope:province] приходят жалобы: ваши сборщики выгребают последнее, а кто не платит — тех бьют батогами. Тяжкие подати исполняют слишком усердно."
    a: Наказать сборщиков и вернуть часть взятого
    b: Подати есть подати
    c: Вернуть обычные подати по всему домену
  realm.0005:
    t: Вдовы павших
    desc: "После проигранной битвы в ваш замок приходят вдовы: мужья не вернулись с поля, детей кормить нечем."
    a: Назначить вдовам пенсию
    b: Война есть война
  realm.0006:
    t: Пленник просит милости
    desc: "[scope:captive] просит о встрече и, едва не плача, клянётся: отпустите — и вы не пожалеете, а долг будет помнить всю жизнь."
    a: Отпустить под клятву
    b: Пусть сидит
  realm.0007:
    t: Выкуп тайны
    desc: "[scope:debtor] приходит с кошелем: то, что вам известно, не должно всплыть никогда. Сколько стоит забыть?"
    a: Продать молчание
    b: Тайна дороже золота
  realm.0008:
    t: Ярмарка
    desc: "В [scope:province] открывается ярмарка: съехались купцы из соседних земель, а пошлины сулят хорошую выручку."
    a: Взять пошлину
    b: Ярмарка без пошлин — пусть помнят
  realm.0009:
    t: Легат Храма
    desc: "Легат Великого Светоча прибыл с письмом: королевская десятина — грабёж Храма, и Светоч ждёт, что вы одумаетесь."
    a: Одарить легата (60 золотых)
    b: Выставить легата за ворота
    c: Вернуть Храму десятину
  realm.0010:
    t: Родич просит места
    desc: "[scope:kin] из вашего рода остался без крова и куска хлеба и просит места при вашем дворе."
    a: Принять ко двору
    b: Дать денег на дорогу
    c: Отказать
  realm.0011:
    t: Каменщики просят надбавки
    desc: "Старшина каменщиков в столице просит надбавки: работа тяжёлая, а за соседней стеной платят больше. Не дадите — артель уйдёт на месяц."
    a: Дать надбавку (стройка пойдёт быстрее)
    b: Отказать
