decision:
  coronation: Коронация
  confession: Исповедь
  send_missionaries: Отправить миссионеров
decision_desc:
  coronation: "Церковь помажет вас на царство: власть, освящённая Богом, — навсегда. Подданные уважают коронованного государя, а вассалы запомнят торжество."
  confession: Облегчить душу на исповеди. Благочестие идёт в уплату за покой.
  send_missionaries: Монахи и священники отправятся в графство вашего домена, не разделяющее вашу веру, и обратят его.
council_task:
  convert_faith: Обращение
  integrate_culture: Слияние культур
council_task_desc:
  convert_faith: Духовник проповедует в графствах домена чужой веры — со временем они принимают веру правителя.
  integrate_culture: Канцлер прививает графствам домена обычаи и язык правителя — со временем они перенимают его культуру.
modifier:
  crowned: Помазанник
opinion_modifier:
  witnessed_coronation: Был на коронации
  forced_out_of_faction: Принудил выйти из фракции
interaction:
  demand_leave_faction: Потребовать выйти из фракции
interaction_desc:
  demand_leave_faction: "Потребовать от вассала порвать с заговорщиками. Согласится тот, кто любит или боится вас, — или тот, на кого у вас есть крюк."
