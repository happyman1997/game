ev:
  faction.0001:
    c: "Сесть с мятежниками за стол переговоров"
  skills.0001:
    t: Ревизия
    desc: "Сверяя счета казны, вы находите недостачу — и след ведёт к [scope:embezzler]. Монеты уходили понемногу, но уходили годами."
    a: "Разоблачить вора и вернуть деньги"
    b: "Промолчать — пусть вернёт часть и знает, что я всё знаю"
    c: "Пересчитать всё до гроша"
opinion_modifier:
  bested_in_duel: Одолел меня в поединке
  rumors_about_liege: Дурные слухи о сюзерене
  slandered_me: Распускал обо мне слухи
  heard_out: Выслушал нас
interaction:
  spread_rumor: Пустить слух
  challenge_to_duel: Вызвать на поединок
interaction_desc:
  spread_rumor: "Пустить при дворе слушок о правителе. Удача — он теряет престиж, а его вассалы охладевают к нему (на руку фракциям). Неудача — вас поймают за руку. Шанс — от вашей интриги против его интриги."
  challenge_to_duel: "Вызвать на бой один на один. Шанс — от доблести бойцов; за правителей может биться поборник — лучший из их рыцарей. Победителю — престиж и страх, проигравшему — рана или смерть. Отказ стоит престижа."
msg:
  plotter_turned: "Перевербовка: [scope:plotter] теперь у вас на крючке — раскрытый заговорщик будет служить вам."
  rumor_spread: "Слух пущен: о [scope:recipient] шепчутся при всех дворах."
  rumor_about_you: "О вас ходят дурные слухи — вассалы косятся на вас."
  rumor_caught: "Вас поймали на распространении слухов о [scope:recipient]."
  rumor_caught_you: "[scope:actor] распускал(а) о вас слухи — но правда всплыла."
  duel_refused: "[scope:recipient] отказывается от поединка — и теряет лицо."
