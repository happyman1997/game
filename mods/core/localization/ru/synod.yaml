# Собор (data/common/synod.yaml, events/synod.yaml).
interaction:
  synod_sway_for: Склонить голос «за» на Соборе
  synod_sway_against: Склонить голос «против» на Соборе
interaction_desc:
  synod_sway_for: "Золото, дружба или крюк — и этот правитель проголосует на Соборе «за». Чем весомее его голос, тем дороже он стоит."
  synod_sway_against: "Золото, дружба или крюк — и этот правитель проголосует на Соборе «против». Чем весомее его голос, тем дороже он стоит."
opinion_modifier:
  broke_the_peace: Нарушил Божий мир
msg:
  broke_the_peace: "Вы нарушили Божий мир: напали на единоверца. Храм этого не простит."
  synod_sway_refused: "Правитель не стал менять свой голос на Соборе."
ev:
  synod.0002:
    t: Собор созван
    desc: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор в Реймсе. Через год правители веры решат великий вопрос — а пока каждый ищет союзников."
    desc_anathema: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор и спросит его, предать ли анафеме [scope:synod_faith_ruler.faith_name]. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_reconcile: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор и спросит его, принять ли [scope:synod_faith_ruler.faith_name] обратно в Свет. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_peace: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы объявить Божий мир — десять лет без войн между единоверцами. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_tithe: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор и попросит десятину — двадцать лет доли податей Храму. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_tyrant: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы отлучить [scope:synod_target] из Света. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_canonize: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы объявить святым [scope:synod_target.name]. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_crusade: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы позвать верных в священный поход на [scope:synod_faith_ruler.faith_name]. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_tithe_condemn: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы осудить [scope:synod_target] за королевскую десятину. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_fields: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы освятить нивы верных. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    desc_duels: "Гонцы Храма Солнца разносят весть: [scope:synod_head] созывает Собор, чтобы запретить поединки. Через год правители веры проголосуют. Ваши вассалы ждут, что скажет их господин."
    a: "Объявить: я — «за»"
    b: "Объявить: я — «против»"
    c: Промолчать до Собора
  synod.0001:
    t: Собор в Реймсе
    desc: "Жрецы-светочи зажгли тысячу свечей под сводами Храма Солнца. [scope:synod_head] открывает Собор, и правители веры ждут вашего слова."
    desc_anathema: "Под сводами Храма Солнца [scope:synod_head] ставит вопрос: предать ли анафеме [scope:synod_faith_ruler.faith_name]. Если Собор согласится, двадцать лет его последователи будут еретиками — и на них пойдут священной войной."
    desc_reconcile: "Под сводами Храма Солнца [scope:synod_head] ставит вопрос: принять ли [scope:synod_faith_ruler.faith_name] обратно в Свет. Если Собор согласится, ересь будет снята и священные войны против его последователей прекратятся."
    desc_peace: "Под сводами Храма Солнца [scope:synod_head] предлагает Божий мир: десять лет война между единоверцами будет грехом перед Храмом. Священная война на еретиков останется дозволенной."
    desc_tithe: "Под сводами Храма Солнца [scope:synod_head] просит десятину: двадцать лет единоверцы будут отдавать Храму долю податей, а Храм — молиться за них. Казна станет легче, благочестие — прибудет."
    desc_tyrant: "Под сводами Храма Солнца [scope:synod_head] обличает [scope:synod_target]: кровь, ложь и страх — вот его правление. Отлучить ли его из Света решением всего Собора?"
    desc_canonize: "Под сводами Храма Солнца [scope:synod_head] вспоминает праведную жизнь [scope:synod_target.name]. Объявить ли праведника святым? Его роду — слава, его мощам — место в Храме."
    desc_crusade: "Под сводами Храма Солнца [scope:synod_head] зовёт верных в священный поход на [scope:synod_faith_ruler.faith_name]. Если Собор согласится, десять лет правители веры будут охотнее поднимать мечи на еретиков, а благочестие верных прибудет."
    desc_tithe_condemn: "Под сводами Храма Солнца [scope:synod_head] обличает [scope:synod_target]: корона забирает десятину Храма. Если Собор согласится, [scope:synod_target] придётся вернуть Храму его права — и замолить грех."
    desc_fields: "Под сводами Храма Солнца [scope:synod_head] предлагает освятить нивы: десять лет жрецы будут благословлять поля верных, и земли станут богатеть быстрее."
    desc_duels: "Под сводами Храма Солнца [scope:synod_head] предлагает запретить поединки: «Божий суд» — гордыня, а не вера. Если Собор согласится, пятнадцать лет за победу в поединке будет вдвое меньше славы, а вызвавший согрешит."
    a: Голосовать «за»
    b: Голосовать «против»
    c: Воздержаться
