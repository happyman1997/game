# Поручения (missions.yaml) и события в пути (events/missions.yaml)
mission:
  embassy: Посольство
  foreign_service: Служба при чужом дворе
  glory_wandering: Странствие за славой
  pilgrimage: Паломничество
  preaching: Проповедь
  recall: Отозвать с поручения
mission_desc:
  embassy: "Отправить посла ко двору правителя. Речистый посол от славного господина добьётся доброй воли; неловкий — обиды. При чужом дворе послу могут предложить золото за ваши тайны — или открыть чужую."
  foreign_service: "Два года службы при дворе славного правителя: молодой человек научится тому, в чём силён хозяин, и вернётся другом чужого дома. Может там и влюбиться — или ввязаться в ссору."
  glory_wandering: "Полтора года на дорогах: поединки на чужих ристалищах, разбойники, звери в чащах. Храбрый вернётся с именем и добрым клинком — или раненым, или не вернётся вовсе."
  pilgrimage: "Молиться у святынь за вас и ваш дом: благочестие вам и паломнику, а то и мощи для двора. Дорога долгая — можно и заболеть."
  preaching: "Учёный единоверец идёт проповедовать в графство чужой веры. Удача — графство обратится; провал — проповедника прогонят, а то и убьют."
  recall: "Вернуть человека домой сейчас: поручение прервётся без исхода."
check:
  patron_prestige: Слава покровителя
  host_opinion: Мнение хозяина о покровителе
  other_faith: Чужая вера
  patron_piety: Благочестие покровителя
  won_dispute: Победил в споре
  lost_dispute: Проиграл спор
ai:
  adventurous: Тянет в мир
  homebody: Домосед
opinion_modifier:
  embassy_goodwill: Добрая воля посольства
  embassy_courtesy: Учтивое посольство
  embassy_insult: Неудачное посольство
  served_at_court: Служил при моём дворе
  served_poorly: Дурно служил
  let_go_wandering: Отпустил за славой
  forbade_wandering: Не пустил в мир
  preached_to: Слушали проповедника
msg:
  ran_off_wandering: "[scope:agent.name] не послушался и ушёл искать славы без вашего благословения."
ev:
  mission.0001:
    t: Золото чужого двора
    desc: "Ваш посол [scope:agent.name] пишет: при дворе [scope:target.name] ему тайком предложили кошель золота — за ваши тайны."
    a: Пусть возьмёт золото и кормит их ложью
    b: Пусть откажет — честь дороже серебра
    c: Отозвать посла, пока не поздно
  mission.0002:
    t: Тайна чужого двора
    desc: "[scope:agent.name] прослышал при дворе [scope:target.name] то, о чём там говорят лишь шёпотом."
    a: Записать и привезти домой
    b: Не марать посольство чужими тайнами
  mission.0003:
    t: Ссора при чужом дворе
    desc: "[scope:agent.name] повздорил при дворе [scope:target.name] с [scope:rival.name]. Тот бросил перчатку."
    a: Пусть ответит поединком
    b: Пусть стерпит — служба важнее
  mission.0004:
    t: Любовь на чужбине
    desc: "[scope:agent.name] пишет, что сердце отдано [scope:beloved.name] при дворе [scope:target.name], и просит вашего благословения."
    a: Благословить брак
    b: Запретить — не для того отправляли
  mission.0005:
    t: Учитель при чужом дворе
    desc: "Учёный муж при чужом дворе готов учить [scope:agent.name] — за пятьдесят золотых."
    a: Заплатить за науку
    b: Обойдётся
  mission.0006:
    t: Рыцарь у моста
    desc: "Чужой рыцарь встал на мосту и не пускает [scope:agent.name] дальше без поединка."
    a: Принять вызов
    b: Заплатить за проезд
  mission.0007:
    t: Разбойники на дороге
    desc: "На лесной дороге на [scope:agent.name] и его спутников напали разбойники."
    a: Биться
    b: Бежать — не позор, а здравый смысл
  mission.0008:
    t: Зверь в чаще
    desc: "Крестьяне умоляют [scope:agent.name] избавить их от зверя, что режет скот и людей."
    a: Выследить зверя
    b: Пройти мимо
  mission.0009:
    t: Святой отшельник
    desc: "На пути [scope:agent.name] встретил отшельника, о чьей святости говорят по всей округе. Старец благословил паломника — и вас заочно."
    a: Да будет так
  mission.0010:
    t: Мощи на продажу
    desc: "У святых ворот [scope:agent.name] предлагают мощи — за сто золотых. Святыня или подделка — решит его учёность."
    a: Купить
    b: Отказаться
  mission.0011:
    t: Спор с местным жрецом
    desc: "Местный жрец вызвал [scope:agent.name] на спор перед всем графством."
    a: Принять спор
    b: Уклониться — проповедь пойдёт тише
  mission.0020:
    t: Сын просится в мир
    desc: "[scope:agent.name] просит отпустить его: двор тесен, а слава — там, за рекой."
    a: Ступай за славой
    b: Послужи сперва при дворе [scope:court.name]
    c: Твоё место здесь
