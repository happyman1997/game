interaction_desc:
  imprison: Бросить персонажа в темницу. Без законного повода (раскрытого заговора, мятежа) это тирания — вассалы будут недовольны, а владетельный вассал может успеть бежать.
  release_prisoner: Отпустить пленника на свободу. Он будет благодарен.
  execute_prisoner: Казнить пленника. Родня не простит, а без законного повода это тяжкая тирания.
  demand_ransom: Предложить семье или сюзерену пленника выкупить его.
