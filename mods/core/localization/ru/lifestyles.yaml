perk_desc:
  regal_bearing: "Слава правителя весит больше: уровни престижа поднимают мнение подданных в полтора раза сильнее. Государь слушает народ: ходоки и прошения не робеют даже при опасении, а выслушанные ходоки приносят престиж."
  court_etiquette: "Пир обходится вдвое дешевле и прибавляет 50 славы. Пиры вам по душе — снимают стресс."
  statesman: "Соседи охотнее идут к вам в вассалы: +10 к согласию за каждый уровень вашей славы."
  august_majesty: "Королевский объезд удаётся куда чаще и вдвое дешевле. Ключ к «Золотому веку»."
  fecund_line: "Каждый ваш ребёнок прибавляет роду 25 известности."
  blood_ties: "Наследия рода стоят на четверть меньше, пока вы глава рода. Родня относится к вам теплее. Ключ к «Созвать родню»."
  wise_mentor: "Подопечные под вашей опекой учатся в полтора раза быстрее. Ключ к «Созвать родню»."
  head_of_house: "Род получает 100 известности, а «Созвать родню» гремит вдвое громче."
  logistics: "Ваши армии теряют вдвое меньше людей от истощения в диких и выжженных землях."
  take_alive: "После победы в битве с шансом 35% в плен попадает рыцарь врага — его можно выкупить или держать в темнице. Ключ к «Военный смотр»."
  military_drills: "Профессиональные отряды сильнее и дешевле в содержании. Ключ к «Военный смотр»."
  master_strategist: "«Военный смотр» держится три года вместо двух."
  stern_gaze: "Страх перед вами тает вдвое медленнее и копится быстрее."
  bloody_justice: "Казнь внушает на 15 страха больше. Казни и заточения вам по душе — снимают стресс. Ключ к «Показательная казнь»."
  dungeon_dread: "Каждый пленник в вашей темнице внушает 1 страх в месяц (до пяти), но лишь до ужаса — террор куют казни. Отпускать пленников вам претит."
  iron_fist: "Запугивание действует сильнее, а показательная казнь внушает ещё больше страха."
  knightly_vow: "Отказ от вашего вызова на поединок — позор вдвойне. Вызывать на поединок вам по душе."
  trophy_taker: "Победив в поединке, вы забираете оружие побеждённого (он затаит притязание). Победа в битве с шансом 20% приносит трофейный щит. Ключ к «Поход за славой»."
  sword_brotherhood: "Ещё два места для рыцарей, и рыцари бьются лучше. Ключ к «Поход за славой»."
  paragon_of_chivalry: "«Поход за славой» — без затрат."
  master_builder: "Постройки дешевле, а каждая завершённая постройка поднимает мнение графства на 10 (5 лет)."
  thriving_lands: "Развитие растёт быстрее, а контроль над графствами восстанавливается скорее. Ключ к «Великая стройка»."
  court_splendor: "Заказ вещей дешевле на 40%, а мастера охотнее берутся за редкую работу."
  royal_architect: "«Великая стройка» обходится на 40% дешевле."
  efficient_rule: "Можно держать в домене на одно графство больше."
  tax_collectors: "Подати выше, а казнокрады в совете попадаются чаще."
  lombard_loan: "Заём у менял — на обычных условиях: по 2,5 золота в месяц двенадцать лет вместо 3,5."
  great_administrator: "Подкуп удаётся куда чаще, а заём у менял — на льготных условиях."
  subtle_hand: "Каждый год вы узнаёте чью-нибудь тайну в своей державе."
  prying_eyes: "Каждый крюк приносит 0,5 золота в месяц. Шантаж вам по душе. Ключ к «Заставить служить»."
  secret_trade: "Тайны продаются почти вдвое дороже."
  master_schemer: "Черта «Паук»: интриги сильнее."
  alluring: "Соблазнение удаётся на 15% чаще и идёт в полтора раза быстрее."
  pillow_talk: "Покорённый любовник выдаёт свою тайну и тайну своего сюзерена. Ключ к «Сердечный союз»."
  heartbreaker: "Каждый покорённый любовник у вас на крючке. Соблазнять вам по душе. Ключ к «Сердечный союз»."
  irresistible: "Черта «Соблазнитель»: очарование и плодовитость."
  avid_reader: "Каждое деяние (победа, постройка, поединок…) приносит 25 опыта текущего образа жизни."
  natural_philosophy: "Развитие растёт быстрее, опыт образа жизни копится скорее. Ключ к «Великий труд»."
  polymath: "+1 к дипломатии, военному делу, управлению и интригам."
  renowned_scholar: "«Великий труд» всегда блистательной редкости."
  devout_prayer: "Паломничество смывает весь стресс и с шансом 35% приносит реликварий. Паломничества и милостыня вам по душе."
  inner_peace: "Стресс копится медленнее, а уровни благочестия поднимают мнение единоверцев в полтора раза сильнее. Ключ к «Чудо»."
  relic_keeper: "Реликварий при дворе каждый год даёт 60 благочестия и почитание единоверных вассалов. Казни вам претят."
  doctor_of_theology: "Чудо дешевле, а воззвание к священной войне держится четыре года."
  peacemaker: "Ссоры ваших вассалов между собой тают быстрее, а ваше посредничество в чужих войнах принимают охотнее (+25)."
  unifier: "Побеждённые вами не держат зла (+25 к мнению на 10 лет) и охотнее идут к вам в вассалы. Вассалы шлют больше войск."
  kin_council: "Родичи охотнее заключают с вами союзы (+25) и браки (+20). Родня думает о вас теплее."
  worthy_heir: "Ваш наследник получит «Наследие предка»: на двадцать лет — слава, уважение вассалов и рыцари доблестнее."
  ambush: "На своей земле ваше войско сильнее, а разбитый враг теряет больше при отступлении."
  quartermaster: "Добыча вдвое больше, наёмники вдвое дешевле, войско дешевле содержать."
  scourge: "Каждая победа в битве внушает ужас (+3 страха), а враг сдаётся раньше. Люди вас ненавидят."
  menace: "Запугивание действует сильнее (+20 к согласию), страх копится быстрее."
  champion: "Победы в поединках вдвое славнее."
  warrior_king: "Вы сами бьётесь в рядах своих рыцарей — и рискуете, как они. Рыцари сражаются лучше."
  fortifier: "Крепости вашего домена на уровень крепче. Ключ к «Великая стройка»."
  castellan: "Ваша столица держит осаду вдвое дольше, стройки дешевле."
  reformer: "Законы державы меняются вдвое дешевле, не обижают вассалов, а их недовольство реформам не помеха."
  golden_hand: "Ваши подарки вдвое действеннее, торговый договор с вами заключают охотнее (+20). Вассалы платят чуть больше."
  gray_eminence: "Раскрытую интригу валят на кого-то из придворных. Раздор сеется удачнее — и без тайного советника. Ключ к «Заставить служить»."
  night_blade: "Ваши убийцы вдвое быстрее, а против вас самого убийцам вдвое труднее."
  courtly_love: "Двор очарован: о вашей любви поют, а не шепчутся."
  honey_trap: "Интриги удаются чаще: путь к тайнам лежит через спальню."
  archivist: "Каждый год в архивах всплывает чья-то тайна из соседей, а права на земли в старых грамотах находятся почти наверняка. Ключ к «Великий труд»."
  engineer: "Осадные машины и расчёт: чужие стены падают быстрее, свои стройки дешевле."
  holy_warrior: "Победа в битве над иноверцем или еретиком угодна Солнцу (+30 благочестия). Вы чаще выживаете в бою. Ключ к «Воззвание к священной войне»."
  sun_sword: "Священная война вдвое дешевле, рыцари бьются лучше."

