perk_tree_desc:
  august: "Правит славой: пиры, объезды владений, соседи сами просятся под руку."
  family_first: "Опора — род: дети прибавляют известности, наследия дешевле, родня несёт дары."
  strategist: "Война манёвром: обозы без потерь, пленные рыцари на выкуп, военный смотр."
  tyranny: "Правит страхом: казни и темница пугают, вассалов можно запугать и обобрать."
  chivalry: "Личная доблесть: поединки, трофеи, рыцарское братство и поход за славой."
  architect: "Стройки и великолепие: графства радуются новым стенам, мастера — заказам."
  administrator: "Золото как оружие: подати, ломбардский заём и подкуп."
  schemer: "Тайны и крюки: уши повсюду, серебро за молчание, тайны на продажу."
  seducer: "Любовь как оружие: постельные тайны, любовники на крючке, сердечный союз."
  scholarship: "Знание ускоряет всё: опыт за каждое деяние, пути открываются раньше."
  theology: "Благочестие и мощи: паломничества, почитание реликвий, чудеса и священная война."

