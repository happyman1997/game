perk_tree_desc:
  august: "Правит славой: пиры и объезды — или мир, который он приносит, и побеждённые, что идут под руку."
  family_first: "Опора — род: дети прибавляют известности, наследия дешевле, родня — союзники; наставник растит достойного наследника."
  strategist: "Война манёвром: обозы, пленные рыцари, засады — или ветераны, добыча и наёмники."
  tyranny: "Правит страхом: казни и победы, от которых враг сдаётся, — или темница и угроза."
  chivalry: "Личная доблесть: поединки и трофеи — или братство рыцарей, где король бьётся в строю."
  architect: "Стройки и великолепие — или твердыни, о которые ломаются осады."
  administrator: "Золото как оружие: подати и реформы — или займы, щедрые дары и подкуп."
  schemer: "Тайны и крюки — или чужие руки: виноватый придворный и клинок в ночи."
  seducer: "Любовь как оружие: постельные тайны, любовники на крючке, сердечный союз."
  scholarship: "Знание ускоряет всё: опыт за каждое деяние, тайны из архивов, осадные машины."
  theology: "Благочестие и мощи — или меч веры: победы над иноверцами и дешёвая священная война."
