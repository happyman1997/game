focus_desc:
  focus_foreign_affairs: Переговоры с иноземными дворами оттачивают ваш дипломатический талант.
  focus_majesty: Вы держитесь как истинный монарх, и молва о вашем величии разносится далеко.
  focus_family: Вы посвящаете время супругу, детям и делам рода.
  focus_strategy: Вы изучаете труды древних полководцев и карты походов.
  focus_chivalry: Турниры, поединки и рыцарские обеты закаляют руку и дух.
  focus_authority: Вы держите вассалов и войско в железном кулаке.
  focus_wealth: Каждая монета на счету — казна растёт.
  focus_domain: Вы лично объезжаете свои земли и следите за хозяйством.
  focus_duty: Вы внимательны к нуждам вассалов и честно исполняете обязательства.
  focus_scheming: Шёпот, тайные письма и нужные люди в нужных местах.
  focus_seduction: Обаяние — тоже оружие, и вы владеете им мастерски.
  focus_protection: Ваши осведомители следят, чтобы никто не замышлял против вас.
  focus_scholarship: Библиотеки и учёные беседы — ваша страсть.
  focus_theology: Вы проводите дни в молитвах и чтении Солнечных Скрижалей.
  focus_medicine: Вы изучаете травы и труды лекарей древности.

