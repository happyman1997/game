trait_desc:
  diplomat: Признанный мастер переговоров.
  family_patriarch: Глава большого и сплочённого рода.
  strategist: Полководец, знающий цену каждому шагу на поле боя.
  tyrant: Его боятся больше, чем любят, — и этого ему довольно.
  paragon: О его подвигах поют от Нормандии до Норвегии.
  overseer: Умеет собрать и содержать войско.
  architect: Строит быстро, дёшево и на века.
  administrator: Держит в порядке огромные владения.
  schemer: Плетёт сети интриг, оставаясь в тени.
  seducer: Немногие могут устоять перед этими чарами.
  theologian: Глубокий знаток Солнечных Скрижалей и наставлений светочей.

