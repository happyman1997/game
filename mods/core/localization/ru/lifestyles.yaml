perk_desc:
  regal_bearing: "Слава правителя весит больше: уровни престижа поднимают мнение подданных в полтора раза сильнее."
  court_etiquette: "Пир обходится вдвое дешевле и прибавляет 50 славы. Пиры вам по душе — снимают стресс."
  statesman: "Соседи охотнее идут к вам в вассалы: +10 к согласию за каждый уровень вашей славы."
  august_majesty: "Открывает «Королевский объезд»: графства домена и вассалы надолго запомнят ваш визит."
  fecund_line: "Каждый ваш ребёнок прибавляет роду 25 известности."
  blood_ties: "Наследия рода стоят на четверть меньше, пока вы глава рода. Родня относится к вам теплее."
  wise_mentor: "Подопечные под вашей опекой учатся в полтора раза быстрее."
  head_of_house: "Род получает 100 известности. Открывает «Созвать родню»: правители вашего рода несут дары."
  logistics: "Ваши армии теряют вдвое меньше людей от истощения в диких и выжженных землях."
  take_alive: "После победы в битве с шансом 35% в плен попадает рыцарь врага — его можно выкупить или держать в темнице."
  military_drills: "Профессиональные отряды сильнее и дешевле в содержании."
  master_strategist: "Открывает «Военный смотр»: два года ополчение, отряды и полководец на подъёме."
  stern_gaze: "Страх перед вами тает вдвое медленнее и копится быстрее."
  bloody_justice: "Казнь внушает на 15 страха больше. Казни и заточения вам по душе — снимают стресс."
  dungeon_dread: "Каждый пленник в вашей темнице внушает 1 страх в месяц (до пяти). Отпускать пленников вам претит."
  iron_fist: "Открывает «Запугать» (дань страхом; отказ даёт законный повод к темнице) и «Показательную казнь»."
  knightly_vow: "Отказ от вашего вызова на поединок — позор вдвойне. Вызывать на поединок вам по душе."
  trophy_taker: "Победив в поединке, вы забираете оружие побеждённого (он затаит притязание). Победа в битве с шансом 20% приносит трофейный щит."
  sword_brotherhood: "Ещё два места для рыцарей, и рыцари бьются лучше."
  paragon_of_chivalry: "Открывает «Поход за славой»: самому выйти на ристалище или выставить лучшего рыцаря — ради славы и прославленного оружия."
  master_builder: "Постройки дешевле, а каждая завершённая постройка поднимает мнение графства на 10 (5 лет)."
  thriving_lands: "Развитие растёт быстрее, а контроль над графствами восстанавливается скорее."
  court_splendor: "Заказ вещей дешевле на 40%, а мастера охотнее берутся за редкую работу."
  royal_architect: "Открывает «Великую стройку»: раз в жизни — собор, донжон или рынок в столице навсегда."
  efficient_rule: "Можно держать в домене на одно графство больше."
  tax_collectors: "Подати выше, а казнокрады в совете попадаются чаще."
  lombard_loan: "Открывает «Ломбардский заём»: 300 золота сразу, расплата — по 2,5 в месяц двенадцать лет."
  great_administrator: "Открывает «Подкуп»: золото покупает расположение и выводит вассала из фракции. Честные и справедливые оскорбятся."
  subtle_hand: "Каждый год вы узнаёте чью-нибудь тайну в своей державе."
  prying_eyes: "Каждый крюк приносит 0,5 золота в месяц. Шантаж вам по душе."
  secret_trade: "Открывает «Продать тайну»: соседний правитель узнаёт известный вам секрет и платит серебром."
  master_schemer: "Открывает «Заставить служить»: крюк в обмен на службу — золото, союз или место в совете."
  alluring: "Соблазнение удаётся на 15% чаще и идёт в полтора раза быстрее."
  pillow_talk: "Покорённый любовник выдаёт свою тайну и тайну своего сюзерена."
  heartbreaker: "Каждый покорённый любовник у вас на крючке. Соблазнять вам по душе."
  irresistible: "Открывает «Сердечный союз»: любовник-правитель вступает с вами в союз, а если вы воюете — мирится."
  avid_reader: "Каждое деяние (победа, постройка, поединок…) приносит 25 опыта текущего образа жизни."
  natural_philosophy: "Развитие растёт быстрее, опыт образа жизни копится скорее."
  polymath: "+1 ко всем навыкам, а пути (архетипы) открываются на 2 очка навыка раньше."
  renowned_scholar: "Открывает «Великий труд»: книга прославленной редкости (при учёности 20 — легендарной), слава роду."
  devout_prayer: "Паломничество смывает весь стресс и с шансом 35% приносит реликварий. Паломничества и милостыня вам по душе."
  inner_peace: "Стресс копится медленнее, а уровни благочестия поднимают мнение единоверцев в полтора раза сильнее."
  relic_keeper: "Реликварий при дворе каждый год даёт 60 благочестия и почитание единоверных вассалов. Казни вам претят."
  doctor_of_theology: "Открывает «Чудо» (исцеление себя и семьи, ликование графств) и «Воззвание к священной войне»."

