ambition_desc:
  land: "Служба без земли — что хлеб без соли. Мечта — собственный лен, пожалованный сюзереном."
  council: "Место у трона и голос в совете — вот чего хочется. И непонятно, почему до сих пор не позвали."
  marriage: "Одиночество тяготит. Пора сюзерену подыскать достойную партию."
  wealth: "Звон монет слаще любой музыки. Сундуки должны быть полны — своими трудами или щедротами господина."
  renown: "Хочется, чтобы имя произносили с уважением, а место за столом было поближе к трону."
  glory: "Меч ржавеет в ножнах. Нужна война — и победы под знаменем господина."
  devotion: "Двор погряз в мирском. Хочется видеть господина на коленях перед алтарём — или хотя бы на пути к святым местам."
  revenge: "Обида не забыта. Враг должен оказаться в цепях — или в могиле."
  independence: "Клятва верности тяготит. Мечта — никому не служить."
  heir: "Без наследника всё нажитое уйдёт чужим. Нужен ребёнок."
  educated_heir: "Наследник должен быть не просто сыном или дочерью — а человеком, достойным власти."
  expansion: "Держава тесна. Нужны новые земли — мечом, браком или пожалованием."
  builder: "Хочется оставить по себе камень: стены, храмы, рынки."
  dynasty_glory: "Род должен стать больше, чем имя. Нужно новое наследие."
ambition_hint:
  land: "Владеть титулом: {target}. Исполняет сюзерен — пожалованием; пожалует другому — обида."
  council: "Занять место в совете сюзерена."
  marriage: "Вступить в брак. Свадьбу может устроить сюзерен."
  wealth: "Скопить ещё {left} золота. Сюзерен может пожаловать недостающее."
  renown: "Набрать ещё {left} престижа. Сюзерен может осыпать почестями."
  glory: "Побед сюзерена в битвах: {need}."
  devotion: "Сюзерен совершает благочестивое деяние (паломничество, обращение земель, дар Храму) или становится праведником."
  revenge: "{target} — в темнице или в могиле. Благодарность сюзерену — если враг в его темнице."
  independence: "Стать независимым правителем."
  heir: "Родить ребёнка."
  educated_heir: "Вырастить ребёнка с образованием не ниже 3-го уровня."
  expansion: "Новых графств в державе: {need}."
  builder: "Построить зданий: {need}."
  dynasty_glory: "Открыть новое наследие рода."

