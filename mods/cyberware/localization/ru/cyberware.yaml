implant_desc:
  memory_boost: "Летописи, псалмы, долговые книги — всё помнится дословно."
  empathy_chip: "Слышит, что у собеседника на сердце, раньше, чем тот заговорит."
  ledger_chip: "Подати, пошлины и проценты складываются в голове сами."
  tactical_cortex: "Поле боя видится сверху — как шахматная доска."
  lie_analyzer: "Пульс, зрачки, дрожь в голосе: лжец выдаёт себя за миг."
  neural_crown: "Венец под черепом. Тот, кто его носит, мыслит за троих."
  cyberdeck: "Взламывает замки, печати и чужие мысли."
  chrono_booster: "Мир замедляется: стрела висит в воздухе, меч противника ползёт."
  berserk: "Боль отключена, кровь кипит. Остановиться труднее, чем начать."
  overmind: "Сеть шпионов в голове, шифры и заговоры — как на ладони."
  hawk_optics: "Видит всадника за три мили и монету на дне колодца."
  thermal_vision: "Засада в лесу светится, как костёр."
  mirror_pupils: "Глаза, в которых тонут. Двор не может отвести взгляд."
  oracle_eye: "Видит не только сквозь стены, но и сквозь улыбки."
  biomonitor: "Предупреждает о хвори прежде лекаря."
  blood_pump: "Сердцу помогают: ровный пульс и в битве, и на совете."
  toxin_filter: "Яд в кубке? Фильтр справится раньше, чем отравитель обрадуется."
  synth_heart: "Сердце из звёздного железа. Его не пронзить с первого раза."
  reflex_tuner: "Рука движется раньше, чем мелькнёт мысль."
  neofiber: "Нервы из света: удар не догоняет."
  calm_regulator: "Тревога глушится, сон приходит. Только чувства становятся тише."
  subdermal_armor: "Пластины под кожей: стрела отскакивает от плеча."
  pain_editor: "Боль — лишь цифра, которую можно стереть."
  optical_camo: "Кожа перенимает цвет стены. Стража смотрит сквозь."
  bionic_lungs: "Дыхание не сбивается ни в походе, ни в горах."
  titanium_bones: "Кости, которые не ломает даже булава."
  reinforced_spine: "Спина, что держит в седле и в полном доспехе."
  power_fists: "Удар, от которого трещат ворота замка."
  wrist_launcher: "В предплечье — маленькая гремящая смерть."
  sickle_blades: "Из предплечий выходят клинки. Двор вздрагивает, когда вы жестикулируете."
  monowire: "Нить тоньше волоса режет латы, как сыр."
  smart_link: "Оружие в руке словно знает, куда бить."
  surgeon_fingers: "Пальцы точнее пера: и швы, и письмо, и счёты."
  ballistic_coproc: "Рука сама поправляет прицел."
  fortified_ankles: "Ноги выдерживают падение с крепостной стены."
  reinforced_tendons: "Шаг, которым обгоняют коня."
  jump_boosters: "Прыжок через ров — и обратно."

trait:
