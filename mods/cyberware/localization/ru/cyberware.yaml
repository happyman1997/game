ev:
  cyber.0001:
    t: Потрошитель у ворот
    desc: "Стража привела странного лекаря в чёрном. Его сундук гудит, а руки блестят металлом. «Звезда упала не зря, господин, — говорит он. — Позвольте, я сделаю ваши глаза зорче ястребиных. Почти задаром»."
    a: Позволить вживить оптику (−40 золота)
    b: Прогнать
    c: Сжечь колдуна
  cyber.0002:
    t: Приступ
    desc: "Свет режет глаза, голоса двора звучат как скрежет. Железо внутри требует действия — любого. [scope:victim] стоит слишком близко."
    a: Запереться в покоях и переждать
    b: Дать волю ярости
    c: Вырвать часть хрома
  cyber.0003:
    t: Церковь осуждает хром
    desc: "Епископ с амвона проклинает «железных людей», а прихожане косятся на ваши руки. Говорят, звёздное железо — от лукавого."
    a: Покаяться и заплатить церкви (−80 золота)
    b: Пусть ворчат
