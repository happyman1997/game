ev:
  cyber.0001:
    t: A Ripperdoc at the Gates
    desc: "The guards bring in a strange healer in black. His chest hums, and his hands gleam with metal. “The star did not fall for nothing, my lord,” he says. “Let me make your eyes keener than a hawk's. Almost for free.”"
    a: Let him install the optics (−40 gold)
    b: Send him away
    c: Burn the sorcerer
  cyber.0002:
    t: An Episode
    desc: "Light cuts the eyes, the court's voices sound like grinding metal. The iron inside demands action — any action. [scope:victim] stands too close."
    a: Lock yourself in your chambers and wait it out
    b: Let the fury out
    c: Tear out some of the chrome
  cyber.0003:
    t: The Church Condemns Chrome
    desc: "From the pulpit the bishop curses “iron men,” and the flock eyes your hands. They say star-iron is the devil's work."
    a: Repent and pay the church (−80 gold)
    b: Let them grumble
