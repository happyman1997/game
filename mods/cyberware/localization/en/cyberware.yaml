implant_desc:
  memory_boost: "Chronicles, psalms, debt ledgers — all remembered word for word."
  empathy_chip: "Hears what is in a person's heart before they speak."
  ledger_chip: "Taxes, tolls and interest add up on their own."
  tactical_cortex: "The battlefield seen from above — like a chessboard."
  lie_analyzer: "Pulse, pupils, a tremor in the voice: a liar gives themselves away in an instant."
  neural_crown: "A crown beneath the skull. Its bearer thinks for three."
  cyberdeck: "Breaks locks, seals and other people's thoughts."
  chrono_booster: "The world slows: the arrow hangs in the air, the enemy's sword crawls."
  berserk: "Pain switched off, blood boiling. Stopping is harder than starting."
  overmind: "A web of spies in the head; ciphers and plots laid bare."
  hawk_optics: "Sees a rider three miles off and a coin at the bottom of a well."
  thermal_vision: "An ambush in the woods glows like a campfire."
  mirror_pupils: "Eyes to drown in. The court cannot look away."
  oracle_eye: "Sees not only through walls but through smiles."
  biomonitor: "Warns of illness before the physician does."
  blood_pump: "A steady pulse in battle and in council alike."
  toxin_filter: "Poison in the cup? The filter works before the poisoner can rejoice."
  synth_heart: "A heart of star-iron. It cannot be pierced at the first blow."
  reflex_tuner: "The hand moves before the thought."
  neofiber: "Nerves of light: no blow can catch up."
  calm_regulator: "Anxiety muffled, sleep comes. Only feelings grow quieter."
  subdermal_armor: "Plates beneath the skin: an arrow bounces off the shoulder."
  pain_editor: "Pain is just a number that can be erased."
  optical_camo: "The skin takes the color of the wall. Guards look right through."
  bionic_lungs: "Breath never falters, on the march or in the mountains."
  titanium_bones: "Bones that even a mace cannot break."
  reinforced_spine: "A back that keeps you in the saddle in full armor."
  power_fists: "A blow that cracks castle gates."
  wrist_launcher: "Small, roaring death in the forearm."
  sickle_blades: "Blades slide out of the forearms. The court flinches when you gesture."
  monowire: "A thread thinner than hair cuts plate like cheese."
  smart_link: "The weapon in hand seems to know where to strike."
  surgeon_fingers: "Fingers finer than a quill: stitches, letters and abacus alike."
  ballistic_coproc: "The hand corrects its own aim."
  fortified_ankles: "Legs that survive a fall from a castle wall."
  reinforced_tendons: "A stride that outruns a horse."
  jump_boosters: "A leap across the moat — and back."

