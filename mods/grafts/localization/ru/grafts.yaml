graft_desc:
  trepan_plate: "Цирюльник отворил череп, выпустил дурные пары и закрыл дыру серебряной пластиной. Голова стала яснее, сон — крепче."
  lead_seal: "Печать из свинца под кожей лба. Говорят, с ней не собьёшься ни в счёте, ни в податях."
  skull_runes: "Северный мастер выжег на кости знаки, что прячут мысли от чужих глаз."
  rune_of_tyr: "Знак бога войны на темени. Полки слушают того, кто его носит, как трубу."
  wisdom_stone: "Камень из сердца упавшей звезды под кожей лба. Тот, кто носит его, мыслит за троих — и спит всё хуже."
  glass_eye: "Венецианское стекло вместо выбитого глаза. Издали и не отличишь."
  crystal_eye: "Горный хрусталь видит, как дрожит рука лжеца."
  ruby_eye: "Багровый глаз ловит свет свечей. Двор не может отвести взгляд — и боится."
  raven_eye: "Чёрный глаз ворона, вживлённый ведуньей. Видит не только сквозь дым, но и сквозь улыбки."
  gold_teeth: "Зубы из червонного золота. Улыбка — как казна напоказ."
  iron_jaw: "Челюсть, скованная кузнецом. Стальной оскал врага не радует."
  silver_tongue: "Серебряная пластинка под языком: слова льются, как мёд."
  relic_heart: "Крошечный мощевик вшит у сердца. Молитва даётся легче, тревога отступает."
  lion_heart: "Сердце льва, сшитое с вашим. В бою оно бьётся вдвое чаще."
  star_iron_heart: "Сердце в оплётке из звёздного железа. Его не пронзить с первого раза — но и не согреть."
  galen_humors: "Кровопускание и травы по Галену: соки тела в равновесии."
  theriac: "Терьяк из семидесяти трав и змеиного мяса. Яд в кубке уже не так страшен."
  quicksilver: "Ртуть в крови: рука быстрее, шаг легче. Алхимики говорят — недолго."
  dragon_blood: "Тёмная кровь в склянке с Востока. Раны затягиваются к утру."
  gut_tendons: "Жилы, усиленные лютневыми струнами. Удар сильнее, бег дольше."
  wire_sinews: "Тонкая проволока вплетена в жилы. Рука держит меч, как клещи."
  stag_sinews: "Жилы оленя. Походный шаг, которым обгоняют обоз."
  rune_tattoos: "Вязь синих рун по плечам. Стрелы, говорят, сворачивают в сторону."
  saint_relic: "Частица мощей под кожей груди. Молитвы слышнее, наветы — тише."
  shadow_ink: "Тушь из каракатицы и золы, вбитая иглой. В тени носителя не видно."
  dragon_scales: "Чешуя, вшитая под кожу плеч. Меч скользит, как по броне."
  iron_splints: "Сломанные кости схвачены железными скобами. Срослись крепче прежних."
  silver_ribs: "Серебряные пластины вдоль рёбер. Копьё не дойдёт до сердца."
  giant_bones: "Кости из кургана великанов, вплетённые в ваши. Выше, тяжелее, страшнее."
  hook_hand: "Простой железный крюк вместо потерянной кисти. Грубо, но надёжно."
  iron_hand: "Латная рука на ремнях и заклёпках. Сжимает рукоять, не устаёт."
  blade_arm: "Клинок вместо предплечья. Двор вздрагивает, когда вы жестикулируете."
  clockwork_arm: "Рука из шестерён и пружин работы мастера из Нюрнберга. Пальцы точнее пера."
  peg_leg: "Дубовая нога. Стучит по каменным плитам, но держит."
  iron_leg: "Кованая нога на шарнире. В седле не хуже прежней."
  stag_legs: "Ноги на оленьих сухожилиях и железных шарнирах. Шаг, которым обгоняют коня."

trait:
  iron_possession: Одержимость
trait_desc:
  iron_possession: "Железа стало больше, чем человека. Ночами слышится шёпот из металла, гнев приходит без причины, а жалость уходит — двор осеняет себя солнечным знаком и шепчется, что это голос Князя Пепла."

