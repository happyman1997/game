ev:
  graft.0001:
    t: Цирюльник у ворот
    desc: "Стража привела бродячего цирюльника-хирурга. В его сундуке звенят щипцы, пилы и склянки, а на поясе — нитка золотых зубов. «Со звезды, что упала в год кометы, господин, — шепчет он. — Позвольте, улыбка ваша засияет, как у короля. Почти задаром»."
    a: Позволить вставить золотые зубы (−30 золота)
    b: Прогнать
    c: Сжечь колдуна
  graft.0002:
    t: Шёпот железа
    desc: "Свечи гаснут, голоса двора звучат как скрежет. Железо в теле шепчет и требует действия — любого. [scope:victim] стоит слишком близко."
    a: Запереться в часовне до рассвета
    b: Дать волю ярости
    c: Вырвать железо из плоти
  graft.0003:
    t: Храм осуждает железных людей
    desc: "Жрец-светоч с храмовых ступеней проклинает «железных людей», а прихожане косятся на ваши руки. Говорят, звёздное железо — от Князя Пепла, а кто вживил его в себя, продал ему кусок души."
    a: Покаяться и заплатить Храму (−80 золота)
    b: Позвать экзорциста (−100 золота)
    c: Пусть ворчат
