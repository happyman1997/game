graft_desc:
  trepan_plate: "The barber opened the skull, let out the foul vapours and closed the hole with a silver plate. A clearer head, a sounder sleep."
  lead_seal: "A lead seal beneath the skin of the brow. They say with it you never lose count of a tithe."
  skull_runes: "A northern master burned signs into the bone that hide thoughts from prying eyes."
  rune_of_tyr: "The war god's sign on the crown of the head. Hosts heed its bearer like a trumpet."
  wisdom_stone: "A stone from the heart of a fallen star beneath the brow. Its bearer thinks for three — and sleeps ever worse."
  glass_eye: "Venetian glass in place of a lost eye. From afar no one can tell."
  crystal_eye: "Rock crystal that sees a liar's hand tremble."
  ruby_eye: "A crimson eye that catches the candlelight. The court cannot look away — and is afraid."
  raven_eye: "A raven's black eye, set by a cunning woman. It sees through smoke, and through smiles."
  gold_teeth: "Teeth of red gold. A smile like a treasury on display."
  iron_jaw: "A jaw forged by a smith. An iron grin no enemy enjoys."
  silver_tongue: "A silver leaf beneath the tongue: words flow like honey."
  relic_heart: "A tiny reliquary sewn by the heart. Prayer comes easier, worry recedes."
  lion_heart: "A lion's heart stitched to your own. In battle it beats twice as fast."
  star_iron_heart: "A heart bound in star-iron. It cannot be pierced at the first blow — nor warmed."
  galen_humors: "Bloodletting and herbs after Galen: the humours in balance."
  theriac: "Theriac of seventy herbs and viper flesh. Poison in the cup is far less frightening."
  quicksilver: "Quicksilver in the blood: a quicker hand, a lighter step. Not for long, the alchemists say."
  dragon_blood: "Dark blood in a phial from the East. Wounds close by morning."
  gut_tendons: "Tendons strengthened with lute strings. Harder blows, longer runs."
  wire_sinews: "Fine wire woven into the sinews. The hand grips a sword like pincers."
  stag_sinews: "A stag's sinews. A marching pace that outstrips the baggage train."
  rune_tattoos: "Blue runes woven across the shoulders. Arrows, they say, turn aside."
  saint_relic: "A fragment of a saint beneath the skin of the chest. Prayers are louder, slanders quieter."
  shadow_ink: "Ink of cuttlefish and ash, driven in with a needle. In shadow its bearer cannot be seen."
  dragon_scales: "Scales sewn beneath the skin of the shoulders. A sword glances off as from armour."
  iron_splints: "Broken bones clasped with iron splints. They knit stronger than before."
  silver_ribs: "Silver plates along the ribs. No spear reaches the heart."
  giant_bones: "Bones from a giants' barrow woven into yours. Taller, heavier, more fearsome."
  hook_hand: "A plain iron hook for a lost hand. Crude but reliable."
  iron_hand: "A gauntleted hand on straps and rivets. It grips the hilt and never tires."
  blade_arm: "A blade in place of a forearm. The court flinches when you gesture."
  clockwork_arm: "An arm of gears and springs by a Nuremberg master. Fingers finer than a quill."
  peg_leg: "An oaken leg. It knocks on the flagstones, but it holds."
  iron_leg: "A forged leg on a hinge. In the saddle no worse than the old one."
  stag_legs: "Legs of stag sinew and iron hinges. A stride that outpaces a horse."

trait:
  iron_possession: Possession
trait_desc:
  iron_possession: "There is more iron than man now. At night a whisper rises from the metal, rage comes without cause and pity leaves — the court makes the sun-sign and whispers that it is the voice of the Prince of Ash."

