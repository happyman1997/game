ev:
  graft.0001:
    t: A Barber at the Gates
    desc: "The guards bring a wandering barber-surgeon. Tongs, saws and phials clink in his chest, and a string of gold teeth hangs at his belt. “From the star that fell in the year of the comet, my lord,” he whispers. “Let your smile shine like a king's. Almost for nothing.”"
    a: Let him set gold teeth (−30 gold)
    b: Send him away
    c: Burn the sorcerer
  graft.0002:
    t: The Whisper of Iron
    desc: "The candles gutter, the voices of the court sound like grinding. The iron in your body whispers and demands action — any action. [scope:victim] stands too close."
    a: Lock myself in the chapel till dawn
    b: Give the rage free rein
    c: Tear the iron from the flesh
  graft.0003:
    t: The Temple Condemns Iron Men
    desc: "From the temple steps a sun-priest curses the “iron men”, and the faithful glance at your hands. Star-iron, they say, is of the Prince of Ash, and whoever grafts it into himself has sold a piece of his soul."
    a: Repent and pay the Temple (−80 gold)
    b: Call an exorcist (−100 gold)
    c: Let them grumble
