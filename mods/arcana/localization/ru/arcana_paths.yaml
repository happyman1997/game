trait:
  monster_bane: Гроза нечисти
trait_desc:
  monster_bane: Шесть чудовищ пали от этой руки. Мертвецы, кровопийцы и волки-оборотни обходят эти земли стороной, а Орден Серебряного пламени готов идти за своим героем.

