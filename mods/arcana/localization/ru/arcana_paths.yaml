  fx_hunter: Слава охотника на нечисть
  fx_bless: "Земли домена благословлены на 5 лет: развитие и налоги растут, мёртвые не встают"
  fx_firestorm: Огненная буря на крупнейшее вражеское войско у ваших границ
  fx_plague_dead: Мертвецы встают в столице главного врага
