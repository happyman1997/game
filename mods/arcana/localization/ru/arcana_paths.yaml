  vampire_tier_1: Птенец
  vampire_tier_2: Вампир
  vampire_tier_3: Старейшина
  vampire_tier_4: Древний
  vampire_powers_1: Птенец голоден и неосторожен — жажда растёт быстро, обращать других ещё нельзя.
  vampire_powers_2: "Открыто: Тёмный дар и «Чары взгляда». Жажда растёт медленнее."
  vampire_powers_3: "Открыто: «Кровавые узы» — сильный крюк на придворного или вассала. Свидетели замечают вас реже."
  vampire_powers_4: "Открыто: «Призвать тварей ночи» на войне. Древний не теряет себя в безумии крови."
  msg_tier_vampire: "Кровь крепнет: теперь вы — {tier}. {powers}"
  potency_title: Сила крови
  potency_next: "до уровня «{tier}» — {n}"
  beast_title: Зверь внутри
  stage_wolf_torn: на грани
  stage_wolf_feral: зверь берёт верх
  stage_wolf_tamed: укрощённый зверь
  stage_wolf_alpha: вожак стаи
  msg_wolf_feral: Зверь всё чаще берёт верх. Луна зовёт громче.
  msg_wolf_tamed: Вы укротили зверя — он служит вам, а не вы ему.
  msg_wolf_alpha: Вы — вожак стаи. Зверь откликается на ваш зов в любую ночь.
  msg_fey_sight: "Чары не скрывают правды от подменыша: {who} — не тот, кем кажется."
  msg_monster_hunter: Первое чудовище повержено. Люди зовут вас охотником на нечисть.
  msg_monster_bane: Слава бежит впереди вас — вы Гроза нечисти. Орден Серебряного пламени готов служить вам.
  hunter_title: Чудовищ уничтожено
  hunter_next: "До славы «Грозы нечисти» — ещё {n}"
  msg_firestorm: "Огненная буря обрушилась на войско врага ({place}): погибло {loss}"
  msg_firestorm_none: Буре не на кого обрушиться — у ваших границ нет вражеских войск.
  msg_plague_dead: "Погосты врага разверзлись: мёртвые встают ({place})"
  msg_draugr_gold: "В кургане драугра нашлось древнее золото ({place}): {gold}"
  msg_hunt_nothing: Ловчие не нашли чудовищ — лишь матёрого вепря. Двор доволен охотой.
  opinion_saint_healer: Светлый целитель
  opinion_sinful_gift: Греховный дар
  opinion_ulfhednar: Ульфхеднар
  opinion_seidr: Знает сейд
  purifying_light_tip: Сила света зависит от колдовства. Очищение засчитывается в славу охотника.
  firestorm_tip: Буря бьёт по крупнейшему вражескому войску в вашей державе или у её границ; чем сильнее колдовство, тем больше потери.
  plague_dead_tip: Цель — столица самого знатного из ваших врагов. Чем сильнее колдовство, тем больше мертвецов.
  mesmerize_tip: Каждый такой взгляд разжигает жажду, а внимательный придворный может что-то заметить.
  blood_bond_tip: Связанный кровью будет предан вам, сам не понимая почему.
  summon_night_tip: Кто-то может увидеть, как вы говорите с волками.
  lead_pack_tip: Кто-то может увидеть, как вы уходите в лес перед рассветом.
  need_volva: "Нужен дар сейда: у вас самих или у одарённого при дворе"
  seidr_tip: "Вёльва заглянет в нити норн: удача в бою, покой души или тайны врагов."
  fey_debt_open: Долг Дивному народу ещё не уплачен
  fey_bargain_tip: Феи дадут богатство, победу или мудрость. Через четыре года они придут за платой.
  call_hills_tip: Подменыш узнает, откуда он родом. Он может вернуться с дарами — или не вернуться вовсе.
  alchemy_running: Алхимики ещё трудятся
  alchemy_tip: "Через год станет ясно, что вышло: золото, эликсир, взрыв — или философский камень."
  hunt_monsters_tip: Чем выше доблесть, интрига и слава охотника, тем вернее найти чудовище. Разоблачённое чудовище — на вашем счету.
  msg_barenton_knight: Из грозы выехал Чёрный рыцарь. Вы скрестили мечи — и он преклонил колено, поклявшись служить вам.
  msg_barenton_vision: Над источником встала радуга, и в воде вы увидели то, о чём не прочесть ни в одной книге.
  msg_barenton_storm: Буря разразилась над всей округой — градом побило поля.
  msg_draugr_won: Драугр повержен! Его меч и золото теперь ваши.
  msg_draugr_lost: Драугр оказался сильнее. Вы едва выбрались из кургана живым.
  msg_hunt_rode: Вы скакали с Дикой охотой до рассвета — и вернулись. Об этом будут петь.
  msg_hunt_lost: Вы вернулись на рассвете седым и не помните, где были.
  msg_alchemy_gold: В тигле блестит золото — алхимики сдержали слово!
  msg_alchemy_elixir: Эликсир горчит, но после него вы чувствуете себя моложе.
  msg_alchemy_boom: Лаборатория взлетела на воздух вместе с половиной квартала.
  msg_alchemy_stone: Философский камень! Тускло-красный, тёплый, как живой.

ev:
  arcana.0057:
    t: Котёл возрождения
    desc: Барды поют о Пейр Дадени — котле, привезённом из Ирландии. Брось в него мёртвого воина, и наутро он встанет живым, только навсегда онемевшим. Рыбаки вытащили из озера огромный чёрный котёл с узором из переплетённых змей.
    a: Испить из котла самому
    b: Возродить павших воинов
    c: Разбить котёл — такое не для христиан
  arcana.0042:
    t: Зверь победил
    desc: Луна была полной слишком много ночей. Вы больше не помните, где кончается человек. Утром вас нашли в лесу — нагого, в крови, среди растерзанных овец. Теперь об этом знают все.
    a: Я — то, что я есть
  arcana.0052:
    t: Зов холмов
    desc: Ночью вам снится музыка, которую вы слышали в колыбели. Дорога в холмы открыта. Там ждут те, кто когда-то оставил вас среди людей.
    a: Вернуться с дарами Дивного народа
    b: Остаться человеком
    c: Уйти к своим навсегда
  arcana.0053:
    t: Сделка с Дивным народом
    desc: "В кругу камней на холме вас ждёт высокая фигура в плаще из листьев. Голос звенит, как ручей: «Проси, смертный. Мы дадим. Но мы всегда возвращаемся за платой»."
    a: Золото холмов
    b: Победу в бою
    c: Мудрость древних
    d: Ничего не просить
  arcana.0054:
    t: Феи пришли за долгом
    desc: Годы прошли, и в полночь у ворот снова звучит музыка. Дивный народ пришёл за платой — и не уйдёт с пустыми руками.
    a: Отдать им годы своей жизни
    b: "Отдать им [scope:tithe.first_name] — пусть танцует в холмах"
    c: Прогнать их железом и крестом
  arcana.0055:
    t: Плач банши
    desc: "Третью ночь под окнами слышится женский плач — долгий, нечеловеческий. Старая кормилица шепчет: это банши, и плачет она по [scope:doomed.first_name]. Банши не ошибаются."
    a: Собрать семью у очага
    b: Позвать лучших лекарей
    c: Выйти к ней с холодным железом
  arcana.0056:
    t: Источник Барентона
    desc: В лесу Броселианды, у источника под старым дубом, лежит плоский камень. Говорят, если плеснуть на него водой из источника, разразится буря и явится Чёрный рыцарь, стерегущий это место. Так испытывали себя рыцари Круглого стола.
    a: Плеснуть воды на камень
    b: Не тревожить древнее место
  arcana.0090:
    t: Сейд вёльвы
    desc: "Вёльва садится на высокое сиденье, лицо скрыто капюшоном из чёрной ягнячьей шкуры. Женщины поют вардлоккур, и она смотрит сквозь мир — туда, где норны прядут нити судеб. «Спрашивай», — говорит она."
    a: Что ждёт меня в битве?
    b: Будет ли покой моему роду?
    c: Что скрывают мои враги?
  arcana.0091:
    t: Драугр
    desc: Из кургана на краю ваших земель по ночам выходит мертвец — огромный, синий, как утопленник. Драугр стережёт золото, с которым его похоронили, и душит скот. Скальды говорят, что одолеть его может лишь тот, кто сам войдёт в курган.
    a: Войти в курган с мечом
    b: Запечатать курган рунами
    c: Обходить его стороной
  arcana.0092:
    t: Дикая охота
    desc: В бурную ночь небо наполнилось лаем собак и топотом копыт. Над лесом пронеслась кавалькада призрачных всадников, и их вожак — рогатый, выше любого человека — придержал коня у ваших стен. Он смотрит на вас и ждёт.
    a: Сесть в седло и скакать с ними
    b: Запереть ворота и не смотреть
    c: Молиться до рассвета
  arcana.0100:
    t: Дама у источника
    desc: "На охоте вы отстали от свиты и выехали к лесному источнику. У воды сидит девушка невиданной красоты, и она знает ваше имя. «Я стану твоей женой и принесу твоему дому богатство, — говорит она. — Но поклянись: по субботам ты не станешь искать меня и не войдёшь в мои покои»."
    a: Клянусь — будь моей женой
    b: Это морок. Уехать
  arcana.0101:
    t: Субботняя тайна
    desc: Пять лет [scope:melusine.first_name] — добрая жена и мудрая хозяйка, и при ней ваши земли богатеют. Но каждую субботу она запирается в своих покоях, и двор шепчется. Сегодня суббота. Дверь не заперта.
    a: Сдержать клятву
    b: Заглянуть в замочную скважину
  arcana.0110:
    t: Плоды алхимии
    desc: Год алхимики не выходили из лаборатории. В окнах днём и ночью горел зелёный огонь, по замку стелился запах серы. Сегодня старший мастер просит вас спуститься — он готов показать, чего достиг.
    a: Посмотрим
