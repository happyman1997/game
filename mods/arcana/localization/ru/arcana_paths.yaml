  plague_of_the_dead: Мор мёртвых
  seidr_ritual: Сейд вёльвы
  raise_runestone: Воздвигнуть рунный камень
  fey_bargain: Сделка с Дивным народом
  call_of_the_hills: Зов холмов
  patron_alchemists: Покровительство алхимикам
  hunt_monsters: Выследить нечисть
decision_desc:
  summon_night: Летучие мыши закрывают луну, волки воют у вражеских лагерей. Ваши полководцы получают преимущество на полгода, но жажда растёт.
  lead_the_pack: В волчьем обличье вы ведёте стаю на вражеские обозы. Полководцы получают преимущество на полгода.
  wolf_hunt: Ночь в лесу в зверином обличье — и наутро вы спокойны, как никогда. Зверь привыкает слушаться.
  purifying_light: Свет, рождённый чарами, выжигает мертвецов в самой поражённой провинции — без ополчения и факелов.
  bless_the_land: Светлый чародей обходит свои земли. Пять лет урожаи богаче, налоги выше, а мёртвые не встают.
  firestorm: Небо над вражеским войском у ваших границ вспыхивает огнём. Сгорает до трети войска.
  plague_of_the_dead: Погосты главного врага разверзаются — мертвецы встают в его столице.
  seidr_ritual: Позвать вёльву и спросить её о судьбе. Если одарённых при дворе нет, сейд придётся творить самому.
  raise_runestone: Резчик вырежет руны в память о предках и во славу рода. Камень простоит века.
  fey_bargain: Подняться на холм фей и попросить Дивный народ о даре. Платить придётся позже.
  call_of_the_hills: Подменыш слышит музыку, звучавшую у его колыбели. Пора узнать, откуда он родом.
  patron_alchemists: Устроить лабораторию и пригласить алхимиков. Через год станет ясно, стоило ли.
  hunt_monsters: Пустить ловчих и псарей по следу. В каждом дворе кто-то прячет клыки, звериную шерсть или могильную землю под ногтями.

interaction:
  mesmerize: Чары взгляда
  blood_bond: Кровавые узы
interaction_desc:
  mesmerize: Долгий взгляд — и собеседник уже не помнит, о чём спорил. Вы получаете крюк, а он — странную симпатию к вам.
  blood_bond: Капля вашей крови в кубке — и человек навсегда в вашей власти. Сильный крюк на придворного или вассала.

