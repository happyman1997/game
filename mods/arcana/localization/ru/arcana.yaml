  secret_werewolf: Проклятие оборотня
secret_type_desc:
  secret_witchcraft: Наводил порчу и привораживал. Церковь сочтёт это ересью.
  secret_necromancy: Поднимает мёртвых. За такое сжигают.
  secret_vampire: Не человек — вампир, питающийся кровью живых.
  secret_werewolf: В полнолуние оборачивается зверем.

decision:
  spell_healing_draught: Целебное зелье
  spell_ward: Оберег
  spell_stormcall: Призвать бурю
  spell_scrying: Заглянуть в хрустальный шар
  spell_speak_with_dead: Говорить с мёртвыми
  spell_raise_dead: Поднять мёртвых
  lich_ritual: Обряд бессмертия
  witch_hunt: Охота на ведьм
  feed_on_blood: Утолить жажду
  exorcism: Обряд изгнания
  purge_restless_dead: Выжечь нежить
  consecrate_lands: Освятить земли
  command_the_dead: Повелевать мёртвыми
  hunt_the_dragon: Выйти на дракона
decision_desc:
  spell_healing_draught: Отвар из семи трав и слово силы снимают болезни, раны и порчу.
  spell_ward: Знаки на пороге и шёпот над водой — порча и чужие козни бессильны против вас.
  spell_stormcall: Тучи сгущаются над вражеским войском. Ваши полководцы получают преимущество на полгода.
  spell_scrying: Туман в кристалле расходится — и вы видите чужие тайны и заговоры против вас.
  spell_speak_with_dead: Мёртвые знают многое и охотно рассказывают тому, кто умеет спросить.
  spell_raise_dead: Земля на погосте шевелится. Восставшие мертвецы встают в строй — им не нужно жалованье.
  lich_ritual: Отринуть смертную плоть и стать личем. Если обряд не удастся — смерть.
  witch_hunt: Обыскать двор и земли вассалов. Колдунов — в темницу, чудовищ — на свет. Не все обвинённые будут виновны.
  feed_on_blood: Жажда невыносима. Кто-то при дворе ослабнет — а может, и не проснётся.
  exorcism: Священник изгонит порчу или проклятие зверя. Получается не всегда.
  purge_restless_dead: Собрать людей, факелы и святую воду и выжечь мертвецов в самой поражённой провинции.
  consecrate_lands: Крестный ход по всем поражённым землям. Освящённая земля долго не даёт мёртвым подняться.
  command_the_dead: Мертвецы в ваших землях склоняются перед некромантом — и становятся вашим войском.
  hunt_the_dragon: С мечом и рыцарями — в логово дракона. Награда — его сокровища. Цена неудачи — жизнь.

interaction:
  cast_curse: Навести порчу
  love_charm: Приворот
  heal_other: Исцелить чарами
  dark_gift: Предложить Тёмный дар
interaction_desc:
  cast_curse: Тайная порча иссушит здоровье жертвы. Чем сильнее ваше колдовство и слабее её защита, тем вернее удар. Колдовство оставляет следы.
  love_charm: Зелье в кубке — и сердце собеседника тянется к вам. Может раскрыться как колдовство.
  heal_other: Снять болезни, раны и порчу. Светлый чародей исцеляет даже проклятие оборотня.
  dark_gift: Предложить бессмертие — и вечную жажду. Согласившийся станет вампиром.

regiment_type:
  risen_dead: Восставшие мертвецы
  silver_flame: Орден Серебряного пламени
regiment_type_desc:
  risen_dead: Не знают страха, усталости и жалованья. Набирать их может только некромант.
  silver_flame: Рыцари-монахи, давшие обет искоренять нечисть. Особенно сильны против мертвецов.

