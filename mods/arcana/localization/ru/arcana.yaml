ev:
  arcana.0001:
    t: Пробуждение дара
    desc: "В день совершеннолетия [scope:child.first_name] [scope:child|g:зажёг/зажгла] свечи взглядом — все разом, по всему залу. Двор замер. Дар — в крови, и теперь его не спрятать. [scope:child|g:Он/Она] смотрит на вас и ждёт решения."
    a: Пусть учится. Дар — это сила
    b: Скрыть это. Никто не должен знать
    c: Отдать в монастырь — пусть молитва укротит дар
  arcana.0002:
    t: Блуждающие огни
    desc: "Ночью над болотами зажглись бледные огни. Они кружат у самой кромки леса, словно зовут за собой. Старики говорят: кто пойдёт за ними, найдёт клад — или не вернётся."
    a: Последовать за огнями
    b: Приказать страже держаться подальше
    c: Призвать огни к себе
  arcana.0003:
    t: Ведьма из деревни
    desc: "Крестьяне приволокли к воротам старуху, связанную верёвками. Говорят, от её взгляда скисает молоко и умирают дети. Толпа требует костра. Старуха молчит и смотрит прямо на вас."
    a: Сжечь ведьму
    b: Отпустить её с миром
    c: Взять её ко двору — такой дар пригодится
  arcana.0004:
    t: Странствующий маг
    desc: "В зал вошёл седой путник в плаще, расшитом звёздами. Он предлагает свои услуги: предсказания, исцеление, защиту от сглаза. Цена — пятьдесят золотых и место при дворе."
    a: Нанять его
    b: Учиться у него
    c: Прогнать шарлатана
  arcana.0005:
    t: Хвостатая звезда
    desc: "В небе загорелась звезда с огненным хвостом. Люди падают на колени: одни шепчут о конце света, другие — о великом знамении для вашего дома."
    a: Это знак благоволения!
    b: Каяться и молиться
  arcana.0006:
    t: Алхимик
    desc: "Учёный муж с прожжёнными рукавами клянётся, что знает секрет философского камня. Нужно лишь сто золотых на реторты, серу и ртуть — и через месяц он вернёт втрое больше."
    a: Дать ему золото
    b: Отказать
  arcana.0010:
    t: Ночной гость
    desc: "Перед самым рассветом у ворот остановилась карета без гербов. Изящный незнакомец просит приюта: он путешествует только ночью — «болезнь глаз», — и щедро отблагодарит хозяина."
    a: Принять гостя
    b: Отказать
  arcana.0011:
    t: Обескровленное тело
    desc: "Утром в дальнем коридоре нашли служанку. Ни раны, ни крика ночью — только две крошечные отметины на шее и бледная, как воск, кожа. В теле не осталось ни капли крови."
    a: Начать расследование
    b: Замять дело
    c: Позвать священника
  arcana.0012:
    t: Жажда
    desc: "Пульс придворных гремит в ушах, как барабан. Вы ловите себя на том, что смотрите на шею кравчего слишком долго. Жажда больше не ждёт."
    a: Утолить её этой ночью
    b: Терпеть
  arcana.0013:
    t: Безумие крови
    desc: "Вы очнулись у тела. Рот полон крови, пальцы сведены судорогой. Вы не помните, как это случилось, — но кто-то видел, как вы выходили из той комнаты."
    a: Что я наделал…
    b: Таков мой голод
  arcana.0020:
    t: Мёртвые восстали
    desc: "Страшные вести из провинции [scope:place]: мертвецы встают из могил и бредут к деревням. Крестьяне бегут, бросив дома. Если ничего не сделать, мёртвые расползутся по соседним землям."
    a: Собрать людей и выжечь нечисть
    b: Молиться о спасении
    c: Пусть мёртвые бродят
  arcana.0021:
    t: Курган
    desc: "Крестьяне, распахивая новое поле, наткнулись на древний курган. Под землёй — каменная камера, ржавое оружие и тусклое золото. Пахарь клянётся, что слышал из-под камня стук."
    a: Разграбить курган
    b: Засыпать и освятить
    c: Изучить погребение
  arcana.0022:
    t: Призрак предка
    desc: "В полночь в вашей спальне стоит [scope:ancestor.first_name] — таким, каким вы помните его в последние дни. Призрак молчит, но протягивает руку, словно хочет что-то сказать."
    a: Выслушать
    b: Заказать мессу за упокой его души
    c: Прогнать призрака
  arcana.0030:
    t: Дракон
    desc: "Над горами провинции [scope:place] видели крылатую тень размером с собор. По ночам горы светятся изнутри, а стада исчезают. Дракон проснулся — и он близко."
    a: Готовиться к охоте
    b: Молиться о защите
    c: Не высовываться
  arcana.0031:
    t: Драконоборец
    desc: "Чудовище повержено. В логове, среди обугленных костей, — гора золота, накопленного веками. Барды уже слагают песни о вашем подвиге."
    a: Выставить голову дракона в главном зале
    b: Разделить сокровища с вассалами
  arcana.0032:
    t: Пламя
    desc: "Дракон оказался быстрее, чем говорили легенды. Последнее, что вы видите, — раскалённое горло и свет, ярче солнца."
    a: …
  arcana.0040:
    t: Огромный волк
    desc: "На охоте собаки подняли зверя — волка размером с коня. Его глаза горят жёлтым, и он не бежит, а смотрит прямо на вас."
    a: Сразиться с ним
    b: Отступить
  arcana.0041:
    t: Полнолуние
    desc: "Луна встаёт над лесом, и кровь в жилах становится горячей. Кости ноют, а ночь пахнет добычей. Зверь внутри просится наружу."
    a: Заковать себя в цепи
    b: Отдаться зверю
    c: Сдержать его чарами
  arcana.0050:
    t: Холмы фей
    desc: "Из холмов доносится музыка — та, которую нельзя забыть. [scope:wanderer.first_name] не спит третью ночь и просит отпустить [scope:wanderer|g:его/её] на праздник Доброго народа."
    a: Пусть идёт
    b: Запретить
    c: Пойти самому
  arcana.0051:
    t: Подменыш
    desc: "Повитуха крестится: ребёнок не плачет, а смотрит на огонь, не мигая. Глаза у него зелёные, как вода в лесном озере. Говорят, это подменыш — дитя фей."
    a: Любить как своё дитя
    b: Позвать священника
    c: Отнести обратно в холмы
  arcana.0060:
    t: Обряд бессмертия
    desc: "Круг начерчен кровью, свечи из сала мертвецов горят зелёным. Осталось сказать последние слова — и сердце либо остановится навсегда, либо перестанет быть нужным."
    a: Произнести последние слова
    b: Отступить в последний миг
  arcana.0061:
    t: Шёпот могил
    desc: "На погосте, куда вы пришли за травами, вас окликнули по имени. Голос шёл из-под земли. Он обещает знание, которое не найти ни в одной книге."
    a: Слушать мёртвых
    b: Уйти и не оглядываться
  arcana.0070:
    t: Инквизиция
    desc: "В замок прибыли люди в чёрном с епископской грамотой. Им донесли о колдовстве при вашем дворе. Они вежливы, терпеливы — и не уедут без виновного."
    a: Откупиться
    b: Выдать придворного колдуна
    c: Прогнать их
  arcana.0071:
    t: Костры погасли
    desc: "Охота на ведьм окончена. В темницах — подозреваемые, на площадях — пепел. Одни шепчут, что земля очистилась, другие — что горели невинные."
    a: Земля очищена
    b: Так было нужно
    c: Сколько невинных…
  arcana.0080:
    t: Предсказание
    desc: "Придворный маг всю ночь не отходил от астролябии. Утром он говорит: звёзды благоволят вашему дому — если не упустить момент."
    a: Внять предсказанию
    b: Объявить о нём при дворе
