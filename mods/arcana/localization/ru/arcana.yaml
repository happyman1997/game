trait:
  gifted: Одарённый
  changeling: Подменыш
  white_mage: Светлый чародей
  battlemage: Боевой маг
  necromancer: Некромант
  hexed: Порча
  vampire: Вампир
  lich: Лич
  lycanthrope: Оборотень
  dragonslayer: Драконоборец
  monster_hunter: Охотник на нечисть
  fey_touched: Отмеченный феями
trait_desc:
  gifted: В этом человеке течёт древний дар. Свечи гаснут, когда он гневается, а сны его порой сбываются.
  changeling: Говорят, настоящего ребёнка унесли в холмы, а в колыбели оставили это — слишком красивое, слишком тихое дитя.
  white_mage: Целитель и хранитель, чьи чары служат жизни. Даже священники порой закрывают на него глаза.
  battlemage: Тот, кто зовёт молнии на поле брани. Враги бегут прежде, чем сойдутся копья.
  necromancer: Слышит шёпот могил и повелевает тем, что должно лежать спокойно. Об этом не знает почти никто.
  hexed: На этом человеке порча. Он чахнет, и лекари не могут сказать почему.
  vampire: Не стареет, не болеет и не видит солнца без нужды. Питается кровью живых и тщательно хранит свою тайну.
  lich: Смерть больше не властна над этим существом. Плоть иссохла, но воля горит холодным огнём.
  lycanthrope: В полнолуние в нём просыпается зверь. Утром он ничего не помнит — или делает вид.
  dragonslayer: Сразил дракона. Барды поют об этом в каждом замке.
  monster_hunter: Выследил и уничтожил чудовище. Простой люд молится за него.
  fey_touched: Побывал в холмах фей и вернулся — другим. Видит больше, чем другие.

