  need_power_full: "Нужно 100 колдовской силы"
  raise_dead_tip: "Два отряда восставших мертвецов. Кто-то может увидеть, как поднимается земля на погосте."
  lich_ritual_tip: "Исход обряда: чем сильнее колдовство, тем больше шансов стать личем. Иначе — смерть."
  witch_hunt_tip: "Колдуны при дворе могут оказаться в темнице, тайны чудовищ — раскрыться. Вассалы, кроме ревнителей, испугаются."
  thirst_low: "Жажда ещё терпима (нужно не меньше 30)"
  feed_tip: "Жертва — пленник или придворный. Она может не пережить ночь, а кто-то может всё увидеть."
  exorcism_tip: "Порча снимается всегда; проклятие оборотня — чаще всего."
  purge_tip: "Сила удара зависит от ополчения державы, военного дела, рыцарей и Ордена Серебряного пламени. Армия, стоящая в провинции, тоже бьётся с мертвецами каждый месяц."
  consecrate_tip: "Ослабляет нежить во всех землях державы; очищенные земли надолго освящены."
  command_dead_tip: "Нежить самой поражённой провинции становится отрядами восставших мертвецов."
  dragon_need_prowess: "Нужна личная доблесть не меньше 8"
  dragon_hunt_tip: "Успех зависит от доблести, рыцарей и подготовки. Награда — сокровища дракона и слава. Неудача может стоить жизни."
  dark_gift_tip: "Согласившийся станет вампиром и будет связан с вами узами крови."
  ai_old_age: Боится старости
  ai_ambitious: Жаждет могущества
