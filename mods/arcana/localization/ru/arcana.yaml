  focus_witchery: Ворожба
  focus_mysticism: Мистицизм
focus_desc:
  focus_arcane_study: Ночи над старыми свитками и записями учителей — опыт копится быстрее.
  focus_witchery: Заговоры, зелья и шёпот на ухо — колдовство на службе интриги.
  focus_mysticism: Созерцание и молитва иным силам — колдовская сила восполняется быстрее.
