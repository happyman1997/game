perk_desc:
  herbalism: "Открывает чары «Целебное зелье»."
  warding_signs: "Открывает чары «Оберег». Порча и чужие интриги даются врагам труднее."
  mending_hands: "Открывает взаимодействие «Исцелить чарами»."
  light_bearer: "Вы становитесь светлым чародеем: исцеление снимает даже проклятие оборотня."
  stormcall: "Открывает чары «Призвать бурю» на время войны."
  weather_lord: Дожди приходят вовремя — урожаи богаче.
  grave_whispers: "Открывает чары «Говорить с мёртвыми». Некромантия — тайна, за которую сжигают."
  raise_dead: "Открывает чары «Поднять мёртвых» и найм восставших мертвецов."
  deathless_will: "Вы становитесь некромантом. Открывается обряд бессмертия."

council_position:
  court_mage: Придворный маг
council_position_desc:
  court_mage: Одарённый советник, сведущий в тайных искусствах. Нужен кандидат с даром или навыком колдовства.
council_task:
  warding: Обереги
  stargazing: Звездочтение
  arcane_research: Тайные изыскания
council_task_desc:
  warding: Маг ограждает правителя от порчи и чужих интриг.
  stargazing: Маг читает звёзды — растёт престиж, а предсказания порой сбываются.
  arcane_research: Маг ищет тайные знания — правитель узнаёт чужие секреты и копит колдовскую силу.

