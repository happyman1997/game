army_specialization:
  battle_mages: Боевые маги
  dead_host: Мёртвая рать
army_specialization_desc:
  battle_mages: "Войско, в котором впереди строя идут колдуны. До первых залпов по врагу бьют молнии и огонь — тем сильнее, чем искуснее вождь. Храм смотрит на это косо: под солнечным обрядом воинство теряет стойкость."
  dead_host: "Рать, которую ведёт некромант. Павшие в бою — свои и чужие — встают в её строй, мёртвым не нужна еда, враг дрожит. Но живые союзники не стоят с ней рядом, а без некроманта рать распадается."
host_rule:
  battle_mages:
    temple: Храм против
    mastery: Искусство вождя
  dead_host:
    master: Ведёт некромант
    no_master: Нет некроманта
