# Paths of progression and legends of the lands (see data/lands.yaml).
trait:
  monster_bane: Bane of Monsters
trait_desc:
  monster_bane: Six monsters have fallen to this hand. The dead, the bloodsuckers and the wolf-men give these lands a wide berth, and the Order of the Silver Flame stands ready to follow its hero.

