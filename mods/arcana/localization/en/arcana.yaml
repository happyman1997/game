  master_of_storms: Master of Storms
  grave_whispers: Grave Whispers
  raise_dead: Raise the Dead
  soul_harvest: Soul Harvest
  deathless_will: Deathless Will
perk_desc:
  herbalism: "Unlocks the spell «Healing Draught»."
  warding_signs: "Unlocks the spell «Ward». Curses and schemes against you are harder."
  mending_hands: "Unlocks the interaction «Heal with Magic»."
  light_bearer: "You become a White Mage: your healing lifts even the werewolf's curse. Unlocks Purifying Light and Bless the Land; the Church honours holy healers."
  stormcall: "Unlocks the spell «Call the Storm» in wartime."
  master_of_storms: "You become a Battlemage. Unlocks Firestorm — a strike against an enemy army near your borders."
  weather_lord: Rain comes when it should — harvests are richer.
  grave_whispers: "Unlocks the spell «Speak with the Dead». Necromancy is a secret people are burned for."
  raise_dead: "Unlocks the spell «Raise the Dead» and recruiting risen dead."
  deathless_will: "You become a Necromancer. The rite of undeath opens. Your arcane power holds the dead together — without it they rot."

council_position:
  court_mage: Court Mage
council_position_desc:
  court_mage: A gifted councillor versed in the arcane arts. Requires a candidate with the gift or sorcery skill.
council_task:
  warding: Wards
  stargazing: Stargazing
  arcane_research: Arcane Research
council_task_desc:
  warding: The mage shields the ruler from curses and schemes.
  stargazing: The mage reads the stars — prestige grows, and prophecies sometimes come true.
  arcane_research: The mage seeks hidden lore — the ruler learns secrets and gathers arcane power.

building:
  mage_tower: Wizard's Tower
building_desc:
  mage_tower: A tall tower with an observatory and a library of forbidden books. Only one who wields sorcery may build it.

