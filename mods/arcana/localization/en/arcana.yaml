ev:
  arcana.0001:
    t: The Gift Awakens
    desc: "On the day [scope:child.first_name] came of age, every candle in the hall lit at once under [scope:child|g:his/her] gaze. The court froze. The gift is in the blood, and now it cannot be hidden. [scope:child|g:He/She] looks at you and waits."
    a: Let them learn. The gift is power
    b: Hide it. No one must know
    c: Send them to a monastery — let prayer tame the gift
  arcana.0002:
    t: Will-o'-the-Wisps
    desc: "At night pale lights kindled over the marshes. They circle at the edge of the forest, as if beckoning. The old folk say whoever follows them finds treasure — or never returns."
    a: Follow the lights
    b: Order the guards to keep away
    c: Call the lights to yourself
  arcana.0003:
    t: The Village Witch
    desc: "Peasants dragged an old woman bound with ropes to the gates. They say milk sours at her glance and children die. The crowd demands a pyre. The old woman says nothing and looks straight at you."
    a: Burn the witch
    b: Let her go in peace
    c: Take her into the court — such a gift will be useful
  arcana.0004:
    t: The Wandering Mage
    desc: "A grey-haired traveler in a star-embroidered cloak entered the hall. He offers his services: prophecy, healing, protection from the evil eye. The price — fifty gold and a place at court."
    a: Hire him
    b: Learn from him
    c: Chase the charlatan away
  arcana.0005:
    t: The Tailed Star
    desc: "A star with a fiery tail burns in the sky. People fall to their knees: some whisper of the end of days, others of a great sign for your house."
    a: It is a sign of favor!
    b: Repent and pray
  arcana.0006:
    t: The Alchemist
    desc: "A learned man with scorched sleeves swears he knows the secret of the philosopher's stone. He needs only a hundred gold for retorts, sulfur and mercury — and in a month he will return thrice as much."
    a: Give him the gold
    b: Refuse
  arcana.0010:
    t: The Night Guest
    desc: "Just before dawn a carriage without arms stopped at the gates. An elegant stranger asks for shelter: he travels only by night — «an ailment of the eyes» — and will reward his host generously."
    a: Welcome the guest
    b: Refuse
  arcana.0011:
    t: The Bloodless Body
    desc: "In the morning a maid was found in a far corridor. No wound, no scream in the night — only two tiny marks on her neck and skin pale as wax. There was not a drop of blood left in her."
    a: Open an inquiry
    b: Hush it up
    c: Call a priest
  arcana.0012:
    t: Thirst
    desc: "The courtiers' pulses thunder in your ears like drums. You catch yourself staring at the cupbearer's neck far too long. The thirst will not wait."
    a: Slake it tonight
    b: Endure
  arcana.0013:
    t: Blood Frenzy
    desc: "You came to beside a body. Your mouth is full of blood, your fingers cramped. You do not remember how it happened — but someone saw you leave that room."
    a: What have I done…
    b: Such is my hunger
  arcana.0020:
    t: The Dead Have Risen
    desc: "Terrible news from [scope:place]: the dead rise from their graves and shamble toward the villages. Peasants flee, abandoning their homes. If nothing is done, the dead will spread to neighboring lands."
    a: Gather men and burn out the dead
    b: Pray for deliverance
    c: Let the dead wander
  arcana.0021:
    t: The Barrow
    desc: "Plowing a new field, peasants struck an ancient barrow. Beneath the earth — a stone chamber, rusted weapons and dull gold. The plowman swears he heard knocking from under the stone."
    a: Plunder the barrow
    b: Fill it in and consecrate it
    c: Study the burial
  arcana.0022:
    t: The Ancestor's Ghost
    desc: "At midnight [scope:ancestor.first_name] stands in your bedchamber — just as you remember him in his last days. The ghost is silent but stretches out a hand, as if wanting to say something."
    a: Listen
    b: Order a mass for his soul
    c: Drive the ghost away
  arcana.0030:
    t: Dragon
    desc: "Over the mountains of [scope:place] a winged shadow the size of a cathedral was seen. At night the peaks glow from within, and herds vanish. A dragon has woken — and it is near."
    a: Prepare for the hunt
    b: Pray for protection
    c: Keep your head down
  arcana.0031:
    t: Dragonslayer
    desc: "The beast is slain. In its lair, among charred bones, lies a mountain of gold hoarded over centuries. Bards are already composing songs of your deed."
    a: Hang the dragon's head in the great hall
    b: Share the hoard with your vassals
    c: Bathe in the dragon's blood
  arcana.0032:
    t: Flame
    desc: "The dragon was faster than the legends said. The last thing you see is a glowing throat and a light brighter than the sun."
    a: …
  arcana.0040:
    t: The Great Wolf
    desc: "On the hunt the hounds raised a beast — a wolf the size of a horse. Its eyes burn yellow, and it does not flee but looks straight at you."
    a: Fight it
    b: Fall back
  arcana.0041:
    t: Full Moon
    desc: "The moon rises over the forest, and your blood runs hot. Your bones ache, and the night smells of prey. The beast inside begs to be let out."
    a: Chain yourself
    b: Give in to the beast
    c: Restrain it with magic
  arcana.0050:
    t: The Fairy Hills
    desc: "Music drifts from the hills — the kind that cannot be forgotten. [scope:wanderer.first_name] has not slept for three nights and begs to be let go to the revel of the Good Folk."
    a: Let them go
    b: Forbid it
    c: Go yourself
  arcana.0051:
    t: Changeling
    desc: "The midwife crosses herself: the child does not cry but stares unblinking at the fire. Its eyes are green as the water of a forest lake. They say it is a changeling — a fairy child."
    a: Love it as your own
    b: Call a priest
    c: Carry it back to the hills
  arcana.0060:
    t: Rite of Undeath
    desc: "The circle is drawn in blood, candles of dead men's tallow burn green. Only the last words remain — and then the heart will either stop forever, or no longer be needed."
    a: Speak the last words
    b: Step back at the last moment
  arcana.0061:
    t: Grave Whispers
    desc: "In the graveyard, where you came for herbs, someone called you by name. The voice came from under the earth. It promises knowledge found in no book."
    a: Listen to the dead
    b: Walk away and do not look back
  arcana.0070:
    t: The Inquisition
    desc: "Men in black arrived at the castle with a bishop's writ. They were told of witchcraft at your court. They are polite, patient — and will not leave without someone guilty."
    a: Pay them off
    b: Hand over the court sorcerer
    c: Drive them away
  arcana.0071:
    t: The Fires Have Died
    desc: "The witch hunt is over. Suspects fill the dungeons, ashes the squares. Some whisper that the land is cleansed, others — that innocents burned."
    a: The land is cleansed
    b: It had to be done
    c: So many innocents…
  arcana.0080:
    t: A Prophecy
    desc: "The court mage did not leave the astrolabe all night. In the morning he says: the stars favor your house — if the moment is not missed."
    a: Heed the prophecy
    b: Announce it at court
