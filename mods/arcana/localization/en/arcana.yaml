secret_type:
  secret_witchcraft: Witchcraft
  secret_necromancy: Necromancy
  secret_vampire: Vampirism
  secret_werewolf: Werewolf's Curse
secret_type_desc:
  secret_witchcraft: Cast curses and love charms. The Church will call it heresy.
  secret_necromancy: Raises the dead. People are burned for this.
  secret_vampire: Not human — a vampire feeding on the blood of the living.
  secret_werewolf: Turns into a beast at the full moon.

decision:
  spell_healing_draught: Healing Draught
  spell_ward: Ward
  spell_stormcall: Call the Storm
  spell_scrying: Gaze into the Crystal
  spell_speak_with_dead: Speak with the Dead
  spell_raise_dead: Raise the Dead
  lich_ritual: Rite of Undeath
  witch_hunt: Witch Hunt
  feed_on_blood: Slake the Thirst
  exorcism: Exorcism
  purge_restless_dead: Burn Out the Dead
  consecrate_lands: Consecrate the Lands
  command_the_dead: Command the Dead
  hunt_the_dragon: Hunt the Dragon
decision_desc:
  spell_healing_draught: A brew of seven herbs and a word of power lift illness, wounds and curses.
  spell_ward: Signs on the threshold and whispers over water — curses and plots cannot touch you.
  spell_stormcall: Clouds gather over the enemy host. Your commanders gain the advantage for half a year.
  spell_scrying: The mist in the crystal parts, revealing others' secrets and plots against you.
  spell_speak_with_dead: The dead know much, and gladly tell one who knows how to ask.
  spell_raise_dead: The graveyard earth stirs. The risen dead take their place in the ranks — and need no pay.
  lich_ritual: Cast off mortal flesh and become a lich. Should the rite fail — death.
  witch_hunt: Search the court and the vassals' lands. Sorcerers to the dungeon, monsters to the light. Not every accused will be guilty.
  feed_on_blood: The thirst is unbearable. Someone at court will be weaker tomorrow — or will not wake at all.
  exorcism: A priest will drive out the curse or the beast. It does not always work.
  purge_restless_dead: Gather men, torches and holy water and burn out the dead in the worst-stricken province.
  consecrate_lands: A procession through all stricken lands. Consecrated ground long keeps the dead from rising.
  command_the_dead: The dead in your lands bow to the necromancer — and become your army.
  hunt_the_dragon: With sword and knights — into the dragon's lair. The prize is its hoard. The price of failure is your life.

interaction:
  cast_curse: Cast a Curse
  love_charm: Love Charm
  heal_other: Heal with Magic
  dark_gift: Offer the Dark Gift
interaction_desc:
  cast_curse: A secret curse will wither the victim's health. The stronger your sorcery and the weaker their defenses, the surer the blow. Sorcery leaves traces.
  love_charm: A potion in the cup — and their heart is drawn to you. May be exposed as witchcraft.
  heal_other: Lift illness, wounds and curses. A White Mage can heal even the werewolf's curse.
  dark_gift: Offer immortality — and eternal thirst. Whoever accepts becomes a vampire.

regiment_type:
  risen_dead: Risen Dead
  silver_flame: Order of the Silver Flame
regiment_type_desc:
  risen_dead: They know no fear, fatigue or pay. Only a necromancer may raise them.
  silver_flame: Warrior monks sworn to root out the unholy. Especially strong against the dead.

casus_belli:
  monster_hunt: Holy Hunt
casus_belli_desc:
  monster_hunt: The monster is exposed. Victory means its death and its capital.
