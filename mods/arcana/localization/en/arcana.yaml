trait:
  gifted: Gifted
  changeling: Changeling
  white_mage: White Mage
  battlemage: Battlemage
  necromancer: Necromancer
  hexed: Hexed
  vampire: Vampire
  lich: Lich
  lycanthrope: Werewolf
  dragonslayer: Dragonslayer
  monster_hunter: Monster Hunter
  fey_touched: Fey-Touched
trait_desc:
  gifted: An old gift runs in this one's blood. Candles gutter when they are angry, and their dreams sometimes come true.
  changeling: They say the true child was carried off into the hills, and this was left in the cradle — a child too beautiful, too quiet.
  white_mage: A healer and a warden whose magic serves life. Even priests sometimes look away.
  battlemage: One who calls lightning onto the battlefield. Enemies flee before the spears meet.
  necromancer: Hears the whispers of graves and commands what should lie still. Almost no one knows.
  hexed: A curse lies on this person. They wither, and physicians cannot say why.
  vampire: Never ages, never sickens, and avoids the sun. Feeds on the blood of the living and guards the secret closely.
  lich: Death no longer has dominion here. The flesh has withered, but the will burns with a cold fire.
  lycanthrope: At the full moon the beast awakens. In the morning they remember nothing — or pretend not to.
  dragonslayer: Slew a dragon. Bards sing of it in every castle.
  monster_hunter: Hunted down and destroyed a monster. Common folk pray for them.
  fey_touched: Went into the fairy hills and came back — changed. Sees more than others do.

lifestyle:
  sorcery_lifestyle: Sorcery
focus:
  focus_arcane_study: Arcane Study
  focus_witchery: Witchery
  focus_mysticism: Mysticism
focus_desc:
  focus_arcane_study: Nights over old scrolls and the notes of masters — experience grows faster.
  focus_witchery: Charms, potions and whispers — sorcery in the service of intrigue.
  focus_mysticism: Contemplation and prayer to other powers — arcane power recovers faster.
