  witch_hunt_tip: "Sorcerers at court may end up in the dungeon and monsters' secrets may come out. Vassals, except zealots, will be frightened."
  thirst_low: "The thirst is still bearable (at least 30 needed)"
  feed_tip: "The victim is a prisoner or a courtier. They may not survive the night, and someone may see."
  exorcism_tip: "A curse is always lifted; the werewolf's curse — usually."
  purge_tip: "The blow depends on the realm's levies, martial skill, knights and the Order of the Silver Flame. An army standing in the province also fights the dead every month."
  consecrate_tip: "Weakens the dead in all of the realm's lands; cleansed land stays consecrated for long."
  command_dead_tip: "The dead of the worst-stricken province become regiments of risen dead."
  dragon_need_prowess: "Requires prowess of at least 8"
  dragon_wary: "The dragon is wary after a recent hunt and lets no one near its lair"
  dragon_hunt_tip: "Success depends on prowess, knights and preparation. The prize is the dragon's hoard and glory. Failure may cost your life."
  dark_gift_tip: "Whoever accepts becomes a vampire, bound to you by blood."
